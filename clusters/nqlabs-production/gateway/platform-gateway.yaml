# Platform Gateway — shared HTTPS entry point for production services
#
# allowedRoutes uses from: Selector with label gateway-access: "true".
# Namespaces with HTTPRoutes must have this label to attach to the gateway.

apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    pod-security.kubernetes.io/enforce: baseline
    gateway-access: "true"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nqlabs-wildcard
  namespace: platform
spec:
  secretName: nqlabs-wildcard-tls
  duration: 2160h
  renewBefore: 360h
  commonName: "*.production.nqlabs.network"
  dnsNames:
    - "*.production.nqlabs.network"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: nqlabs-wildcard-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
---
# HTTP→HTTPS redirect — all port 80 traffic redirected to 443.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: platform
spec:
  parentRefs:
    - name: platform-gateway
      sectionName: http
  rules:
    # Explicit match-all. The Gateway API defaults an omitted matches to
    # PathPrefix "/"; declaring it keeps git as the true source of truth and
    # prevents a permanent ArgoCD OutOfSync on the atomically-managed rules list.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
