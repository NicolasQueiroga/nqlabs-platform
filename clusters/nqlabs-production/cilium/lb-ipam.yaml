# Cilium LoadBalancer IPAM and L2 announcement for nqlabs-production.
#
# VLAN: 10.0.30.0/24
# LB pool: 10.0.30.198–10.0.30.199 (2 IPs for gateway + CoreDNS)
# Interface: eno1 (Intel NUC onboard Ethernet — verify on first boot)

---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: production-lb-pool
  namespace: kube-system
spec:
  blocks:
    - start: 10.0.30.198
      stop: 10.0.30.199
---
apiVersion: cilium.io/v2
kind: CiliumL2AnnouncementPolicy
metadata:
  name: production-l2-policy
  namespace: kube-system
spec:
  loadBalancerIPs: true
  interfaces:
    - eno1
