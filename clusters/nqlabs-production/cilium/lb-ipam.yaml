# Cilium LB IPAM for nqlabs-production.
#
# Production gets its own non-overlapping pair of LAN LoadBalancer IPs:
#   192.168.15.198-199
#
# Planned usage:
#   192.168.15.199  production Gateway
#   192.168.15.198  reserved / future LB service
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: production-pool
spec:
  blocks:
    - start: "192.168.15.198"
      stop: "192.168.15.199"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: production-l2-policy
spec:
  serviceSelector:
    matchLabels: {}
  nodeSelector:
    matchLabels: {}
  interfaces:
    - ens18
  loadBalancerIPs: true
