# Clusterwide ingress default-deny for service namespaces on nqlabs-production.
#
# Scope is intentionally label-based and excludes platform/kube-system/operator
# namespaces. Service Applications created by the ApplicationSet label their
# namespaces with nqlabs.network/environment, and the nqlabs-service chart renders
# a matching allow policy by default. This creates a guardrail for forgotten app
# policy without touching core platform namespaces.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: service-namespaces-default-deny-ingress
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.nqlabs.network/environment
        operator: In
        values:
          - production
  enableDefaultDeny:
    ingress: true
    egress: false
  # Cilium rejects an empty ingress list as "rule does not apply at ingress".
  # An empty non-nil fromEndpoints list is valid and selects no sources, so it
  # enables default-deny without granting traffic. Service-specific CNPs can
  # still add positive allow rules because this is not an ingressDeny policy.
  ingress:
    - fromEndpoints: []
