# Patch for in-cluster CoreDNS to add split-horizon nqlabs.network answers.
#
# Talos manages the base coredns ConfigMap in kube-system; this patch adds a
# nqlabs.network:53 block so ALL pods resolve platform/staging/production hostnames
# directly to the management Gateway LoadBalancer IP without per-app hostAliases.
#
# Manual recovery apply (normally ArgoCD app cluster-dns-split-horizon owns this):
#   kubectl -n kube-system patch configmap coredns --type=merge --patch-file=clusters/nqlabs-management/bootstrap/coredns-nqlabs-stub.yaml
#   kubectl -n kube-system rollout restart deployment/coredns
#
# The management root app-of-apps applies this file via
# clusters/nqlabs-management/argocd/apps/cluster-dns-split-horizon.yaml so node
# rebuilds converge without per-app hostAliases or manual DNS records.
#
# In-cluster default target: management Gateway 192.168.15.195.
# Exact demo smoke-check hostnames below target remote node IPs because management
# pods can reach remote node NodePorts but not remote Cilium Gateway LB IPs.
# External/tailnet clients still resolve these names to the Proxmox Tailscale edge
# via platform CoreDNS. This file is the inside-cluster split-horizon view.

apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
    nqlabs.network:53 {
        errors
        log . {
            class error
        }
        template IN AAAA demo.staging.nqlabs.network {
            match ^demo\.staging\.nqlabs\.network\.$
            rcode NOERROR
        }
        template IN AAAA demo.production.nqlabs.network {
            match ^demo\.production\.nqlabs\.network\.$
            rcode NOERROR
        }
        template IN A demo.staging.nqlabs.network {
            match ^demo\.staging\.nqlabs\.network\.$
            answer "{{ .Name }} 60 IN A 192.168.15.32"
            fallthrough
        }
        template IN A demo.production.nqlabs.network {
            match ^demo\.production\.nqlabs\.network\.$
            answer "{{ .Name }} 60 IN A 192.168.15.33"
            fallthrough
        }
        template IN A platform.nqlabs.network {
            match ^[a-z0-9-]+\.platform\.nqlabs\.network\.$
            answer "{{ .Name }} 60 IN A 192.168.15.195"
            fallthrough
        }
        template IN A staging.nqlabs.network {
            match ^[a-z0-9-]+\.staging\.nqlabs\.network\.$
            answer "{{ .Name }} 60 IN A 192.168.15.195"
            fallthrough
        }
        template IN A production.nqlabs.network {
            match ^[a-z0-9-]+\.production\.nqlabs\.network\.$
            answer "{{ .Name }} 60 IN A 192.168.15.195"
            fallthrough
        }
        forward . 192.168.15.194
        cache 30
    }
