# Falco runtime security DaemonSet on every cluster (alert mode).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-falco
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      targetRevision: "9.1.0"
      helm:
        releaseName: falco
        valueFiles:
          - $values/infrastructure/security/falco/values.yaml
          - $values/infrastructure/security/falco/values-management.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      path: infrastructure/security/falco
      directory:
        include: "{falcosidekick-discord-externalsecret.yaml,httproute.yaml,network-policies.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
        gateway-access: "true"
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
