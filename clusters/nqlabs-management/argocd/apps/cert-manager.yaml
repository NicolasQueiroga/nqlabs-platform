# cert-manager for nqlabs-management.
#
# ServiceMonitor is disabled because cert-manager (sync-wave 0) installs before
# kube-prometheus-stack (sync-wave 3) which provides the ServiceMonitor CRD.
# To enable: move cert-manager to sync-wave 4+ (after kube-prometheus-stack),
# or install the ServiceMonitor CRD separately at an earlier wave.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: "v1.20.2"
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/infrastructure/security/cert-manager/values.yaml
        parameters:
          - name: prometheus.servicemonitor.enabled
            value: "false"
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # cert-manager injects caBundle into its webhook configs at runtime.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
