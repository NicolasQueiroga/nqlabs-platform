# OpenBao — self-hosted secrets backend + PKI
#
# Multi-source Application:
#   1. Helm chart (openbao/openbao) with values from git
#   2. Git ref for valueFiles
#   3. Git path for platform manifests (TLS cert, network policies, HTTPRoute)
#
# Sync wave 3: after rook-ceph (wave 0-1, ceph-block SC) and
# cert-manager-config (wave 2, nqlabs-internal-ca issuer for bootstrap).
# The HTTPRoute (wave 4 inside manifests) waits for the gateway (wave 4).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: "0.26.2"
      helm:
        releaseName: openbao
        valueFiles:
          - $values/infrastructure/security/openbao/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      path: infrastructure/security/openbao/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
        gateway-access: "true"
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
