# Ironic Standalone Operator (IrSO) for nqlabs-management.
#
# Installs the IrSO controller which manages Ironic deployments via the
# Ironic CR.  IrSO requires cert-manager to be healthy before installation.
#
# After IrSO is running, the metal3-ironic app creates the Ironic instance.
#
# Sync wave: 1 (after cert-manager at wave 0)
# IrSO version: v0.10.0

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metal3-irso
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: infrastructure/metal3/irso
  destination:
    server: https://kubernetes.default.svc
    namespace: ironic-standalone-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
