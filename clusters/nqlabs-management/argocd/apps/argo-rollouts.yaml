# Argo Rollouts for nqlabs-management.
#
# Progressive delivery controller + read-only dashboard.
# Dashboard exposed at rollouts.platform.nqlabs.network via Gateway HTTPRoute.
#
# Depends on: kube-prometheus-stack (ServiceMonitor CRD must exist).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: "2.41.0"
      helm:
        releaseName: argo-rollouts
        valueFiles:
          - $values/infrastructure/delivery/argo-rollouts/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
    # RBAC for Gateway API HTTPRoute management (canary traffic shifting).
    # Also contains the CiliumNetworkPolicy allowing gateway ingress to the dashboard.
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      path: infrastructure/delivery/argo-rollouts/rbac
    # Management-only dashboard route (through the Authentik outpost). Kept out of
    # the shared rbac dir so it is not applied to the staging/production clusters.
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      path: infrastructure/delivery/argo-rollouts/dashboard-route
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
        gateway-access: "true"
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
