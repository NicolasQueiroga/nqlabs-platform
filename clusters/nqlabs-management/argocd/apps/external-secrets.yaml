# External Secrets Operator for nqlabs-management.
#
# This is intentionally operator-only. The desktop-lab app also syncs
# ClusterSecretStore and ExternalSecrets, including tailscale namespace resources.
# Management should add those config resources only after dependent namespaces/apps
# are present and the app model is cluster-aware.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: "2.6.0"
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/infrastructure/security/external-secrets/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # ESO injects caBundle into its webhook configs at runtime.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
