# CloudNativePG operator for nqlabs-management.
#
# PostgreSQL operator backing the platform identity layer (Authentik) and
# available for future stateful services. Installs CRDs (Cluster, Pooler, etc.).
#
# sync-wave 1 so the CRDs exist before the authentik app (wave 5) applies its
# postgres Cluster CR.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: "0.28.3"
      helm:
        releaseName: cloudnative-pg
        valueFiles:
          - $values/infrastructure/identity/cloudnative-pg/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
