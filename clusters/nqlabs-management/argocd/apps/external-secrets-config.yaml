# External Secrets config for nqlabs-management.
#
# The runtime secrets backend is OpenBao (ClusterSecretStore nqlabs-openbao,
# defined by the openbao app). This app now only syncs the ESO webhook
# network policies. The legacy nqlabs-1password ClusterSecretStore was retired
# once all ExternalSecrets were migrated to OpenBao KV.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: infrastructure/security/external-secrets
    directory:
      include: "network-policies.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
