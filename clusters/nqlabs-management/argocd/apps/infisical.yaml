# Infisical — self-hosted secrets manager
#
# Multi-source Application:
#   1. Helm chart (infisical-standalone) with values from git
#   2. Git ref for valueFiles
#   3. Git path for platform manifests (CNPG, Valkey, network policies, HTTPRoute)
#
# Sync wave 3: after rook-ceph (wave 0-1, ceph-block SC) and
# cert-manager-config (wave 2). The HTTPRoute (wave 4) waits for the gateway.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
      chart: infisical-standalone
      targetRevision: "1.8.0"
      helm:
        releaseName: infisical
        valueFiles:
          - $values/infrastructure/security/infisical/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      path: infrastructure/security/infisical/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
        gateway-access: "true"
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
