# Public edge — Cloudflare Tunnel on the production cluster.
# Deploys infrastructure/networking/cloudflared; the tunnel token comes from
# 1Password (cloudflared-tunnel/token) via External Secrets. Ingress rules
# (hostname -> in-cluster Service) are managed in the Cloudflare dashboard.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-cloudflared
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # After external-secrets + its ClusterSecretStore so the token can materialize.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: infrastructure/networking/cloudflared
  destination:
    name: nqlabs-production
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
