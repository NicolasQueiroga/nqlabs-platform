apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: "3.8.1"
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/infrastructure/security/kyverno/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # Kyverno 3.8.x creates new CRD types at runtime (validatingpolicies,
  # mutatingpolicies, etc.) and a migration Job that are not tracked by the
  # Helm chart. Suppress the orphaned-resources warning for these.
  orphanedResources:
    warn: false
  # Kyverno mutates its own CRD caBundle + webhook configs at runtime; ignore that drift.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
        - .webhooks[].rules
        - .webhooks[].namespaceSelector
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
        - .webhooks[].rules
        - .webhooks[].namespaceSelector
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-kyverno-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: infrastructure/security/kyverno/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    retry:
      limit: 5
    syncOptions:
      - ServerSideApply=true
  # Kyverno generates PolicyReport resources at runtime that are not in git.
  orphanedResources:
    warn: false
