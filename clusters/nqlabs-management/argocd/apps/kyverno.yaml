apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: "3.8.1"
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/infrastructure/security/kyverno/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      # selfHeal: false — Kyverno mutates its own webhook configs and CRD
      # caBundle at runtime. selfHeal=true would revert these mutations,
      # causing perpetual sync conflicts.
      selfHeal: false
    retry:
      limit: 5
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # Kyverno mutates its own CRD caBundle + webhook configs at runtime; ignore that drift.
  # CRDs: ignore status, managedFields, and conversion webhook fields that
  # Kubernetes/Kyverno modifies after installation.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
        - .status
        - .metadata.annotations
        - .metadata.labels
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
        - .webhooks[].rules
        - .webhooks[].namespaceSelector
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
        - .webhooks[].rules
        - .webhooks[].namespaceSelector
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-kyverno-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: infrastructure/security/kyverno/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      # selfHeal: false — Kyverno defaults fields on ClusterPolicy at admission
      # time. selfHeal=true would revert these defaults, causing sync conflicts.
      selfHeal: false
    retry:
      limit: 5
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # Kyverno defaults these fields on ClusterPolicy at admission time; ignore
  # the drift so ArgoCD doesn't show perpetual OutOfSync.
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.admission
        - .spec.emitWarning
        - .spec.validationFailureAction
        - .spec.rules[].skipBackgroundRequests
        - .spec.rules[].validate.allowExistingViolations
        - .spec.rules[].verifyImages[].required
        - .spec.rules[].verifyImages[].useCache
        - .spec.rules[].verifyImages[].verifyDigest
        - .spec.rules[].verifyImages[].attestors[].entries[].signatureAlgorithm
