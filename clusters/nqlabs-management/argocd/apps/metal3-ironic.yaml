# Ironic instance for nqlabs-management.
#
# Creates the Ironic CR that triggers IrSO to deploy Ironic.
# Ironic is configured for virtual media provisioning (no PXE/DHCP).
#
# Sync wave: 2 (after IrSO controller at wave 1)
# Ironic version: v34.0

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metal3-ironic
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: infrastructure/metal3/ironic
  destination:
    server: https://kubernetes.default.svc
    namespace: metal3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
