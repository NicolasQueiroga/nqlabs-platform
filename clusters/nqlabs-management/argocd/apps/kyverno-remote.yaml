# Kyverno + baseline policies on the staging and production clusters (Audit).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: "3.8.1"
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/infrastructure/security/kyverno/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
  destination:
    name: nqlabs-staging
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
        - .webhooks[].rules
        - .webhooks[].namespaceSelector
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].failurePolicy
        - .webhooks[].rules
        - .webhooks[].namespaceSelector
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-kyverno-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: infrastructure/security/kyverno/policies
  destination:
    name: nqlabs-staging
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    retry:
      limit: 5
    syncOptions:
      - ServerSideApply=true
