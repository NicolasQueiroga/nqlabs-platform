# Deferred remote-cluster backup apps.
# Applied later, after management bootstrap is 100% healthy and the
# staging/production clusters are registered in ArgoCD.
---
# Velero on staging: offsite AWS/Azure + node-agent file backup.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-velero
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: "12.0.3"
      helm:
        releaseName: velero
        valueFiles:
          - $values/infrastructure/backup/velero/values-remote.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      path: infrastructure/backup/velero/manifests
  destination:
    name: nqlabs-staging
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        # Velero node-agent needs hostPath access to kubelet pod/plugin dirs for
        # file-level PV backup. Scope privileged PSA to the velero namespace only.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
