# local-path-provisioner — Phase 0 storage
#
# Multi-source pattern:
#   source 1 — Helm chart from upstream rancher/local-path-provisioner repo
#   source 2 — our values file from nqlabs-platform repo (referenced as $values)
#
# This is the first platform service managed entirely by ArgoCD.
# No manual helm install — git push triggers deployment.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # wave 0: must be ready before etcd-dns (wave 1) creates a local-path PVC
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform

  sources:
    # Helm chart from upstream
    - repoURL: https://github.com/rancher/local-path-provisioner.git
      targetRevision: v0.0.36
      path: deploy/chart/local-path-provisioner
      helm:
        valueFiles:
          - $values/infrastructure/storage/local-path/values.yaml

    # Our values file — referenced as $values above
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # local-path-provisioner creates helper pods with hostPath volumes.
    # Requires privileged Pod Security policy on its namespace.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
