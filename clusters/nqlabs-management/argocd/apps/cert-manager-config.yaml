# cert-manager config for nqlabs-management.
#
# Requires:
#   - External Secrets Operator installed
#   - nqlabs-1password ClusterSecretStore Ready
#   - cert-manager CRDs installed

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 2: after external-secrets-config (wave 1) so nqlabs-1password
    # ClusterSecretStore is Ready before cert-manager ExternalSecrets sync.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: infrastructure/security/cert-manager
    directory:
      include: "{cluster-issuers.yaml,externalsecrets.yaml,network-policies.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
