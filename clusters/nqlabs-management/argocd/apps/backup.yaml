# Velero on-demand backup/DR to Azure Blob (default) + AWS S3 (secondary).
# No schedule, no node-agent — trigger manually before risky ops.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-velero
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations: { argocd.argoproj.io/sync-wave: "4" }
spec:
  project: platform
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: "12.0.3"
      helm:
        releaseName: velero
        valueFiles:
          - $values/infrastructure/backup/velero/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      path: infrastructure/backup/velero/manifests
  destination: { server: https://kubernetes.default.svc, namespace: velero }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
