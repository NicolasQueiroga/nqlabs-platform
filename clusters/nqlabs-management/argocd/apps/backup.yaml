# Backup/DR: Velero (engine -> local Ceph RGW / AWS S3 / Azure Blob).
---
# Velero on-demand backup to Ceph RGW (default) + AWS S3 + Azure Blob.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-velero
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: "12.0.3"
      helm:
        releaseName: velero
        valueFiles:
          - $values/infrastructure/backup/velero/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      path: infrastructure/backup/velero/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        # Velero node-agent needs hostPath access to kubelet pod/plugin dirs for
        # file-level PV backup. Scope privileged PSA to the velero namespace only.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
