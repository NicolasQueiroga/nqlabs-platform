# Redpanda — Kafka-compatible event streaming platform
#
# Multi-source Application:
#   1. Helm chart (redpanda/redpanda) with values from git
#   2. Git ref for valueFiles
#   3. Git path for platform manifests (network policies, HTTPRoute, monitoring)
#
# Sync wave 3: after rook-ceph (wave 0-1, ceph-block SC).
# The HTTPRoute (wave 4) waits for the gateway.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redpanda
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: https://charts.redpanda.com
      chart: redpanda
      targetRevision: "26.1.5"
      helm:
        releaseName: redpanda
        valueFiles:
          - $values/infrastructure/streaming/redpanda/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      path: infrastructure/streaming/redpanda/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: redpanda
  ignoreDifferences:
    # The Redpanda Helm chart renders null/empty values and omits server-side
    # defaults that the Kubernetes API server adds. With ServerSideApply these
    # show as permanent OutOfSync differences. Ignore them all.
    - group: apps
      kind: StatefulSet
      jsonPointers:
        # Empty/null fields rendered by chart but stripped by API server
        - /spec/template/spec/imagePullSecrets
        - /spec/template/spec/nodeSelector
        - /spec/template/spec/priorityClassName
        - /spec/template/spec/tolerations
        # Server-side defaults added by API server to pod spec
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/template/spec/serviceAccount
        # initContainers: chart renders env:null, server strips it;
        # server adds imagePullPolicy: IfNotPresent
        - /spec/template/spec/initContainers/0/env
        - /spec/template/spec/initContainers/0/imagePullPolicy
        - /spec/template/spec/initContainers/1/env
        - /spec/template/spec/initContainers/1/imagePullPolicy
        - /spec/template/spec/initContainers/2/env
        - /spec/template/spec/initContainers/2/imagePullPolicy
        # Server adds defaultMode: 420 to configMap volumes
        - /spec/template/spec/volumes/1/configMap/defaultMode
        # Server adds apiVersion: v1 to fieldRef in container env
        - /spec/template/spec/containers/0/env/0/valueFrom/fieldRef/apiVersion
        - /spec/template/spec/containers/0/env/1/valueFrom/fieldRef/apiVersion
        - /spec/template/spec/containers/0/env/2/valueFrom/fieldRef/apiVersion
        - /spec/template/spec/containers/1/env/0/valueFrom/fieldRef/apiVersion
        - /spec/template/spec/containers/1/env/1/valueFrom/fieldRef/apiVersion
        - /spec/template/spec/containers/1/env/2/valueFrom/fieldRef/apiVersion
        # Server adds protocol: TCP to container ports
        - /spec/template/spec/containers/0/ports
        # Server adds successThreshold, timeoutSeconds to probes
        - /spec/template/spec/containers/0/livenessProbe
        - /spec/template/spec/containers/1/readinessProbe
        # K8s version env var changes with cluster upgrades
        - /spec/template/spec/containers/0/env/3/value
        - /spec/template/spec/containers/0/env/4/value
        - /spec/template/spec/containers/0/env/5/value
        - /spec/template/spec/containers/1/env/3/value
        - /spec/template/spec/containers/1/env/4/value
        - /spec/template/spec/containers/1/env/5/value
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        # Redpanda requires privileged PSA: the "tuning" init container needs
        # SYS_RESOURCE capability and privileged=true to set kernel parameters
        # (e.g. vm.max_map_count) required for Redpanda's performance tuning.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
        gateway-access: "true"
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
