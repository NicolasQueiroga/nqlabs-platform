---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services-preview
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
spec:
  description: Ephemeral per-PR preview workloads. Deployed to the nqlabs-staging cluster.

  sourceNamespaces:
    - argocd

  sourceRepos:
    - https://github.com/NicolasQueiroga/nqlabs-platform.git

  # Previews run on the staging cluster (reusing the *.staging wildcard cert,
  # gateway, and edge) in throwaway namespaces named <service>-pr-<number>.
  destinations:
    - name: nqlabs-staging
      namespace: "*-pr-*"

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ResourceQuota
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: ReplicaSet
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: external-secrets.io
      kind: ExternalSecret
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
    - group: argoproj.io
      kind: Experiment

  orphanedResources:
    warn: false
