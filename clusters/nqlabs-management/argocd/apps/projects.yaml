# ArgoCD AppProjects — deployment boundaries for the NQLabs Platform
#
# Projects are the first security boundary inside ArgoCD. They define which
# repositories an Application can render from, where it can deploy, and which
# Kubernetes resource kinds it can manage.

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    # Root app must create projects before Applications reference them.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Core platform infrastructure, controllers, networking, storage, delivery, and observability.

  sourceRepos:
    - https://github.com/NicolasQueiroga/nqlabs-platform.git
    - https://argoproj.github.io/argo-helm
    - https://charts.jetstack.io
    - https://charts.external-secrets.io
    - https://coredns.github.io/helm
    - https://kubernetes-sigs.github.io/external-dns/
    - https://github.com/rancher/local-path-provisioner.git
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://pkgs.tailscale.com/helmcharts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: dns
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: local-path-storage
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: platform
    - server: https://kubernetes.default.svc
      namespace: tailscale
    - server: https://192.168.15.32:6443
      namespace: "*"
    - server: https://192.168.15.33:6443
      namespace: "*"

  # Platform apps intentionally manage cluster-scoped primitives: CRDs,
  # ClusterRoles, ClusterIssuers, GatewayClasses, Cilium resources, etc.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Staging service workloads.

  sourceRepos:
    - https://github.com/NicolasQueiroga/nqlabs-platform.git

  destinations:
    - server: https://192.168.15.32:6443
      namespace: "*-staging"

  # Namespace creation is cluster-scoped; required for CreateNamespace=true in
  # generated service Applications.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: ReplicaSet
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: external-secrets.io
      kind: ExternalSecret
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
    - group: argoproj.io
      kind: Experiment

  orphanedResources:
    warn: true

---
