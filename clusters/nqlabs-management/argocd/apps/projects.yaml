# ArgoCD AppProjects — deployment boundaries for the NQLabs Platform
#
# Projects are the first security boundary inside ArgoCD. They define which
# repositories an Application can render from, where it can deploy, and which
# Kubernetes resource kinds it can manage.

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    # AppProjects must exist before any Application references them.
    # sync-wave -11 ensures they're created before the argocd app at -10.
    argocd.argoproj.io/sync-wave: "-11"
spec:
  description: Core platform infrastructure, controllers, networking, storage, delivery, and observability.

  # Only allow Applications defined in the argocd namespace to use this project.
  sourceNamespaces:
    - argocd

  sourceRepos:
    - https://github.com/NicolasQueiroga/nqlabs-platform.git
    - https://argoproj.github.io/argo-helm
    - https://charts.jetstack.io
    - https://charts.external-secrets.io
    - https://coredns.github.io/helm
    - https://kubernetes-sigs.github.io/external-dns/
    - https://github.com/rancher/local-path-provisioner.git
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://pkgs.tailscale.com/helmcharts
    - https://kyverno.github.io/kyverno
    - https://falcosecurity.github.io/charts
    - https://vmware-tanzu.github.io/helm-charts

  # Platform apps are trusted and may target any namespace on the management
  # cluster (in-cluster) or the registered environment clusters.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
    - name: nqlabs-staging
      namespace: "*"
    - name: nqlabs-production
      namespace: "*"

  # Platform apps intentionally manage cluster-scoped primitives: CRDs,
  # ClusterRoles, ClusterIssuers, GatewayClasses, Cilium resources, etc.
  # Wildcards are intentional — the platform project is trusted and manages
  # all cluster infrastructure. Narrowing would require listing every CRD
  # kind and updating on each new CRD addition.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
spec:
  description: Staging service workloads.

  sourceNamespaces:
    - argocd

  sourceRepos:
    - https://github.com/NicolasQueiroga/nqlabs-platform.git

  # Cluster-aware by NAME (not server IP): staging services run on the remote
  # cluster registered in management ArgoCD as "nqlabs-staging". The cluster is
  # the environment boundary, so namespaces use the plain service name.
  destinations:
    - name: nqlabs-staging
      namespace: "*"

  # Namespace creation is cluster-scoped; required for CreateNamespace=true in
  # generated service Applications.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: ReplicaSet
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: external-secrets.io
      kind: ExternalSecret
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
    - group: argoproj.io
      kind: Experiment

  orphanedResources:
    warn: true

