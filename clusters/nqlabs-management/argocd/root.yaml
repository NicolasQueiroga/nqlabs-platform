# Management root Application — safe first app-of-apps seed for nqlabs-management.
#
# This intentionally does NOT watch all of platform/argocd/apps yet. The legacy
# root Application watches the whole directory and is desktop-lab oriented; applying
# it to nqlabs-management would try to sync desktop-lab Cilium/DNS/Gateway/Tailscale
# settings and could cause IP or access-layer collisions.
#
# Watches the management cluster's own ArgoCD Application directory:
#   clusters/nqlabs-management/argocd/apps
#
# Shared platform app definitions may still be reused, but management should expose
# them through cluster-local wrappers when cluster-specific overrides are required.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: clusters/nqlabs-management/argocd/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
