# Management root Application — safe first app-of-apps seed for nqlabs-management.
#
# This intentionally does NOT watch all of platform/argocd/apps yet. The legacy
# root Application watches the whole directory and is desktop-lab oriented; applying
# it to nqlabs-management would try to sync desktop-lab Cilium/DNS/Gateway/Tailscale
# settings and could cause IP or access-layer collisions.
#
# Watches the management cluster's own ArgoCD Application directory:
#   clusters/nqlabs-management/argocd/apps
#
# Initial bootstrap intentionally includes MANAGEMENT-ONLY apps. Multi-cluster
# fan-out (staging/production foundation + service factory) is enabled later,
# after management reaches a fully healthy Authentik-backed state.
#
# Shared platform app definitions may still be reused, but management should expose
# them through cluster-local wrappers when cluster-specific overrides are required.
#
# NOTE: targetRevision: HEAD is used for lab convenience. For production,
# pin to a specific Git tag or commit SHA to prevent unreviewed changes
# from auto-deploying.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: clusters/nqlabs-management/argocd/apps
    directory:
      # Deferred until the management cluster bootstrap is 100% healthy.
      exclude: "{backup-remote.yaml,falco-remote.yaml,kyverno-remote.yaml,production-cloudflared.yaml,production-foundation.yaml,remote-cluster-dns-split-horizon.yaml,remote-prometheus-agent.yaml,service-factory.yaml,staging-foundation.yaml,tracing-profiling-remote.yaml}"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
