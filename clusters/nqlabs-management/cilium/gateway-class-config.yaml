# GatewayClass + CiliumGatewayClassConfig — restrict gateway LB to tailnet IPs.
#
# The Cilium Helm chart creates a GatewayClass without parametersRef, so we
# disable it (gatewayAPI.gatewayClass.create: false in values.yaml) and manage
# our own GatewayClass here with a parametersRef pointing to the
# CiliumGatewayClassConfig.
#
# The CiliumGatewayClassConfig sets loadBalancerSourceRanges on the
# auto-created LoadBalancer service. Only traffic from Tailscale tailnet
# (100.64.0.0/10) can reach the gateway. LAN traffic without tailnet is
# blocked at the BPF level.
#
# Requires bpf.lbSourceRangeAllTypes: true in Cilium values for source range
# filtering to work with externalTrafficPolicy=Cluster.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
  description: The default Cilium GatewayClass
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: cilium
    namespace: kube-system
---
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: cilium
  namespace: kube-system
spec:
  service:
    loadBalancerSourceRanges:
      - 100.64.0.0/10
    loadBalancerSourceRangesPolicy: Allow
