# GatewayClass + CiliumGatewayClassConfig — restrict gateway LB to tailnet IPs.
#
# The Cilium Helm chart creates a GatewayClass without parametersRef, so we
# use gatewayAPI.gatewayClass.create: "auto" in values.yaml (Helm creates it
# if missing but doesn't delete it). We manage the GatewayClass here with a
# parametersRef pointing to the CiliumGatewayClassConfig.
#
# The CiliumGatewayClassConfig sets loadBalancerSourceRanges on the
# auto-created LoadBalancer service. Only traffic from Tailscale tailnet
# (100.64.0.0/10) can reach the gateway. LAN traffic without tailnet is
# blocked at the BPF level.
#
# Requires bpf.lbSourceRangeAllTypes: true in Cilium values for source range
# filtering to work with externalTrafficPolicy=Cluster.
#
# Helm ownership labels are included so Helm upgrades don't fail with
# "invalid ownership metadata" when adopting the GatewayClass.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: cilium
    meta.helm.sh/release-namespace: kube-system
spec:
  controllerName: io.cilium/gateway-controller
  description: The default Cilium GatewayClass
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: cilium
    namespace: kube-system
---
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: cilium
  namespace: kube-system
spec:
  service:
    loadBalancerSourceRanges:
      - 100.64.0.0/10
    loadBalancerSourceRangesPolicy: Allow
