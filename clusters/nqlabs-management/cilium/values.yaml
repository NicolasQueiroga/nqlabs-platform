# Cilium cluster override — nqlabs-management
# Use with: -f infrastructure/networking/cilium/values.yaml -f clusters/nqlabs-management/cilium/values.yaml

k8sServiceHost: 192.168.15.31
k8sServicePort: 6443

# Single-node management VM today. Raise to 2 only after multiple schedulable
# nodes exist; otherwise Helm creates an intentionally Pending replica.
operator:
  replicas: 1
