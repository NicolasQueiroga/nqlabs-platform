# Standalone CoreDNS Helm values — nqlabs-management
#
# This is the external/tailnet-facing authoritative view for nqlabs.network.
# It answers wildcard platform/staging/production names with the Proxmox
# Tailscale edge IP; Proxmox HAProxy then fans out by SNI to the target cluster.
#
# In-cluster pods use a separate kube-dns split-horizon patch so they resolve
# those same wildcard names to the cluster-local Gateway LB. Do not add per-app
# hostAliases or per-app DNS records here.

replicaCount: 2

# Fully-qualified image reference (Kyverno restrict-image-registries)
image:
  repository: docker.io/coredns/coredns
  tag: "1.13.1"

service:
  name: coredns-dns
  type: LoadBalancer
  loadBalancerIP: "192.168.15.194"
  port: 53
  targetPort: 53
  annotations: {}

serviceType: LoadBalancer

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

prometheus:
  service:
    enabled: true
  monitor:
    enabled: true
    interval: 30s

servers:
  - zones:
      - zone: .
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: template
        parameters: IN A nqlabs.network
        configBlock: |-
          match ^proxmox\.platform\.nqlabs\.network\.$
          answer "{{ .Name }} 60 IN A 100.105.35.84"
          fallthrough
      - name: template
        parameters: IN A platform.nqlabs.network
        configBlock: |-
          match ^[a-z0-9-]+\.platform\.nqlabs\.network\.$
          answer "{{ .Name }} 60 IN A 100.105.35.84"
      - name: template
        parameters: IN A staging.nqlabs.network
        configBlock: |-
          match ^[a-z0-9-]+\.staging\.nqlabs\.network\.$
          answer "{{ .Name }} 60 IN A 100.105.35.84"
      - name: template
        parameters: IN A production.nqlabs.network
        configBlock: |-
          match ^[a-z0-9-]+\.production\.nqlabs\.network\.$
          answer "{{ .Name }} 60 IN A 100.105.35.84"
      - name: etcd
        parameters: nqlabs.network
        configBlock: |-
          stubzones
          path /skydns
          endpoint http://10.97.76.140:2379
      - name: forward
        parameters: . 1.1.1.1 8.8.8.8
      - name: cache
        parameters: "30"
      - name: loop
      - name: reload
      - name: loadbalance
