# ClusterSecretStore — OpenBao backend for nqlabs-staging
#
# Remote-cluster ESO uses AppRole auth to authenticate to the management
# OpenBao cluster via the gateway URL. AppRole credentials are bootstrapped
# manually on this cluster after the management OpenBao bootstrap Job runs.
#
# Bootstrap (one-time manual step):
#   kubectl create secret generic openbao-approle \
#     -n external-secrets \
#     --from-literal=role-id=<role-id-from-bootstrap-job> \
#     --from-literal=secret-id=<secret-id-from-bootstrap-job>
#
# The gateway terminates TLS with a Let's Encrypt wildcard cert for
# *.nqlabs.network, so no caBundle is needed.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: nqlabs-openbao
spec:
  provider:
    vault:
      server: "https://openbao.platform.nqlabs.network"
      path: "kv"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleRef:
            name: openbao-approle
            namespace: external-secrets
            key: role-id
          secretRef:
            name: openbao-approle
            namespace: external-secrets
            key: secret-id
