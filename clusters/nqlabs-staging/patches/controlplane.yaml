# Common Talos control-plane patch for nqlabs-staging (Intel NUC hardware).
#
# Applied during `talosctl gen config --config-patch-control-plane`.
# Per-node settings (IP, hostname, certSANs) are in bootstrap/talos/patch-stg-cp-XX.yaml.
#
# Hardware assumptions (verify on first boot):
#   - Disk: /dev/nvme0n1 (NVMe SSD)
#   - NIC: eno1 (Intel I219-V — common on Intel NUCs)
#   - No BMC/IPMI/Redfish — manual USB boot provisioning

machine:
  install:
    disk: /dev/nvme0n1
  network:
    interfaces:
      - interface: eno1
  certSANs:
    - 10.0.20.9
cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: none
  proxy:
    disabled: true
