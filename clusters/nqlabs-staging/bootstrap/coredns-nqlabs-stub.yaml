# In-cluster CoreDNS split-horizon answers for nqlabs-staging pods.
# Keeps platform/service hostnames routable from inside the cluster without
# per-pod hostAliases or public DNS dependency.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . { class error }
        prometheus :9153
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf { max_concurrent 1000 }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
    nqlabs.network:53 {
        errors
        log . { class error }
        template IN A platform.nqlabs.network {
            match ^[a-z0-9-]+\.platform\.nqlabs\.network\.$
            answer "{{ .Name }} 60 IN A 192.168.15.195"
            fallthrough
        }
        template IN A staging.nqlabs.network {
            match ^[a-z0-9-]+\.staging\.nqlabs\.network\.$
            answer "{{ .Name }} 60 IN A 192.168.15.196"
            fallthrough
        }
        template IN A production.nqlabs.network {
            match ^[a-z0-9-]+\.production\.nqlabs\.network\.$
            answer "{{ .Name }} 60 IN A 192.168.15.198"
            fallthrough
        }
        forward . 192.168.15.194
        cache 30
    }
