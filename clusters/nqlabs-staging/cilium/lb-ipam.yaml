# Cilium LoadBalancer IPAM and L2 announcement for nqlabs-staging.
#
# VLAN: 10.0.20.0/24
# LB pool: 10.0.20.196–10.0.20.197 (2 IPs for gateway + CoreDNS)
# Interface: eno1 (Intel NUC onboard Ethernet — verify on first boot)

---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: staging-lb-pool
  namespace: kube-system
spec:
  blocks:
    - start: 10.0.20.196
      stop: 10.0.20.197
---
apiVersion: cilium.io/v2
kind: CiliumL2AnnouncementPolicy
metadata:
  name: staging-l2-policy
  namespace: kube-system
spec:
  loadBalancerIPs: true
  interfaces:
    - eno1
