machine:
  install:
    disk: /dev/sda
  network:
    interfaces:
      - interface: ens18
        dhcp: false
        addresses:
          - 192.168.15.30/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.15.1
    nameservers:
      - 192.168.15.1
      - 1.1.1.1
cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: none
  proxy:
    disabled: true
