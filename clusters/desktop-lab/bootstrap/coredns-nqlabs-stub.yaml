# Patch for in-cluster CoreDNS to add nqlabs.network stub zone.
#
# Talos manages the base coredns ConfigMap in kube-system; this patch adds a
# nqlabs.network:53 block so ALL pods can resolve platform/staging/production
# hostnames without hostAliases hacks.
#
# Apply AFTER cluster bootstrap, BEFORE running platform apps with endpoint probes:
#   kubectl -n kube-system patch configmap coredns --type=merge --patch-file=clusters/desktop-lab/bootstrap/coredns-nqlabs-stub.yaml
#   kubectl -n kube-system rollout restart deployment/coredns
#
# This will revert if the node is rebuilt and Talos re-applies its manifests.
# Re-apply this patch during desktop-lab bootstrap (see cluster-lifecycle.md).
#
# Platform CoreDNS LB IP: 192.168.15.192  (desktop-lab)
# Authoritative for: nqlabs.network, *.platform.nqlabs.network,
#                    *.staging.nqlabs.network, *.production.nqlabs.network

apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
    nqlabs.network:53 {
        forward . 192.168.15.192
        cache 30
        log . {
            class error
        }
    }
