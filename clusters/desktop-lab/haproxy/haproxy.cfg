# Proxmox HAProxy edge config — current partial management cutover.
#
# Installed on: nqlabs-desktop /etc/haproxy/haproxy.cfg
# Backup before this cutover: /etc/haproxy/haproxy.cfg.bak-20260620T021639Z
#
# HTTPS only. TLS terminates at the Kubernetes Gateway, not HAProxy.
#
# Current state:
#   argocd.platform.nqlabs.network -> nqlabs-management Gateway 192.168.15.195
#   everything else                -> desktop-lab Gateway 192.168.15.193
#
# Do not wildcard *.platform to management until Grafana/Prometheus/Alertmanager/
# Rollouts/Uptime and other platform tools have been migrated.

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend nqlabs_platform_https_tailscale
    bind 100.105.35.84:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    use_backend cilium_management_gateway_https if { req.ssl_sni -i argocd.platform.nqlabs.network }
    default_backend cilium_desktop_gateway_https

backend cilium_desktop_gateway_https
    server desktop-platform-gateway 192.168.15.193:443 check

backend cilium_management_gateway_https
    server management-platform-gateway 192.168.15.195:443 check
