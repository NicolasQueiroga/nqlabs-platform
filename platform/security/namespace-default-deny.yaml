# Default-deny ingress CiliumNetworkPolicies for namespaces with NO ArgoCD app.
#
# Only namespaces that are not managed by any ArgoCD app belong here.
# All other namespaces have their deny-ingress CNP in their owning app's
# source directory — single-owner principle, no SharedResourceWarning.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: cilium-secrets
spec:
  endpointSelector: {}
  ingress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: default
spec:
  endpointSelector: {}
  ingress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: kube-public
spec:
  endpointSelector: {}
  ingress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: kube-node-lease
spec:
  endpointSelector: {}
  ingress: []
