# Default-deny ingress CiliumNetworkPolicies for namespaces without existing CNPs.
# These prevent any pod in the namespace from receiving incoming traffic unless
# explicitly allowed by another CNP. Applied at sync-wave 0 so allow rules
# (also at wave 0) can be added alongside without blocking.
#
# CAPI/Metal3 namespaces (cabpt-system, cacppt-system, capi-system, capm3-system,
# cluster-api-system) are managed by the cluster-api app — their CNPs are in
# infrastructure/metal3/cluster-api/network-policies.yaml to avoid
# ArgoCD SharedResourceWarning.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: kyverno
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector: {}
  ingress: []
---
