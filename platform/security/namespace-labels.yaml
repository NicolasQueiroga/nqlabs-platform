# PSA enforce labels for namespaces without their own ArgoCD app.
#
# These namespaces are either built-in (default, kube-public, kube-node-lease,
# kube-system) or created by upstream provider manifests that don't include
# PSA labels (cabpt-system, cacppt-system, capi-system, cilium-secrets).
#
# capm3-system is NOT included here — it already has `restricted` PSA labels
# from the vendored CAPI infrastructure-components.yaml. Overriding via SSA
# would cause a managed-field conflict.
#
# Applied via the namespace-default-deny ArgoCD app with ServerSideApply,
# so labels are merged onto existing Namespace resources without conflict.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cabpt-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: cacppt-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: capi-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: cilium-secrets
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-public
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-node-lease
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
