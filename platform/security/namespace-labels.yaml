# PSA enforce labels for namespaces without their own ArgoCD app.
#
# Only namespaces that are NOT managed by any other ArgoCD app belong here.
# CAPI namespaces have PSA labels set directly in their vendored component
# manifests under infrastructure/metal3/cluster-api/.
#
# Applied via the namespace-default-deny ArgoCD app with ServerSideApply.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cilium-secrets
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-public
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-node-lease
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
