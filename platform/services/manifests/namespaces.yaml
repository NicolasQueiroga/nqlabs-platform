# Service namespaces are created by generated ArgoCD Applications using
# CreateNamespace=true and managedNamespaceMetadata.
#
# Current Mac lab namespace shape:
#   <service>-staging
#   <service>-production
#
# Future multi-cluster shape:
#   cluster/nqlabs-staging    namespace/<service>
#   cluster/nqlabs-production namespace/<service>
#
# This file intentionally contains no Namespace objects. The old shared
# `staging` and `production` namespaces were an early demo/proof shape only.
