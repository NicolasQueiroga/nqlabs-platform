# CiliumNetworkPolicies for the argocd namespace.
#
# ArgoCD components communicate internally:
#   argocd-server → argocd-repo-server (8081), argocd-redis (6379)
#   argocd-application-controller → argocd-redis (6379), argocd-repo-server (8081)
#   argocd-applicationset-controller → argocd-redis (6379)
#
# External ingress:
#   Gateway → argocd-server (8080) — UI/API
#   Gateway → argocd-applicationset-controller (7000) — webhook
#   Monitoring/Prometheus → argocd-server (8083) — metrics
#
# Egress:
#   argocd-server, argocd-repo-server → git (github.com:443)
#   argocd-application-controller → kube-apiserver (443, 6443)
#   All components → kube-dns (53)
#
# IMPORTANT: Cilium 1.19.4 with VXLAN tunnel mode drops cross-node traffic
# when toPorts is specified on egress toEndpoints rules. Therefore, ALL
# egress rules in this file omit toPorts. Ingress rules retain toPorts
# (they work fine — the issue is only on the egress/VXLAN path).
#
# The default-deny is applied LAST (sync-wave 1) so that allow rules are
# in place first — avoiding a brief window where all traffic is blocked.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-applicationset-controller
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "7000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
---
# Internal: argocd-server + application-controller + applicationset-controller → redis (6379)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-redis-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-redis
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-server
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-application-controller
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-applicationset-controller
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# Internal: argocd-server + application-controller → repo-server (8081)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-repo-server-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-server
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-application-controller
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
---
# Egress: all argocd pods → internal services (redis, repo-server, server)
# NO toPorts — Cilium 1.19.4 with VXLAN tunnel mode drops cross-node traffic
# when toPorts is specified on egress toEndpoints rules.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-internal-egress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: argocd
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-redis
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-repo-server
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-server
---
# Egress: all argocd pods → kube-dns and CoreDNS
# NO toPorts — same Cilium VXLAN toPorts bug.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-dns-egress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: argocd
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dns
            app.kubernetes.io/name: coredns-dns
---
# Egress: all argocd pods → external services (git, container registries, etc.)
# Uses toEntities: world instead of toFQDNs because toFQDNs requires the Cilium
# DNS proxy which doesn't work reliably with the VXLAN toPorts bug.
# NO toPorts — same Cilium VXLAN toPorts bug.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-git-egress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: argocd
  egress:
    - toEntities:
        - world
---
# Egress: application-controller → kube-apiserver
# NO toPorts — same Cilium VXLAN toPorts bug.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-apiserver-egress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-application-controller
  egress:
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
    - toEntities:
        - remote-node
---
# Egress: argocd-server → OIDC provider (Authentik) for SSO
# Uses toEntities: cluster for gateway hairpin (Cilium Gateway DNATs traffic
# to a dynamic listener port, so toPorts: 443 won't match).
# Also allows direct to Authentik pods.
# NO toPorts — same Cilium VXLAN toPorts bug.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-allow-oidc-egress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            app.kubernetes.io/component: server
    - toEntities:
        - cluster
---
# Default-deny (applied LAST so allow rules are in place first)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-default-deny
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: []
  egress:
    - toEndpoints: []
