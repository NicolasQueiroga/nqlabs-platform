# Tailscale Operator — cluster access layer
#
# Exposes K8s services to the tailnet (hen-exponential.ts.net) without
# public IPs or port-forwarding.
#
# operator-oauth secret is created automatically by ESO before this app runs.
# ExternalSecret: infrastructure/security/external-secrets/secrets/tailscale-oauth.yaml
# No manual bootstrap required.
#
# sync-wave 2: runs after external-secrets (wave 0) and external-secrets-config
# (wave 1) so the operator-oauth secret exists before the operator starts.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform

  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: "1.98.4"
      helm:
        valueFiles:
          - $values/infrastructure/networking/tailscale/values.yaml

    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
