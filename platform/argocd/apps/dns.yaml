# DNS Stack — three Applications deployed in dependency order
#
# 1. etcd-dns     — etcd backend for CoreDNS record storage
# 2. coredns-dns  — authoritative nameserver for nqlabs.network
# 3. external-dns — watches services, writes records to etcd
#
# All in namespace: dns
# Naming convention enforced via annotation:
#   external-dns.alpha.kubernetes.io/hostname: <resource>.<category>.<env>.nqlabs.network

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: etcd-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # wave 1: after local-path-provisioner (wave 0) — etcd PVC requires local-path StorageClass
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: infrastructure/dns/etcd/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: dns
  ignoreDifferences:
    # Kubernetes defaults these fields on StatefulSet containers — not in git manifest
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
        - /spec/volumeClaimTemplates/0/spec/volumeMode
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # wave 2: after etcd-dns (wave 1) — CoreDNS backend must be ready before CoreDNS starts
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://coredns.github.io/helm
      chart: coredns
      targetRevision: "1.46.0"
      helm:
        releaseName: coredns-dns
        valueFiles:
          - $values/infrastructure/dns/coredns/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # wave 3: after coredns-dns (wave 2) — external-dns writes to etcd; CoreDNS must be
    # serving before external-dns starts creating records
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: "1.21.1"
      helm:
        releaseName: external-dns
        valueFiles:
          - $values/infrastructure/dns/external-dns/values.yaml
    - repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
