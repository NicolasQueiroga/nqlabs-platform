# Service factory — namespaces plus ApplicationSet-generated service Applications
#
# The ApplicationSet reads apps/*/environments/*.yaml and creates one ArgoCD
# Application per service/environment using charts/nqlabs-service.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-factory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: platform/services/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
