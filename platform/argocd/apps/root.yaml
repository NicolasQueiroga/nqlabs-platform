# Root Application — app-of-apps pattern
#
# This is the seed. It watches platform/argocd/apps/ in git.
# Every Application manifest added to that directory is automatically
# picked up and reconciled by ArgoCD.
#
# Applied manually once during bootstrap:
#   kubectl apply -f platform/argocd/apps/root.yaml
#
# After that, all platform additions are git commits — no manual kubectl.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # Prevent ArgoCD from deleting this Application if it gets pruned
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: platform/argocd/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true      # Remove Applications deleted from git
      selfHeal: true   # Re-sync if cluster drifts from git
    syncOptions:
      - CreateNamespace=true
