# Platform Gateway — Cilium Gateway API entry point + HTTPRoutes
#
# Manages:
#   - platform namespace
#   - nqlabs-wildcard TLS cert (copy from cert-manager → platform namespace)
#   - platform-gateway Gateway resource
#   - All HTTPRoutes in infrastructure/networking/gateway/

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: infrastructure/networking/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  ignoreDifferences:
    # Kubernetes defaults finalizers on Namespace
    - kind: Namespace
      jsonPointers:
        - /spec/finalizers
    # Gateway API defaults empty string for group on certificateRefs
    - group: gateway.networking.k8s.io
      kind: Gateway
      jsonPointers:
        - /spec/listeners/0/tls/certificateRefs/0/group
    # Gateway API defaults group, kind, weight on HTTPRoute refs
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
