# Tailscale Config — Connector and Service proxies
#
# Manages the Tailscale-specific Kubernetes resources:
#   - Connector (subnet router) — advertises desktop LAN to tailnet
#   - coredns-tailscale Service  — exposes CoreDNS on Tailscale for split DNS
#   - platform-gateway-tailscale Service — exposes HTTPS Gateway on Tailscale
#
# sync-wave 3: runs after tailscale-operator (wave 2) so the Connector CRD
# (tailscale.com/v1alpha1) exists before we apply a Connector resource.
#
# UPDATE before desktop bootstrap:
#   Set the correct desktop LAN subnet in infrastructure/networking/tailscale/subnet-router.yaml
#   before the cluster syncs (see Phase F of docs/runbooks/desktop-lab-bootstrap.md).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform

  source:
    repoURL: https://github.com/NicolasQueiroga/nqlabs-platform.git
    targetRevision: HEAD
    path: infrastructure/networking/tailscale

  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
