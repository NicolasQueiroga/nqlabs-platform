apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nqlabs-observability-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
spec:
  groups:
    - name: nqlabs.recording.node
      interval: 30s
      rules:
        - record: nqlabs:node_cpu_utilization:ratio
          expr: 1 - avg by (cluster, instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
        - record: nqlabs:node_memory_utilization:ratio
          expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
        - record: nqlabs:node_filesystem_utilization:ratio
          expr: 1 - (node_filesystem_avail_bytes{fstype!="",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"} / node_filesystem_size_bytes{fstype!="",mountpoint!~"/run.*|/var/lib/kubelet/pods.*"})
        - record: nqlabs:namespace_cpu_usage:cores
          expr: sum by (cluster, namespace) (rate(container_cpu_usage_seconds_total{container!="",image!=""}[5m]))
        - record: nqlabs:namespace_memory_working_set:bytes
          expr: sum by (cluster, namespace) (container_memory_working_set_bytes{container!="",image!=""})

    - name: nqlabs.platform.availability
      rules:
        - alert: NQLabsPrometheusDown
          expr: absent(up{job=~"kube-prometheus-stack-prometheus|prometheus-operated"} == 1)
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus is not being scraped"
            description: "Prometheus scrape target is absent or down."
        - alert: NQLabsAlertmanagerDown
          expr: absent(up{job=~"kube-prometheus-stack-alertmanager|alertmanager-operated"} == 1)
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager is not being scraped"
            description: "Alertmanager scrape target is absent or down."
        - alert: NQLabsGrafanaDown
          expr: up{job=~"kube-prometheus-stack-grafana|grafana"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Grafana target is down"
            description: "Grafana is not responding to Prometheus scrape."
        - alert: NQLabsKubeStateMetricsDown
          expr: up{job=~".*kube-state-metrics.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "kube-state-metrics is down"
            description: "kube-state-metrics target {{ $labels.instance }} is down."
        - alert: NQLabsNodeExporterDown
          expr: up{job=~".*node-exporter.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "node-exporter is down"
            description: "node-exporter target {{ $labels.instance }} is down."

    - name: nqlabs.node.resources
      rules:
        - alert: NQLabsNodeCPUHigh
          expr: nqlabs:node_cpu_utilization:ratio > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node CPU utilization high"
            description: "{{ $labels.instance }} CPU utilization is above 85% for 15m."
        - alert: NQLabsNodeMemoryHigh
          expr: nqlabs:node_memory_utilization:ratio > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node memory utilization high"
            description: "{{ $labels.instance }} memory utilization is above 90% for 10m."
        - alert: NQLabsNodeFilesystemFilling
          expr: nqlabs:node_filesystem_utilization:ratio > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node filesystem filling"
            description: "{{ $labels.instance }} {{ $labels.mountpoint }} filesystem is above 85%."
        - alert: NQLabsNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node not Ready"
            description: "Node {{ $labels.node }} is not Ready."

    - name: nqlabs.observability.pipeline
      rules:
        - alert: NQLabsThanosReceiveDown
          expr: up{job=~".*thanos.*receive.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Thanos Receive is down"
            description: "Remote-write ingestion is unavailable."
        # Deferred during management-only bootstrap. Re-enable when the root
        # Application starts syncing remote Prometheus agents again.
        - alert: NQLabsOtelCollectorDown
          expr: up{job="otel-collector"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OpenTelemetry collector is down"
            description: "otel-collector target {{ $labels.instance }} is down."
        - alert: NQLabsPromtailDown
          expr: up{job=~".*promtail.*"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Promtail is down"
            description: "Promtail target {{ $labels.instance }} is down."
        - alert: NQLabsGatusDown
          expr: up{job="gatus"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Gatus is down"
            description: "Gatus metrics endpoint is down."

    - name: nqlabs.identity.availability
      rules:
        - alert: NQLabsAuthentikServerDown
          expr: kube_deployment_status_replicas_available{namespace="authentik",deployment="authentik-server"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Authentik server is down"
            description: "Authentik server deployment has no available replicas. SSO and forward-auth are unavailable."
        - alert: NQLabsAuthentikWorkerDown
          expr: kube_deployment_status_replicas_available{namespace="authentik",deployment="authentik-worker"} < 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Authentik worker is down"
            description: "Authentik worker deployment has no available replicas. Blueprint reconciliation and background tasks are stalled."
        - alert: NQLabsAuthentikPostgresDown
          expr: sum(kube_pod_status_ready{namespace="authentik",condition="true",pod=~"authentik-pg-.*"}) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Authentik PostgreSQL is down"
            description: "Authentik PostgreSQL has no ready instance pods. Authentik cannot persist sessions or users."
        - alert: NQLabsAuthentikValkeyDown
          expr: kube_statefulset_status_replicas_ready{namespace="authentik",statefulset="authentik-valkey"} < 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Authentik Valkey is down"
            description: "Valkey cache/broker has no ready replicas. Authentik performance degraded, Celery tasks stalled."
        - alert: NQLabsAuthentikPostgresBackupFailing
          expr: cnpg_backup_last_failed_timestamp_seconds{cluster="authentik-pg"} > cnpg_backup_last_succeeded_timestamp_seconds{cluster="authentik-pg"}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Authentik PostgreSQL backups are failing"
            description: "Last CNPG backup for authentik-pg failed more recently than the last success."

    - name: nqlabs.storage.pvc
      rules:
        - alert: NQLabsPVCUsageHigh
          expr: |
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.70
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is above 70%"
            description: "PVC {{ $labels.persistentvolumeclaim }} (namespace: {{ $labels.namespace }}) is at {{ $value | humanizePercentage }} capacity. Investigate before it fills up."
        - alert: NQLabsPVCUsageCritical
          expr: |
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is above 85%"
            description: "PVC {{ $labels.persistentvolumeclaim }} (namespace: {{ $labels.namespace }}) is at {{ $value | humanizePercentage }} capacity. Pod will crash soon if the PVC fills up."

    - name: nqlabs.database.cnpg
      rules:
        - alert: NQLabsCNPGWalArchivingFailing
          expr: |
            cnpg_cluster_status_phase{cluster="authentik-pg"} != 0
            or
            cnpg_pg_stat_archiver_failed_wals{cluster="authentik-pg"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CNPG WAL archiving is failing for {{ $labels.cluster }}"
            description: "WAL archiving has been failing for 10m. WAL files will accumulate on the PVC and eventually fill it, causing PostgreSQL to refuse to start. Purge stale objects from the RGW WAL bucket and restart the CNPG pod. See runbook sso-authentik.md."
