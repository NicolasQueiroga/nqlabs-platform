# Grafana datasources managed by the Grafana sidecar.
# kube-prometheus-stack Grafana sidecar watches ConfigMaps with label:
#   grafana_datasource: "1"

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: false
        jsonData:
          maxLines: 1000
      - name: Thanos
        type: prometheus
        access: proxy
        url: http://thanos-query-frontend.monitoring.svc.cluster.local:9090
        isDefault: false
        jsonData:
          timeInterval: 30s
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: Loki
          serviceMap:
            datasourceUid: Thanos
      - name: Pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://pyroscope.monitoring.svc.cluster.local:4040
        isDefault: false
