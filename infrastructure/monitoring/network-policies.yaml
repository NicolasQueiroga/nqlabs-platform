# NetworkPolicies for the monitoring namespace.
#
# Deny all ingress by default, then allow:
#   - Intra-namespace traffic (Promtail→Loki, Grafana→Prometheus/Loki, etc.)
#   - Platform Gateway (namespaces with gateway-access label) → UIs
#   - Prometheus egress to all namespaces (scraping)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow intra-namespace traffic within monitoring.
# Promtail → Loki gateway, Grafana → Prometheus/Loki, Prometheus → Alertmanager.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-intra-namespace
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Allow Gateway (namespaces with gateway-access label) to reach monitoring UIs.
# Also allow traffic from the Cilium Envoy gateway proxy, which runs with
# hostNetwork: true in kube-system. Its traffic appears as the node IP, not
# from a pod in any namespace, so namespaceSelector alone doesn't match.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-gateway
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              gateway-access: "true"
        - ipBlock:
            cidr: 192.168.15.0/24
      ports:
        - port: 80
          protocol: TCP
        - port: 3000
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 9090
          protocol: TCP
        - port: 9093
          protocol: TCP
---
# Allow Cilium Gateway API proxy (reserved "ingress" identity) to reach monitoring UIs.
# The Cilium envoy connects directly to pod IPs on container ports (not service ports),
# using the Cilium-internal "ingress" entity rather than a namespace label. A standard
# K8s NetworkPolicy cannot match this identity; a CiliumNetworkPolicy is required.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-allow-cilium-gateway
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
---
# Cluster-wide policy: allow monitoring namespace pods to reach all pods
# for health checks (Gatus) and metrics scraping (Prometheus).
#
# This CCNP eliminates the need to update each target namespace's CNP
# when adding new Gatus monitors. Without it, every namespace that has
# a CiliumNetworkPolicy with ingress rules must explicitly allow the
# monitoring namespace — which is easy to forget and causes silent
# 10s timeouts in Gatus health checks.
#
# Security rationale: the monitoring namespace is already trusted (Prometheus
# has unrestricted egress for cluster-wide scraping). Gatus only does HTTP GET
# health checks. This CCNP does not change the egress posture — it only
# ensures the ingress side of target namespaces doesn't block health checks.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: monitoring-allow-health-checks
spec:
  description: "Allow monitoring namespace (Gatus, Prometheus) to reach all pods for health checks and metrics scraping"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
# Allow Prometheus to scrape all pods in all namespaces (egress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-prometheus-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    - {}
