# NetworkPolicies for the monitoring namespace.
#
# Deny all ingress by default, then allow:
#   - Intra-namespace traffic (Promtail→Loki, Grafana→Prometheus/Loki, etc.)
#   - Platform Gateway (namespaces with gateway-access label) → UIs
#   - Prometheus egress to all namespaces (scraping)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-deny-ingress
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: []
---
# Allow intra-namespace traffic within monitoring.
# Promtail → Loki gateway, Grafana → Prometheus/Loki, Prometheus → Alertmanager.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-allow-intra-namespace
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
---
# Allow Gateway (namespaces with gateway-access label) to reach monitoring UIs.
# Also allow traffic from the Cilium Envoy gateway proxy, which runs with
# hostNetwork: true in kube-system. Its traffic appears as the node IP, not
# from a pod in any namespace, so namespaceSelector alone doesn't match.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-allow-gateway
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            gateway-access: "true"
    - fromCIDR:
        - 192.168.15.0/24
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
---
# Allow Cilium Gateway API proxy (reserved "ingress" identity) to reach monitoring UIs.
# The Cilium envoy connects directly to pod IPs on container ports (not service ports),
# using the Cilium-internal "ingress" entity rather than a namespace label. A standard
# K8s NetworkPolicy cannot match this identity; a CiliumNetworkPolicy is required.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-allow-cilium-gateway
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
---
# Allow Falco sidekick to post warning+ events into Alertmanager.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-allow-falco-alertmanager
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": falco
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
---
# Allow the embedded Authentik proxy outpost to reach protected monitoring UIs
# after login. Prometheus/Alertmanager/Thanos already share gateway-allowed
# ports; Pyroscope needs 4040 explicitly.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-allow-authentik-proxy
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": authentik
      toPorts:
        - ports:
            - port: "4040"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
            - port: "9115"
              protocol: TCP
---
# Allow Prometheus to scrape all pods in all namespaces (egress)
# This MUST be a CiliumClusterNetworkPolicy (CCNP), not a namespace-scoped CNP.
# A namespace-scoped CNP with toEndpoints: [{}] only matches pods in the SAME
# namespace (monitoring), not all pods cluster-wide. A CCNP is cluster-scoped
# so toEndpoints: [{}] matches all pods in ALL namespaces.
apiVersion: cilium.io/v2
kind: CiliumClusterNetworkPolicy
metadata:
  name: monitoring-allow-prometheus-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: monitoring
      app.kubernetes.io/name: prometheus
  egress:
    # Scrape all pods in all namespaces
    - toEndpoints:
        - {}
    # Scrape node exporters (host network)
    - toEntities:
        - host
        - remote-node
    # Blackbox probes to external endpoints
    - toEntities:
        - world
