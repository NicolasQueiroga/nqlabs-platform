# Gatus configuration — monitors + OIDC security + storage.
#
# Config is mounted as a ConfigMap at /config/config.yaml.
# OIDC client secret is injected via env var (OIDC_CLIENT_SECRET) and
# resolved by Gatus at runtime (see Authentik integration guide).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/part-of: nqlabs-platform
data:
  config.yaml: |
    # ── Storage ──────────────────────────────────────────────────────────────
    storage:
      type: sqlite
      path: /data/data.db

    # ── UI ────────────────────────────────────────────────────────────────────
    ui:
      header: "NQLabs Platform Status"
      login-subtitle: "Sign in with your Authentik account"

    # ── OIDC Security ──────────────────────────────────────────────────────────
    # Native OIDC integration with Authentik — no proxy needed.
    # Gatus uses ${VAR_NAME} syntax for env var interpolation in config.
    #
    # issuer-url uses the internal cluster service URL because the Cilium
    # gateway resets TLS connections from pods (hairpin/hairpinned traffic
    # through the LoadBalancer IP).  Gatus fetches the OIDC discovery document
    # from this URL at startup; if it cannot reach the issuer the pod crashes.
    # The internal URL lets Gatus start successfully and validate tokens.
    #
    # Browser-based OIDC login will redirect to the internal URL (returned in
    # the discovery document), which the user's browser cannot reach.  This is
    # a known limitation until the Cilium gateway hairpin issue is resolved.
    # See: https://github.com/cilium/cilium/issues/??? (gateway TLS hairpin)
    #
    # The redirect-url remains the external URL so that Authentik sends the
    # authorization code back to the browser-reachable Gatus callback.
    security:
      oidc:
        issuer-url: "http://authentik-server.authentik.svc.cluster.local:80/application/o/gatus/"
        client-id: "${OIDC_CLIENT_ID}"
        client-secret: "${OIDC_CLIENT_SECRET}"
        redirect-url: "https://uptime.platform.nqlabs.network/authorization-code/callback"
        scopes: ["openid", "profile", "email"]

    # ── Metrics ────────────────────────────────────────────────────────────────
    metrics: true

    # ── Endpoints ──────────────────────────────────────────────────────────────
    # Internal health checks — verify backends are up (bypass gateway/auth).
    # Edge auth probes are handled by Blackbox Exporter (see blackbox-probes.yaml).
    endpoints:
      # ── Identity ─────────────────────────────────────────────────────────────
      - name: Authentik
        group: Identity
        url: http://authentik-server.authentik.svc.cluster.local:80
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      # ── GitOps ───────────────────────────────────────────────────────────────
      - name: ArgoCD
        group: GitOps
        url: http://argocd-server.argocd.svc.cluster.local:80
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: Argo Rollouts
        group: GitOps
        url: http://argo-rollouts-dashboard.argo-rollouts.svc.cluster.local:3100/rollouts
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      # ── Monitoring ────────────────────────────────────────────────────────────
      - name: Grafana
        group: Monitoring
        url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: Prometheus
        group: Monitoring
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/-/healthy
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: Alertmanager
        group: Monitoring
        url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093/-/healthy
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      # ── Edge / Gateway ───────────────────────────────────────────────────────
      # Uses the internal gateway service HTTP port because the Cilium gateway
      # resets TLS connections from pods (hairpin issue with LoadBalancer IP).
      # The HTTP port returns 301 → HTTPS, confirming the gateway is up.
      # External HTTPS is verified by Blackbox Exporter.
      - name: Gateway (HTTP redirect)
        group: Edge
        url: http://cilium-gateway-platform-gateway.platform.svc.cluster.local:80
        interval: 2m
        client:
          follow-redirects: false
        conditions:
          - "[STATUS] == 301"

      - name: Demo Staging
        group: Services / Staging
        url: https://demo.staging.nqlabs.network:31132
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: Demo Production
        group: Services / Production
        url: https://demo.production.nqlabs.network:32027
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: Thanos Query
        group: Observability
        url: http://thanos-query-frontend.monitoring.svc.cluster.local:9090/-/healthy
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: Tempo
        group: Observability
        url: http://tempo.monitoring.svc.cluster.local:3200/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"

      - name: Pyroscope
        group: Observability
        url: http://pyroscope.monitoring.svc.cluster.local:4040/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
