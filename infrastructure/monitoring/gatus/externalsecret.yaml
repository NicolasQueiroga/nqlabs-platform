# Gatus OIDC client secret — sourced from OpenBao kv/gatus-oidc.
# Used by Gatus for native OIDC authentication with Authentik.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-oidc
  namespace: monitoring
spec:
  # Static OIDC client secret. Avoid periodic provider reads during fleet-wide
  # reconciliation; revisit when OpenBao-backed rotation is added.
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: gatus-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: gatus-oidc/client_secret
