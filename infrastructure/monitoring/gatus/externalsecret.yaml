# Gatus OIDC client secret — sourced from OpenBao KV (kv/gatus-oidc).
# Used by Gatus for native OIDC authentication with Authentik.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-oidc
  namespace: monitoring
spec:
  # Static OIDC client secret sourced directly from 1Password.
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: gatus-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: gatus-oidc
        property: client_secret
