# Gatus OIDC client secret — sourced from 1Password (NQLabs vault).
# Used by Gatus for native OIDC authentication with Authentik.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-oidc
  namespace: monitoring
spec:
  # Static OIDC client secret. Avoid periodic provider reads during fleet-wide
  # reconciliation; revisit when secrets move to OpenBao and rotation is automated.
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: gatus-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: gatus-oidc/client_secret
