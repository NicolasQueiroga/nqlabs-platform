# Gatus — developer-oriented health dashboard with native OIDC support.
#
# Replaces Uptime Kuma. Gatus has built-in OIDC authentication (no proxy
# workaround needed) and integrates directly with Authentik via OIDC.
#
# UI: https://uptime.platform.nqlabs.network (OIDC → Authentik)
# Data: PVC gatus-data (local-path, 1Gi, SQLite)
# Port: 8080
# Config: ConfigMap gatus-config (monitors + OIDC settings)
#
# OIDC client secret is injected via env var from the gatus-oidc ExternalSecret.
# Gatus resolves env var names referenced in the config file at runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        nqlabs.io/config-revision: "2026-06-26-uptime-coverage-gateway-fix"
      labels:
        app.kubernetes.io/name: gatus
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: nqlabs-platform
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.25.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OIDC_CLIENT_ID
              value: "gatus"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gatus-oidc
                  key: client_secret
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
