# kube-prometheus-stack Helm values — NQLabs Platform
#
# Chart: prometheus-community/kube-prometheus-stack 86.2.3
# Namespace: monitoring
#
# PVC backup strategy: Prometheus (20Gi) and Alertmanager (2Gi) PVCs are on
# ceph-block storage. Velero does not snapshot ceph-block PVCs by default.
# For backup: 1) Use Velero with restic for file-level backup, or 2) Use
# Prometheus remote_write to a long-term storage backend, or 3) Accept data
# loss on node failure (lab environment — metrics are ephemeral).
#
# Talos/Cilium notes:
#   - kubeProxy disabled   — replaced by Cilium
#   - kubeEtcd disabled    — Talos etcd listens on localhost only
#   - kubeControllerManager/kubeScheduler disabled — Talos exposes on 127.0.0.1 only
#   - CoreDNS enabled      — kube-system CoreDNS is accessible
#   - No tolerations needed — single node has no taints

# ── Disabled components (not accessible on Talos + Cilium) ──────────────────
kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

# ── Grafana ─────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  replicas: 1

  # Grafana access is owned by Authentik, not a standalone local-admin
  # credential in 1Password. The chart may create an internal bootstrap admin
  # Secret, but the login form is disabled and OAuth auto-login is enforced;
  # Authentik groups below decide who becomes Grafana Admin/Viewer.

  # OIDC client secret for Authentik SSO (key GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET).
  # Grafana maps the GF_<SECTION>_<KEY> env var to [auth.generic_oauth] client_secret.
  envFromSecret: grafana-oidc

  ingress:
    enabled: false   # HTTPRoute used instead

  persistence:
    enabled: true
    storageClassName: ceph-block
    size: 2Gi

  grafana.ini:
    server:
      root_url: https://grafana.platform.nqlabs.network
      serve_from_sub_path: false
    # SSO via Authentik (OIDC). client_secret comes from the grafana-oidc
    # Secret via GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (envFromSecret above).
    auth:
      # Disable the local login form — SSO via Authentik is the only login.
      # Break-glass: use kubectl port-forward to access Grafana directly.
      oauth_auto_login: true
      disable_login_form: true
    "auth.generic_oauth":
      enabled: true
      name: Authentik
      client_id: grafana
      scopes: "openid profile email groups"
      auth_url: https://auth.platform.nqlabs.network/application/o/authorize/
      token_url: https://auth.platform.nqlabs.network/application/o/token/
      api_url: https://auth.platform.nqlabs.network/application/o/userinfo/
      # Map Authentik groups -> Grafana roles.
      role_attribute_path: "contains(groups[*], 'platform-admins') && 'Admin' || 'Viewer'"
      allow_assign_grafana_admin: true
      use_pkce: true

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      # Grafana polls dashboard files every 30s via the file provider, so skip
      # the admin API reload path. This avoids bootstrap drift when the
      # generated local admin secret no longer matches the persisted DB user.
      skipReload: true
    datasources:
      enabled: true
      skipReload: true
    # Resource requests for ALL sidecars (Kyverno require-resource-requests)
    # The Grafana chart uses a single resources block for all sidecar containers
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  defaultDashboardsTimezone: browser

  # Resource requests (Kyverno require-resource-requests)
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  # Run as non-root (Kyverno require-run-as-nonroot)
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # init-chown-data init container — sets ownership on the PV
  # Resource requests (Kyverno require-resource-requests)
  initChownData:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# ── Prometheus ──────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: "4GB"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

    # Discover ServiceMonitors/PodMonitors/Rules across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    # External labels for multi-cluster identification
    externalLabels:
      cluster: nqlabs-management

    # Local Prometheus keeps 7d for fast queries; Thanos Receive stores a
    # durable long-term copy and also ingests remote-cluster PrometheusAgent data.
    remoteWrite:
      - url: http://thanos-receive.monitoring.svc.cluster.local:19291/api/v1/receive
        queueConfig:
          capacity: 10000
          maxSamplesPerSend: 2000
          maxShards: 8

    # UI authentication is handled centrally by Authentik (forward-auth proxy
    # outpost at the gateway), NOT per-app basic auth. The prometheus-operator
    # reserves --web.config.file, so additionalArgs basic auth is unsupported.
    # See docs/decisions/identity-provider.md.

    # Talos + subPath bind mounts block writes for non-root UIDs at the kernel level
    # even with correct fsGroup/ownership. Prometheus must run as root on this setup.
    # monitoring namespace is enforced as 'privileged' — running as root is intentional.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      fsGroup: 0
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      runAsUser: 0
      runAsNonRoot: false
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi

# ── Alertmanager ────────────────────────────────────────────────────────────
alertmanager:
  # Global Alertmanager config — routes ALL alerts (any namespace) to Discord.
  # Previously used AlertmanagerConfig CRD, but the Prometheus Operator injects
  # namespace="monitoring" as a matcher on CRD-generated routes, so only alerts
  # with namespace=monitoring were routed. The global config has no such
  # limitation. The Discord webhook URL is read from a K8s Secret mounted
  # via the `secrets` list below.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: [alertname, severity, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname="Watchdog"
          continue: false
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity=~"warning|info"
        equal: [alertname, namespace, instance]
      - source_matchers:
          - alertname=~"NQLabsNodeNotReady|KubeNodeNotReady"
        target_matchers:
          - severity=~"warning|critical"
        equal: [node]
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/webhook_url
            send_resolved: true
            username: NQLabs Alertmanager
            title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} NQLabs {{ .CommonLabels.alertname }}'
            message: |-
              {{ range .Alerts }}
              **Severity:** `{{ .Labels.severity }}`
              **Target:** `{{ .Labels.instance }}`
              **Summary:** {{ .Annotations.summary }}
              **Description:** {{ .Annotations.description }}
              {{ end }}
  # Mount the Discord webhook secret as a file for api_url_file reference.
  secrets: ["alertmanager-discord-webhook"]
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi

    # UI authentication is handled centrally by Authentik (forward-auth proxy
    # outpost at the gateway), NOT per-app basic auth. See
    # docs/decisions/identity-provider.md.

    # Same Talos subPath kernel restriction that affects Prometheus applies here:
    # non-root UIDs can't write to ceph-block PVC directories even with correct
    # fsGroup/ownership. Run as root same as Prometheus. monitoring namespace
    # enforces 'privileged' pod security — running as root is intentional here.
    # (Bug found 2026-06-19: nflog/silences permission denied for 12+ hours)
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      fsGroup: 0
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      runAsUser: 0
      runAsNonRoot: false
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

# ── Prometheus Operator ─────────────────────────────────────────────────────
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # config-reloader sidecar — used by both Prometheus and Alertmanager
  # Resource requests (Kyverno require-resource-requests)
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# ── kube-state-metrics ──────────────────────────────────────────────────────
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

# ── node-exporter ───────────────────────────────────────────────────────────
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # node-exporter needs host access for metrics but should still drop caps
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
