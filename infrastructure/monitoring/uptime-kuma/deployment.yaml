# Uptime Kuma — self-hosted uptime monitor and status page.
#
# Provides a human-friendly status dashboard and second vantage point
# for endpoint probing, complementing the internal Blackbox Exporter.
#
# UI: https://uptime.platform.nqlabs.network (Tailscale-only, via HAProxy)
# Data: PVC uptime-kuma-data (local-path, 2Gi, not replicated)
# Port: 3001
#
# The upstream image runs as root and its entrypoint chowns /app/data then
# drops to PUID:PGID via setpriv. We run as root (monitoring ns is excluded
# from require-run-as-nonroot) and set PUID/PGID=1000 so the app process
# itself runs as non-root uid 1000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: monitoring
  labels:
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  # Recreate because PVC is ReadWriteOnce — only one pod can write at a time.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: nqlabs-platform
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      # In-cluster split-horizon DNS resolves *.platform/*.staging/*.production
      # to the LAN-side Gateway LB automatically. Do not maintain per-app
      # hostAliases here; adding countless apps must not require editing this file.
      containers:
        - name: uptime-kuma
          image: docker.io/louislam/uptime-kuma:1.23.16
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
