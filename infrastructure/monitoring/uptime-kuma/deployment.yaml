# Uptime Kuma — self-hosted uptime monitor and status page.
#
# Provides a human-friendly status dashboard and second vantage point
# for endpoint probing, complementing the internal Blackbox Exporter.
#
# UI: https://uptime.platform.nqlabs.network (Tailscale-only, via HAProxy)
# Data: PVC uptime-kuma-data (local-path, 2Gi, not replicated)
# Port: 3001
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: monitoring
  labels:
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  # Recreate because PVC is ReadWriteOnce — only one pod can write at a time.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: nqlabs-platform
    spec:
      securityContext:
        fsGroup: 1000
      # hostAliases resolve platform/staging/production hostnames to the Cilium Gateway
      # LB IP (192.168.15.193) directly from inside the cluster.  The platform CoreDNS
      # returns Tailscale IPs (100.105.35.84) for external clients, but pods are not
      # Tailscale members so they must use the LAN-side gateway address instead.
      # Proxmox is intentionally excluded — its port 8006 is Tailscale-only and cannot
      # be reached from cluster pods.
      hostAliases:
        - ip: "192.168.15.193"
          hostnames:
            - argocd.platform.nqlabs.network
            - grafana.platform.nqlabs.network
            - prometheus.platform.nqlabs.network
            - alertmanager.platform.nqlabs.network
            - rollouts.platform.nqlabs.network
            - demo.staging.nqlabs.network
            - demo.production.nqlabs.network
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:1.23.16
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
