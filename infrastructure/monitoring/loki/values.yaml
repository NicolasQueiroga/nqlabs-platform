# Loki Helm values — NQLabs Platform
#
# Chart: grafana/loki 7.0.0
# Phase 0 mode: SingleBinary + filesystem PVC on local-path.
#
# Production/NUC note: move to object storage / distributed mode later.

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 168h # 7 days
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    allow_structured_metadata: true
    volume_enabled: true

  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    delete_request_store: filesystem

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

  # Rules sidecar — watches ConfigMaps for Loki rules
  # Resource requests (Kyverno require-resource-requests)
  sidecar:
    rules:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

# Disable SimpleScalable / distributed components.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Keep the internal gateway enabled. Promtail and Grafana use it via ClusterIP.
gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

# No public Loki UI/API route; Grafana talks to Loki inside the cluster.
lokiCanary:
  enabled: false

test:
  enabled: false

# Single-node lab: caches are unnecessary overhead.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
