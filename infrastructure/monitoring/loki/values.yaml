# Loki Helm values — NQLabs Platform
#
# Chart: grafana/loki 7.0.0
# Phase 0 mode: SingleBinary + filesystem PVC on local-path.
#
# Production/NUC note: move to object storage / distributed mode later.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 168h # 7 days
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    allow_structured_metadata: true
    volume_enabled: true

  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    delete_request_store: filesystem

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: ceph-block
    size: 5Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

  # Security contexts (Kyverno compliance)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Rules sidecar — watches ConfigMaps for Loki rules
# Resource requests (Kyverno require-resource-requests)
sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Disable SimpleScalable / distributed components.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Keep the internal gateway enabled. Promtail and Grafana use it via ClusterIP.
gateway:
  enabled: true
  replicas: 1
  # Single-node: disable required anti-affinity (default) to avoid rolling-update
  # deadlock where the new pod can't schedule while the old one is still running.
  affinity: {}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  # Security contexts (Kyverno compliance)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# No public Loki UI/API route; Grafana talks to Loki inside the cluster.
lokiCanary:
  enabled: false

test:
  enabled: false

# Single-node lab: caches are unnecessary overhead.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
    interval: 30s
  rules:
    enabled: true
    labels:
      prometheus: kube-prometheus-stack-prometheus
      role: alert-rules
    additionalRuleLabels:
      namespace: monitoring
