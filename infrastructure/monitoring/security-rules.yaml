# Security-layer alert rules — cert-manager, ESO, Falco, Kyverno, Velero.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nqlabs-security-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
spec:
  groups:
    - name: nqlabs.security.cert-manager
      rules:
        - alert: NQLabsCertificateExpiresSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 30 * 24 * 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Certificate expires within 30 days"
            description: "{{ $labels.namespace }}/{{ $labels.name }} expires within 30 days."
        - alert: NQLabsCertificateExpiresCritical
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 24 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Certificate expires within 14 days"
            description: "{{ $labels.namespace }}/{{ $labels.name }} expires within 14 days."
        - alert: NQLabsCertificateNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Certificate is not Ready"
            description: "{{ $labels.namespace }}/{{ $labels.name }} has Ready=False/Unknown."

    - name: nqlabs.security.external-secrets
      rules:
        - alert: NQLabsExternalSecretSyncErrors
          expr: increase(externalsecret_sync_calls_error[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret sync errors"
            description: "{{ $labels.namespace }}/{{ $labels.name }} has ESO sync errors in the last 15 minutes."

    - name: nqlabs.security.falco
      rules:
        - alert: NQLabsFalcoEventsDetected
          expr: increase(falco_events_total{priority=~"Emergency|Alert|Critical|Error|Warning|emergency|alert|critical|error|warning"}[10m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Falco runtime security event detected"
            description: "Falco reported {{ $labels.rule }} on {{ $labels.instance }}."
        - alert: NQLabsFalcoDroppedEvents
          expr: increase(falco_kernel_events_drops_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Falco is dropping kernel events"
            description: "Falco dropped kernel events on {{ $labels.instance }}."

    - name: nqlabs.security.kyverno
      rules:
        - alert: NQLabsKyvernoPolicyViolations
          expr: increase(kyverno_policy_results_total{result="fail"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Kyverno policy violations"
            description: "Policy {{ $labels.policy_name }}/{{ $labels.rule_name }} has failures."

    - name: nqlabs.security.velero
      rules:
        - alert: NQLabsVeleroBackupFailed
          expr: velero_backup_last_status{schedule!=""} != 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Velero scheduled backup failed"
            description: "Schedule {{ $labels.schedule }} last backup failed."
        - alert: NQLabsVeleroNoRecentBackup
          expr: ((time() - velero_backup_last_successful_timestamp{schedule!=""}) > 30 * 3600) or absent(velero_backup_last_successful_timestamp{schedule!=""})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No recent Velero scheduled backup"
            description: "No successful scheduled Velero backup in the expected window."

