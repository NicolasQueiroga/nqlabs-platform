# Provision a dedicated Thanos bucket on the internal Ceph RGW object store.
# The OBC generates credentials that are used in the objstore secret below.
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: thanos-rgw
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: objstore
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  bucketName: thanos
  storageClassName: ceph-bucket
---
# ExternalSecret — Thanos object-store config pointing at the internal Ceph RGW.
# Credentials synced from 1Password item "thanos-objstore".
# If the OBC is reprovisioned (new user), update the 1Password item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: objstore
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: thanos-objstore
    template:
      type: Opaque
      data:
        objstore.yml: |
          type: S3
          config:
            bucket: thanos
            endpoint: rook-ceph-rgw-platform-object-store.rook-ceph.svc:80
            access_key: {{ .access_key }}
            secret_key: {{ .secret_key }}
            insecure: true
            signature_version2: false
  data:
    - secretKey: access_key
      remoteRef:
        key: thanos-objstore
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: thanos-objstore
        property: secret_key
