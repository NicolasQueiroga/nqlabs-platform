# Thanos object-store config from the same MinIO credentials used for platform backups.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: nqlabs-1password
  target:
    name: thanos-objstore
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        objstore.yml: |
          type: S3
          config:
            bucket: thanos
            endpoint: minio.minio.svc.cluster.local:9000
            access_key: {{ .minio_user }}
            secret_key: {{ .minio_pass }}
            insecure: true
            signature_version2: false
  data:
    - secretKey: minio_user
      remoteRef: { key: velero-minio/access-key }
    - secretKey: minio_pass
      remoteRef: { key: velero-minio/secret-key }
