---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thanos-query
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: thanos.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - thanos.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
      timeouts:
        request: 300s
        backendRequest: 300s

# Thanos Receive HTTPRoute removed — internal-only service, no external exposure.
# Anyone on the gateway could inject metrics without auth.
# Remote write is via ClusterIP service, not gateway.
