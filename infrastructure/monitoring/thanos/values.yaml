# Thanos — long-term metrics + multi-cluster query plane.
# Chart: bitnami/thanos 17.3.1 (Thanos 0.39.2)

fullnameOverride: thanos
global:
  security:
    # We intentionally use the official Thanos image instead of Bitnami's
    # repackaged image so image availability is controlled by upstream Thanos.
    allowInsecureImages: true

image:
  registry: quay.io
  repository: thanos/thanos
  tag: v0.39.2

existingObjstoreSecret: thanos-objstore
existingObjstoreSecretItems:
  - key: objstore.yml
    path: objstore.yml

query:
  enabled: true
  replicaCount: 1
  dnsDiscovery:
    enabled: false
  stores:
    - thanos-receive.monitoring.svc.cluster.local:10901
    - thanos-storegateway.monitoring.svc.cluster.local:10901
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

queryFrontend:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

receive:
  enabled: true
  mode: standalone
  replicaCount: 1
  tsdbRetention: 12h
  config:
    - endpoints:
        - thanos-receive-0.thanos-receive-headless.monitoring.svc.cluster.local:10901
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  podAntiAffinityPreset: ""
  service:
    type: ClusterIP
    additionalHeadless: true

storegateway:
  enabled: true
  replicaCount: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  podAntiAffinityPreset: ""

compactor:
  enabled: true
  retentionResolutionRaw: 30d
  retentionResolution5m: 90d
  retentionResolution1h: 365d
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  podAntiAffinityPreset: ""

bucketweb:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

ruler:
  enabled: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: kube-prometheus-stack
    interval: 30s
  prometheusRule:
    enabled: false
