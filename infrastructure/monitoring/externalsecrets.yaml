# Monitoring ExternalSecrets — NQLabs Platform
#
# App authentication is handled centrally by Authentik, not per-app local
# credentials. Grafana keeps only its OIDC client secret here; users, groups,
# and Grafana roles come from Authentik.
#
# Note: Prometheus/Alertmanager UI authentication is handled centrally by
# Authentik (forward-auth proxy outpost), not per-app secrets.
# See docs/decisions/identity-provider.md.

# Grafana OIDC client secret for Authentik SSO. The key name matches Grafana's
# env-var convention so it maps to [auth.generic_oauth] client_secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: grafana-oidc
        property: client_secret
---
# Discord webhook for Alertmanager notifications.
# 1Password item: alertmanager-discord | Field: webhook_url
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
  namespace: monitoring
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook_url
      remoteRef:
        key: alertmanager-discord
        property: webhook_url
