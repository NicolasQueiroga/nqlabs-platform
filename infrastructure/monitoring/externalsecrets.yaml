# Monitoring ExternalSecrets — NQLabs Platform
#
# Grafana admin credentials sourced from 1Password NQLabs vault.
# Item: grafana | Fields: username, password
#
# Prometheus/Alertmanager basic auth password sourced from 1Password.
# Item: prometheus-basic-auth | Field: password (bcrypt-hashed)
# The hashed password is used in web.yml for basic_auth_users.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/username
    - secretKey: admin-password
      remoteRef:
        key: grafana/password

---
# Prometheus basic auth — bcrypt-hashed password from 1Password.
# Create a 1Password item: prometheus-basic-auth
# Field: password (value = bcrypt hash of desired password, e.g. generated with `htpasswd -nB admin`)
# This Secret is mounted as web.yml in the Prometheus pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-web-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: prometheus-web-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        web.yml: |
          basic_auth_users:
            admin: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prometheus-basic-auth/password

---
# Discord webhook for Alertmanager notifications.
# 1Password item: alertmanager-discord | Field: webhook_url
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook_url
      remoteRef:
        key: alertmanager-discord/webhook_url
