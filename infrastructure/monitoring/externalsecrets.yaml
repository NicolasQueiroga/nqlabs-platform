# Monitoring ExternalSecrets — NQLabs Platform
#
# Grafana admin credentials sourced from 1Password NQLabs vault.
# Item: grafana | Fields: username, password
#
# Note: Prometheus/Alertmanager UI authentication is handled centrally by
# Authentik (forward-auth proxy outpost), not per-app secrets.
# See docs/decisions/identity-provider.md.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/username
    - secretKey: admin-password
      remoteRef:
        key: grafana/password

---
# Grafana OIDC client secret for Authentik SSO. The key name matches Grafana's
# env-var convention so it maps to [auth.generic_oauth] client_secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: grafana-oidc/client_secret
---
# Discord webhook for Alertmanager notifications.
# 1Password item: alertmanager-discord | Field: webhook_url
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook_url
      remoteRef:
        key: alertmanager-discord/webhook_url
