# prometheus-blackbox-exporter Helm values — NQLabs Platform
#
# Chart: prometheus-community/prometheus-blackbox-exporter 11.12.0
# App:   blackbox-exporter v0.28.0
# Namespace: monitoring

fullnameOverride: blackbox-exporter

config:
  modules:
    # Internal endpoint probing for nqlabs.network.
    # nqlabs.network now uses publicly trusted Let's Encrypt certificates issued
    # through Cloudflare DNS-01, so probes should verify TLS normally.
    http_2xx_internal:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: false

    # Internal endpoint probing for services with self-signed TLS (e.g. Ceph dashboard).
    http_2xx_internal_insecure:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: true

    # Edge auth probe for forward-auth protected endpoints.
    # Expects 302 redirect to Authentik login page. Does NOT follow redirects.
    http_302_auth:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: false
        preferred_ip_protocol: ip4
        valid_status_codes: [302]
        tls_config:
          insecure_skip_verify: false

    dns_a_nqlabs:
      prober: dns
      timeout: 5s
      dns:
        query_name: nqlabs.network
        query_type: A
        preferred_ip_protocol: ip4

    tcp_connect:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Security contexts (Kyverno compliance)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceMonitor:
  selfMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
    interval: 30s
    scrapeTimeout: 10s
