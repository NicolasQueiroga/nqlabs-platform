# prometheus-blackbox-exporter Helm values — NQLabs Platform
#
# Chart: prometheus-community/prometheus-blackbox-exporter 11.12.0
# App:   blackbox-exporter v0.28.0
# Namespace: monitoring

fullnameOverride: blackbox-exporter

config:
  modules:
    # Internal endpoint probing for nqlabs.network.
    # nqlabs.network now uses publicly trusted Let's Encrypt certificates issued
    # through Cloudflare DNS-01, so probes should verify TLS normally.
    http_2xx_internal:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: false

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

serviceMonitor:
  selfMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
    interval: 30s
    scrapeTimeout: 10s
