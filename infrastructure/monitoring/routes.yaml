# Monitoring HTTPRoutes — NQLabs Platform
#
# All monitoring UIs exposed via platform-gateway on HTTPS.
# Hostnames:
#   grafana.platform.nqlabs.network
#   prometheus.platform.nqlabs.network
#   alertmanager.platform.nqlabs.network
#   uptime.platform.nqlabs.network

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: grafana.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - grafana.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          namespace: monitoring
          port: 80
      timeouts:
        request: 300s
        backendRequest: 300s

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: prometheus.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - prometheus.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Routed through the Authentik embedded outpost (forward-auth). The outpost
      # authenticates, then reverse-proxies to the Prometheus backend.
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
      timeouts:
        request: 300s
        backendRequest: 300s

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: alertmanager.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - alertmanager.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Routed through the Authentik embedded outpost (forward-auth).
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
      timeouts:
        request: 300s
        backendRequest: 300s

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: uptime.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - uptime.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Gatus has native OIDC — routes directly to the backend, no proxy needed.
      backendRefs:
        - name: gatus
          namespace: monitoring
          port: 8080
      timeouts:
        request: 300s
        backendRequest: 300s
