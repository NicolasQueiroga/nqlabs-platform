# Monitoring HTTPRoutes — NQLabs Platform
#
# All monitoring UIs exposed via platform-gateway on HTTPS.
# Hostnames:
#   grafana.platform.nqlabs.network
#   prometheus.platform.nqlabs.network
#   alertmanager.platform.nqlabs.network

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: grafana.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - grafana.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          namespace: monitoring
          port: 80

---
apiVersion: gateway.networking.k8s.io/v1
