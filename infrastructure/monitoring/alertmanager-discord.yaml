# Alertmanager Discord receiver — NQLabs Platform
#
# The webhook URL comes from OpenBao KV via ExternalSecret and is referenced by
# AlertmanagerConfig. No webhook URL is committed to git.
#
# The alertmanagerConfigMatcherStrategy is set to "None" in the Helm values
# (alertmanager.alertmanagerSpec.alertmanagerConfigMatcherStrategy.type: None)
# so the Prometheus Operator does NOT inject namespace="monitoring" as a matcher
# on the CRD-generated route. This allows alerts from ALL namespaces to be
# routed to Discord.

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord
  namespace: monitoring
  labels:
    alertmanagerConfig: nqlabs
spec:
  route:
    receiver: discord
    groupBy:
      - alertname
      - severity
      - instance
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: severity
        matchType: =~
        value: "critical|warning|info"
  inhibitRules:
    - sourceMatch:
        - name: severity
          matchType: =
          value: critical
      targetMatch:
        - name: severity
          matchType: =
          value: warning
      equal:
        - alertname
        - namespace
        - instance
    - sourceMatch:
        - name: alertname
          matchType: =~
          value: NQLabsNodeNotReady|KubeNodeNotReady
      targetMatch:
        - name: severity
          matchType: =~
          value: warning|critical
      equal:
        - node
  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhook_url
          sendResolved: true
          username: NQLabs Alertmanager
          title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} NQLabs {{ .CommonLabels.alertname }}'
          message: |-
            {{ range .Alerts }}
            **Severity:** `{{ .Labels.severity }}`
            **Target:** `{{ .Labels.instance }}`
            **Summary:** {{ .Annotations.summary }}
            **Description:** {{ .Annotations.description }}
            {{ end }}
