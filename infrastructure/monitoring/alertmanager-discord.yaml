# Alertmanager Discord receiver — NQLabs Platform
#
# The webhook URL comes from OpenBao KV via ExternalSecret and is referenced by
# AlertmanagerConfig. No webhook URL is committed to git.
#
# The alertmanagerConfigMatcherStrategy is set to "None" in the Helm values
# (alertmanager.alertmanagerSpec.alertmanagerConfigMatcherStrategy.type: None)
# so the Prometheus Operator does NOT inject namespace="monitoring" as a matcher
# on the CRD-generated route. This allows alerts from ALL namespaces to be
# routed to Discord.
#
# Routing design:
#   critical → Discord, repeat 4h  (act now, keep pinging until fixed)
#   warning  → Discord, repeat 24h (act today, once/day max — no firehose)
#   info/none → null receiver      (Watchdog, InfoInhibitor never reach Discord)
# Inhibition:
#   critical inhibits warning for same alert+namespace+instance
#   node-down inhibits ALL alerts on that node (prevents cascade spam)

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord
  namespace: monitoring
  labels:
    alertmanagerConfig: nqlabs
spec:
  route:
    receiver: null
    groupBy:
      - alertname
      - severity
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      # Critical alerts → Discord, repeat every 4h
      - receiver: discord
        matchers:
          - name: severity
            matchType: =
            value: critical
        repeatInterval: 4h
        continue: false
      # Warning alerts → Discord, repeat once per 24h (anti-spam)
      - receiver: discord
        matchers:
          - name: severity
            matchType: =
            value: warning
        repeatInterval: 24h
        continue: false
      # Info/none alerts (Watchdog, InfoInhibitor) → null receiver, never Discord
      - receiver: null
        matchers:
          - name: severity
            matchType: =~
            value: "none|info"
        continue: false
  inhibitRules:
    # Critical inhibits warning for same alert + namespace + instance
    - sourceMatch:
        - name: severity
          matchType: =
          value: critical
      targetMatch:
        - name: severity
          matchType: =
          value: warning
      equal:
        - alertname
        - namespace
        - instance
    # Node-down inhibits ALL other alerts on that node (prevents cascade spam)
    - sourceMatch:
        - name: alertname
          matchType: =~
          value: NQLabsNodeNotReady|KubeNodeNotReady|KubeNodeUnreachable
      targetMatch:
        - name: alertname
          matchType: =~
          value: ".*"
      equal:
        - node
  receivers:
    # Null receiver — swallows alerts silently (Watchdog, InfoInhibitor)
    - name: null
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhook_url
          sendResolved: true
          username: NQLabs Alertmanager
          title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} NQLabs {{ .CommonLabels.alertname }}'
          message: |-
            {{ range .Alerts }}
            **Severity:** `{{ .Labels.severity }}`
            **Target:** `{{ .Labels.instance }}`
            **Summary:** {{ .Annotations.summary }}
            **Description:** {{ .Annotations.description }}
            {{ end }}
