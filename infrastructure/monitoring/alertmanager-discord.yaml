# Alertmanager Discord receiver — NQLabs Platform
#
# The webhook URL comes from 1Password via ExternalSecret and is referenced by
# AlertmanagerConfig. No webhook URL is committed to git.

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord
  namespace: monitoring
  labels:
    alertmanagerConfig: nqlabs
spec:
  route:
    receiver: discord
    groupBy:
      - alertname
      - severity
      - instance
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: severity
        matchType: =~
        value: "critical|warning|info"
  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhook_url
          sendResolved: true
          username: NQLabs Alertmanager
          title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} NQLabs {{ .CommonLabels.alertname }}'
          message: |-
            {{ range .Alerts }}
            **Severity:** `{{ .Labels.severity }}`
            **Target:** `{{ .Labels.instance }}`
            **Summary:** {{ .Annotations.summary }}
            **Description:** {{ .Annotations.description }}
            {{ end }}
