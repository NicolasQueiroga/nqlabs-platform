---
# Private OTLP/HTTP ingestion endpoint for remote collectors and applications.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otel
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: otel.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - otel.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: otel-collector
          namespace: monitoring
          port: 4318
      timeouts:
        request: 300s
        backendRequest: 300s
