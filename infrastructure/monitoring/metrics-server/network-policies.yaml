# CiliumNetworkPolicy for metrics-server
#
# Allows kube-apiserver to reach metrics-server on port 443 (APIService).
# With Cilium kube-proxy replacement, traffic arrives as host/remote-node/kube-apiserver.
# Allows metrics-server egress to kubelets (10250), kube-apiserver (6443), and DNS.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: metrics-server
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  egress:
    - toEntities:
        - host
        - remote-node
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
