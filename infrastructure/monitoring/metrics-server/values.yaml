# metrics-server Helm values — NQLabs Platform
# Chart: metrics-server/metrics-server
# Repo: https://kubernetes-sigs.github.io/metrics-server/
# Version: 3.13.0
#
# Deploys metrics-server for Kubernetes Metrics API (kubectl top, HPA).
# Uses --kubelet-insecure-tls because Talos kubelet serving certs are
# self-signed with DNS SAN only (no IP SAN). This is acceptable on a
# private cluster network. For production, switch to cert rotation +
# kubelet-serving-cert-approver.
#
# TLS: cert-manager issues the serving certificate. This avoids the
# runtime self-signed cert generation panic on Talos (read-only root FS)
# and gives proper cert lifecycle management. The cert-manager CA
# injector automatically injects caBundle into the APIService.

replicas: 2

defaultArgs:
  - --metric-resolution=15s
  - --kubelet-insecure-tls=true
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 500Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

apiService:
  create: true
  insecureSkipTLSVerify: false

tls:
  type: cert-manager
  certManager:
    addInjectorAnnotations: true
