# metrics-server Helm values — NQLabs Platform
# Chart: metrics-server/metrics-server
# Repo: https://kubernetes-sigs.github.io/metrics-server/
# Version: 3.13.0
#
# Deploys metrics-server for Kubernetes Metrics API (kubectl top, HPA).
# Uses --kubelet-insecure-tls because Talos kubelet serving certs are
# self-signed with DNS SAN only (no IP SAN). This is acceptable on a
# private cluster network. For production, switch to cert rotation +
# kubelet-serving-cert-approver.
#
# TLS certs are generated by Helm at deploy time (tls.type: helm) to
# avoid the runtime self-signed cert generation panic on Talos read-only
# root filesystem.

replicas: 2

defaultArgs:
  - --metric-resolution=15s
  - --kubelet-insecure-tls=true
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 500Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

apiService:
  create: true
  # insecureSkipTLSVerify must match tls.type:
  # - helm/standalone: false (APIService uses the cert from the Secret)
  # - metrics-server: true (self-signed, can't verify)
  # But since we use helm-generated certs, we can set this to false.
  insecureSkipTLSVerify: false

tls:
  # Helm generates self-signed certs at deploy time and stores them in a
  # Secret. This avoids the runtime cert generation panic on Talos
  # (read-only root filesystem: "mkdir apiserver.local.config: read-only fs").
  type: helm
