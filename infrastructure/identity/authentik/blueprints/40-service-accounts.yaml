# Service accounts for machine-to-machine authentication.
#
# Authentik supports service users (type=service) and OAuth2 client_credentials
# grant for M2M. This blueprint defines:
#
#   1. A `services` group — all service accounts belong here. Membership grants
#      machine-to-machine access. Add per-service subgroups for finer control.
#   2. A property mapping for the `client_credentials` scope that includes the
#      service name and groups in the access token.
#   3. An OAuth2 provider template for M2M clients. Each service that needs to
#      authenticate against other platform services gets an entry here with:
#        - client_id: <service-name>
#        - client_secret: from 1Password via !Env
#        - grant_types: [client_credentials]
#        - client_type: confidential
#
# To add a new service ("awesome-app"):
#   1. Add an OAuth2 provider + application entry below (copy the demo block).
#   2. Add the client secret to 1Password + ESO (externalsecrets.yaml).
#   3. Add the !Env var to authentik values.yaml (global.env).
#   4. Configure the consuming service to request a token from Authentik and
#      include it as a Bearer token when calling other services.
#
# The consuming service validates the token against Authentik's JWKS endpoint
# at https://auth.platform.nqlabs.network/application/o/<provider>/.well-known/
# jwks.json — no shared secret needed between services.
version: 1
metadata:
  name: nqlabs-service-accounts
  labels:
    blueprints.goauthentik.io/instance: nqlabs
entries:
  # ── Services group ─────────────────────────────────────────────────────
  # All machine-to-machine service accounts are members of this group.
  # Add subgroups (e.g., services-read, services-write) for finer access.
  - id: group-services
    model: authentik_core.group
    identifiers:
      name: services
    attrs:
      is_superuser: false

  # ── M2M groups scope mapping ───────────────────────────────────────────
  # Includes service name + groups in the access token for downstream authz.
  - id: m2m-groups-scope
    model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "NQLabs M2M service identity"
    attrs:
      scope_name: groups
      description: "Service identity + group membership for machine-to-machine"
      expression: |
        return {
          "service": context["oauth_client"].name,
          "groups": [group.name for group in request.user.ak_groups.all()]
        }

  # ── Demo service (example M2M client) ─────────────────────────────────
  # This is a template. Copy this block for each new service that needs M2M.
  # Uncomment the entries below and replace "demo-service" with your service name.
  #
  # - id: demo-service-provider
  #   model: authentik_providers_oauth2.oauth2provider
  #   identifiers:
  #     name: demo-service
  #   attrs:
  #     client_type: confidential
  #     client_id: demo-service
  #     grant_types:
  #       - client_credentials
  #     client_secret: !Env [AUTHENTIK_DEMO_SERVICE_M2M_SECRET, ""]
  #     authorization_flow:
  #       !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
  #     invalidation_flow:
  #       !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  #     signing_key:
  #       !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
  #     property_mappings:
  #       - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
  #       - !KeyOf m2m-groups-scope
  #
  # - id: demo-service-app
  #   model: authentik_core.application
  #   identifiers:
  #     slug: demo-service
  #   attrs:
  #     name: Demo Service (M2M)
  #     provider: !KeyOf demo-service-provider
  #     group: Services
  #
  # - model: authentik_policies.policybinding
