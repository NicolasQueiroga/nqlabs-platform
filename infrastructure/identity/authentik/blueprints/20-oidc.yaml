# OIDC providers + applications for the OIDC-native platform UIs (ArgoCD, Grafana).
#
# Client secrets come from !Env (injected into the worker from the ESO secret),
# so the providers are created with the exact secret ArgoCD/Grafana use.
version: 1
metadata:
  name: nqlabs-oidc
  labels:
    blueprints.goauthentik.io/instance: nqlabs
entries:
  # ── ArgoCD ────────────────────────────────────────────────────────────────
  - id: argocd-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: argocd
    attrs:
      client_type: confidential
      client_id: argocd
      grant_types:
        - authorization_code
        - refresh_token
      client_secret: !Env [AUTHENTIK_ARGOCD_OIDC_SECRET, ""]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=5
      access_token_validity: hours=1
      refresh_token_validity: days=30
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: strict
          url: https://argocd.platform.nqlabs.network/auth/callback
        - matching_mode: strict
          url: http://localhost:8085/auth/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "NQLabs OIDC groups"]]

  - id: argocd-app
    model: authentik_core.application
    identifiers:
      slug: argocd
    attrs:
      name: ArgoCD
      provider: !KeyOf argocd-provider
      meta_launch_url: https://argocd.platform.nqlabs.network
      meta_description: "GitOps continuous delivery"
      group: Platform

  # ── ArgoCD group bindings ─────────────────────────────────────────────
  # platform-admins → admin role (via ArgoCD RBAC policy.csv)
  # platform-viewers → readonly role (via ArgoCD RBAC policy.csv)
  # sre → admin role (same as platform-admins but not Authentik superuser)
  # demo-app → access to ArgoCD (project scoping via ArgoCD RBAC, Phase 2 OPA)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf argocd-app
      group: !Find [authentik_core.group, [name, platform-admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf argocd-app
      group: !Find [authentik_core.group, [name, platform-viewers]]
    attrs:
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf argocd-app
      group: !Find [authentik_core.group, [name, sre]]
    attrs:
      order: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf argocd-app
      group: !Find [authentik_core.group, [name, demo-app]]
    attrs:
      order: 40

  # ── Grafana ───────────────────────────────────────────────────────────────
  - id: grafana-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: grafana
    attrs:
      client_type: confidential
      client_id: grafana
      grant_types:
        - authorization_code
        - refresh_token
      client_secret: !Env [AUTHENTIK_GRAFANA_OIDC_SECRET, ""]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=5
      access_token_validity: hours=1
      refresh_token_validity: days=30
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.platform.nqlabs.network/login/generic_oauth
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "NQLabs OIDC groups"]]

  - id: grafana-app
    model: authentik_core.application
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      meta_launch_url: https://grafana.platform.nqlabs.network
      meta_description: "Metrics dashboards"
      group: Platform

  # ── Grafana group bindings ─────────────────────────────────────────────
  # platform-admins → Admin role (via Grafana role_attribute_path)
  # platform-viewers → Viewer role (via Grafana role_attribute_path)
  # sre → Admin role (same mapping as platform-admins)
  # data → Viewer role (via Grafana role_attribute_path)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana-app
      group: !Find [authentik_core.group, [name, platform-admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana-app
      group: !Find [authentik_core.group, [name, platform-viewers]]
    attrs:
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana-app
      group: !Find [authentik_core.group, [name, sre]]
    attrs:
      order: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana-app
      group: !Find [authentik_core.group, [name, data]]
    attrs:
      order: 40

  # ── Gatus (uptime monitoring, native OIDC) ──────────────────────────────
  - id: gatus-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: gatus
    attrs:
      client_type: confidential
      client_id: gatus
      grant_types:
        - authorization_code
        - refresh_token
      client_secret: !Env [AUTHENTIK_GATUS_OIDC_SECRET, ""]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=5
      access_token_validity: hours=1
      refresh_token_validity: days=30
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: strict
          url: https://uptime.platform.nqlabs.network/authorization-code/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "NQLabs OIDC groups"]]

  - id: gatus-app
    model: authentik_core.application
    identifiers:
      slug: gatus
    attrs:
      name: Gatus
      provider: !KeyOf gatus-provider
      meta_launch_url: https://uptime.platform.nqlabs.network
      meta_description: "Uptime monitoring"
      group: Platform

  # ── Gatus group bindings ───────────────────────────────────────────────
  # platform-admins + sre → full access
  # platform-viewers → read-only status visibility
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf gatus-app
      group: !Find [authentik_core.group, [name, platform-admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf gatus-app
      group: !Find [authentik_core.group, [name, platform-viewers]]
    attrs:
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf gatus-app
      group: !Find [authentik_core.group, [name, sre]]
    attrs:
      order: 30

  # ── MinIO Console (native OIDC) ─────────────────────────────────────────
  - id: minio-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: minio
    attrs:
      client_type: confidential
      client_id: minio
      grant_types:
        - authorization_code
        - refresh_token
      client_secret: !Env [AUTHENTIK_MINIO_OIDC_SECRET, ""]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=5
      access_token_validity: hours=1
      refresh_token_validity: days=30
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: strict
          url: https://minio.platform.nqlabs.network/oauth_callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "NQLabs OIDC groups"]]

  - id: minio-app
    model: authentik_core.application
    identifiers:
      slug: minio
    attrs:
      name: MinIO
      provider: !KeyOf minio-provider
      meta_launch_url: https://minio.platform.nqlabs.network
      meta_description: "S3-compatible object storage"
      group: Platform

  # ── MinIO group bindings ───────────────────────────────────────────────
  # platform-admins + sre → full access (storage admin)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf minio-app
      group: !Find [authentik_core.group, [name, platform-admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf minio-app
      group: !Find [authentik_core.group, [name, sre]]
    attrs:
      order: 20
