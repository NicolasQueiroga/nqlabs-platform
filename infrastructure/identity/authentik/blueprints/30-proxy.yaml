# Proxy providers (reverse-proxy / forward-auth) for the non-OIDC platform UIs,
# all served by the embedded Authentik outpost.
#
# Each provider authenticates the request against Authentik, then proxies to the
# in-cluster backend. The app HTTPRoutes point at the embedded outpost
# (authentik-server:9000) instead of the backend directly (see manifests).
version: 1
metadata:
  name: nqlabs-proxy
  labels:
    blueprints.goauthentik.io/instance: nqlabs
entries:
  # ── Prometheus ──────────────────────────────────────────────────────────
  - id: prometheus-provider
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: prometheus
    attrs:
      mode: proxy
      external_host: https://prometheus.platform.nqlabs.network
      internal_host: http://kube-prometheus-stack-prometheus.monitoring:9090
      internal_host_ssl_validation: false
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - id: prometheus-app
    model: authentik_core.application
    identifiers:
      slug: prometheus
    attrs:
      name: Prometheus
      provider: !KeyOf prometheus-provider
      meta_launch_url: https://prometheus.platform.nqlabs.network
      group: Platform

  # ── Prometheus group bindings ─────────────────────────────────────────
  # platform-admins + sre → full access (no internal RBAC)
  # platform-viewers + data → query visibility
  # (path-level restriction is Phase 2 OPA)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf prometheus-app
      group: !Find [authentik_core.group, [name, platform-admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf prometheus-app
      group: !Find [authentik_core.group, [name, sre]]
    attrs:
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf prometheus-app
      group: !Find [authentik_core.group, [name, platform-viewers]]
    attrs:
      order: 30
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf prometheus-app
      group: !Find [authentik_core.group, [name, data]]
    attrs:
      order: 40

  # ── Alertmanager ────────────────────────────────────────────────────────
  - id: alertmanager-provider
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: alertmanager
    attrs:
      mode: proxy
      external_host: https://alertmanager.platform.nqlabs.network
      internal_host: http://kube-prometheus-stack-alertmanager.monitoring:9093
      internal_host_ssl_validation: false
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - id: alertmanager-app
    model: authentik_core.application
    identifiers:
      slug: alertmanager
    attrs:
      name: Alertmanager
      provider: !KeyOf alertmanager-provider
      meta_launch_url: https://alertmanager.platform.nqlabs.network
      group: Platform

  # ── Alertmanager group bindings ───────────────────────────────────────
  # platform-admins + sre only (alert management is sensitive)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf alertmanager-app
      group: !Find [authentik_core.group, [name, platform-admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf alertmanager-app
      group: !Find [authentik_core.group, [name, sre]]
    attrs:
      order: 20

  # ── Argo Rollouts dashboard ───────────────────────────────────────────────
  - id: rollouts-provider
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: rollouts
    attrs:
      mode: proxy
      external_host: https://rollouts.platform.nqlabs.network
      internal_host: http://argo-rollouts-dashboard.argo-rollouts:3100
      internal_host_ssl_validation: false
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - id: rollouts-app
    model: authentik_core.application
    identifiers:
      slug: rollouts
    attrs:
      name: Argo Rollouts
      provider: !KeyOf rollouts-provider
      meta_launch_url: https://rollouts.platform.nqlabs.network
      group: Platform

  # ── Argo Rollouts group bindings ──────────────────────────────────────
  # platform-admins + sre → full access
  # demo-app → view deployments (path-level restriction is Phase 2 OPA)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf rollouts-app
      group: !Find [authentik_core.group, [name, platform-admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf rollouts-app
      group: !Find [authentik_core.group, [name, sre]]
    attrs:
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf rollouts-app
      group: !Find [authentik_core.group, [name, demo-app]]
    attrs:
      order: 30

  # ── Hubble UI ───────────────────────────────────────────────────────────
  - id: hubble-provider
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: hubble
    attrs:
      mode: proxy
      external_host: https://hubble.platform.nqlabs.network
      internal_host: http://hubble-ui.kube-system:80
      internal_host_ssl_validation: false
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - id: hubble-app
    model: authentik_core.application
    identifiers:
      slug: hubble
    attrs:
      name: Hubble
      provider: !KeyOf hubble-provider
      meta_launch_url: https://hubble.platform.nqlabs.network
      group: Platform

  # ── Hubble group bindings ─────────────────────────────────────────────
  # platform-admins + sre → full observability access
  # platform-viewers → read-only network visibility
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf hubble-app
      group: !Find [authentik_core.group, [name, platform-admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf hubble-app
      group: !Find [authentik_core.group, [name, sre]]
    attrs:
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf hubble-app
      group: !Find [authentik_core.group, [name, platform-viewers]]
    attrs:
      order: 30

  # ── Thanos Query ───────────────────────────────────────────────────────
  - id: thanos-provider
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: thanos
    attrs:
      mode: proxy
      external_host: https://thanos.platform.nqlabs.network
      internal_host: http://thanos-query-frontend.monitoring:9090
      internal_host_ssl_validation: false
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - id: thanos-app
    model: authentik_core.application
    identifiers:
      slug: thanos
    attrs:
      name: Thanos
      provider: !KeyOf thanos-provider
      meta_launch_url: https://thanos.platform.nqlabs.network
      group: Platform

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf thanos-app
      group: !Find [authentik_core.group, [name, platform-admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf thanos-app
      group: !Find [authentik_core.group, [name, sre]]
    attrs:
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf thanos-app
      group: !Find [authentik_core.group, [name, platform-viewers]]
    attrs:
      order: 30

  # ── Pyroscope ──────────────────────────────────────────────────────────
  - id: pyroscope-provider
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: pyroscope
    attrs:
      mode: proxy
      external_host: https://pyroscope.platform.nqlabs.network
      internal_host: http://pyroscope.monitoring:4040
      internal_host_ssl_validation: false
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - id: pyroscope-app
    model: authentik_core.application
    identifiers:
      slug: pyroscope
    attrs:
      name: Pyroscope
      provider: !KeyOf pyroscope-provider
      meta_launch_url: https://pyroscope.platform.nqlabs.network
      group: Platform

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf pyroscope-app
      group: !Find [authentik_core.group, [name, platform-admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf pyroscope-app
      group: !Find [authentik_core.group, [name, sre]]
    attrs:
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf pyroscope-app
      group: !Find [authentik_core.group, [name, platform-viewers]]
    attrs:
      order: 30

  # ── Ceph dashboard SAML IdP ───────────────────────────────────────────────
  # Ceph Dashboard uses native SAML2 SSO — no proxy provider. Authentik is the
  # IdP; Ceph is the SP. Users must be pre-created in Ceph (matching the email
  # attribute from Authentik) before they can log in via SSO.
  - id: ceph-saml-provider
    model: authentik_providers_saml.samlprovider
    identifiers:
      name: ceph-dashboard-saml
    attrs:
      acs_url: https://ceph.platform.nqlabs.network/auth/saml2
      issuer_override: https://ceph.platform.nqlabs.network/auth/saml2/metadata
      audience: https://ceph.platform.nqlabs.network/auth/saml2/metadata
      sp_binding: post
      sign_assertion: true
      sign_response: true
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_kp:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/username]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/name]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/email]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/groups]]

  - id: ceph-saml-app
    model: authentik_core.application
    identifiers:
      slug: ceph
    attrs:
      name: Ceph Dashboard
      provider: !KeyOf ceph-saml-provider
      meta_launch_url: https://ceph.platform.nqlabs.network
      group: Platform

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf ceph-saml-app
      group: !Find [authentik_core.group, [name, platform-admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf ceph-saml-app
      group: !Find [authentik_core.group, [name, sre]]
    attrs:
      order: 20

  # ── Attach all proxy providers to the embedded outpost ────────────────────
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      type: proxy
      config:
        authentik_host: https://auth.platform.nqlabs.network
        authentik_host_browser: https://auth.platform.nqlabs.network
      providers:
        - !KeyOf prometheus-provider
        - !KeyOf alertmanager-provider
        - !KeyOf rollouts-provider
        - !KeyOf hubble-provider
        - !KeyOf thanos-provider
        - !KeyOf pyroscope-provider
        - !KeyOf ceph-provider
