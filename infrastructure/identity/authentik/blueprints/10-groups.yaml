# NQLabs platform groups + a groups OIDC scope mapping.
#
# Groups are the unit of access control across the platform. Membership is
# assigned per-user in Authentik; apps map these group names to roles.
#
# Group hierarchy:
#   platform-admins  → full admin everywhere (Authentik superuser + admin role in apps)
#   platform-viewers → read-only on OIDC apps plus safe observability/proxy UIs
#                      (ArgoCD, Grafana, Gatus, Prometheus, Thanos, Pyroscope,
#                      Hubble). Deliberately excluded from Alertmanager and
#                      Rollouts until stricter read-only enforcement exists.
#   sre              → access to all platform tools (not Authentik superuser)
#   data             → Grafana + Prometheus only
#   demo-app         → ArgoCD (own project) + Rollouts dashboard
#
# Users can be in multiple groups (union semantics).
# Adding a user to a group in Authentik propagates on next token refresh.
version: 1
metadata:
  name: nqlabs-groups
  labels:
    blueprints.goauthentik.io/instance: nqlabs
entries:
  # ── Platform-wide groups ──────────────────────────────────────────────
  - id: group-platform-admins
    model: authentik_core.group
    identifiers:
      name: platform-admins
    attrs:
      is_superuser: true

  - id: group-platform-viewers
    model: authentik_core.group
    identifiers:
      name: platform-viewers
    attrs:
      is_superuser: false

  # ── Team groups ───────────────────────────────────────────────────────
  # Teams get service-level access via policy bindings in 20-oidc.yaml
  # and 30-proxy.yaml. Fine-grained path/method control is Phase 2 (OPA).
  - id: group-sre
    model: authentik_core.group
    identifiers:
      name: sre
    attrs:
      is_superuser: false

  - id: group-data
    model: authentik_core.group
    identifiers:
      name: data
    attrs:
      is_superuser: false

  - id: group-demo-app
    model: authentik_core.group
    identifiers:
      name: demo-app
    attrs:
      is_superuser: false

  # ── Bootstrap platform admin user ─────────────────────────────────────
  # Create the canonical human operator account from the same vault-backed
  # bootstrap password used during the very first Authentik startup. This user
  # is the expected day-0 admin for platform SSO, rather than relying on the
  # upstream built-in `akadmin` account.
  - id: user-nicolas
    model: authentik_core.user
    identifiers:
      username: nicolas
    attrs:
      name: Nicolas
      email: nicolas@nqlabs.io
      is_active: true
      password: !Env [AUTHENTIK_BOOTSTRAP_PASSWORD, ""]
      groups:
        - !Find [authentik_core.group, [name, platform-admins]]

  - id: user-dummy
    model: authentik_core.user
    identifiers:
      username: dummy
    attrs:
      name: Dummy
      email: dummy@nqlabs.io
      is_active: true
      password: !Env [AUTHENTIK_BOOTSTRAP_PASSWORD, ""]
      groups:
        - !Find [authentik_core.group, [name, platform-viewers]]

  # ── OIDC groups scope mapping ─────────────────────────────────────────
  # Adds a `groups` claim to OIDC tokens so ArgoCD/Grafana can map group
  # membership to roles.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "NQLabs OIDC groups"
    attrs:
      scope_name: groups
      description: "NQLabs group membership"
      expression: |
        return [group.name for group in request.user.groups.all()]

  # ── MinIO policy scope mapping ─────────────────────────────────────────
  # MinIO OIDC requires a `policy` claim in the JWT token containing the name
  # of a MinIO built-in policy.  platform-admins → consoleAdmin, everyone
  # else → readonly.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "MinIO OIDC policy"
    attrs:
      scope_name: policy
      description: "MinIO console policy claim"
      expression: |
        groups = [group.name for group in request.user.groups.all()]
        policy = "consoleAdmin" if "platform-admins" in groups else "readonly"
        return {"policy": policy}
