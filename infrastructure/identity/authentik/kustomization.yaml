# Kustomize entrypoint for the Authentik raw manifests + blueprint ConfigMap.
#
# The authentik Helm chart is a separate ArgoCD source; this kustomization
# delivers the data layer, secrets, route, and the declarative blueprints
# (mounted into Authentik via blueprints.configMaps: [authentik-blueprints]).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik

resources:
  # Create the namespace as a first-class resource so the first bootstrap sync
  # can create ExternalSecrets/data-layer objects deterministically without
  # relying on ArgoCD's namespace auto-creation timing.
  - manifests/namespace.yaml
  - manifests/externalsecrets.yaml
  - manifests/postgres-cluster.yaml
  - manifests/postgres-backup.yaml
  - manifests/valkey.yaml
  - manifests/httproute.yaml
  - manifests/hubble-route.yaml
  - manifests/referencegrant.yaml
  - manifests/network-policies.yaml

configMapGenerator:
  - name: authentik-blueprints
    files:
      - blueprints/10-groups.yaml
      - blueprints/20-oidc.yaml
      - blueprints/30-proxy.yaml
      - blueprints/40-service-accounts.yaml
      - blueprints/50-security.yaml

# Stable name so the chart's blueprints.configMaps reference resolves and
# ConfigMap volume updates propagate in place (Authentik re-reads blueprints).
generatorOptions:
  disableNameSuffixHash: true
