# ExternalSecrets for the Authentik identity stack — NQLabs Platform.
#
# All values sourced from OpenBao (kv-v2) via the nqlabs-openbao
# ClusterSecretStore. Vault KV-v2 paths:
#   kv/data/bn54fyzizkl6sl76eajwqnzbou  -> secret_key, bootstrap_password,
#                                           bootstrap_token, redis_password
#   kv/data/authentik-postgres          -> password
#
# Note: ESO Vault provider requires explicit `property` for field selection;
# the 1Password-style "item/field" key format is NOT supported.
---
# Authentik application secrets, consumed by the chart via global.env (secretKeyRef).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret_key
      remoteRef:
        key: bn54fyzizkl6sl76eajwqnzbou
        property: secret_key
    - secretKey: bootstrap_password
      remoteRef:
        key: bn54fyzizkl6sl76eajwqnzbou
        property: bootstrap_password
    - secretKey: bootstrap_token
      remoteRef:
        key: bn54fyzizkl6sl76eajwqnzbou
        property: bootstrap_token
    - secretKey: redis_password
      remoteRef:
        key: bn54fyzizkl6sl76eajwqnzbou
        property: redis_password
    - secretKey: postgres_password
      remoteRef:
        key: authentik-postgres
        property: password
    # OIDC client secrets — referenced by blueprints via !Env so the providers
    # are created with the same secret ArgoCD/Grafana use.
    - secretKey: argocd_oidc_client_secret
      remoteRef:
        key: argocd-oidc
        property: client_secret
    - secretKey: grafana_oidc_client_secret
      remoteRef:
        key: grafana-oidc
        property: client_secret
    - secretKey: gatus_oidc_client_secret
      remoteRef:
        key: gatus-oidc
        property: client_secret
---
# basic-auth secret consumed by the CloudNativePG Cluster as the owner role
# credentials for the `authentik` database user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-app
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: authentik-pg-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: authentik
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: authentik-postgres
        property: password
---
# Valkey (Redis) password secret consumed by the Valkey StatefulSet.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-valkey-auth
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: authentik-valkey-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: bn54fyzizkl6sl76eajwqnzbou
        property: redis_password
