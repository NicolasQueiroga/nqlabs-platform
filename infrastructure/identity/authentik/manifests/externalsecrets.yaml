# ExternalSecrets for the Authentik identity stack — NQLabs Platform.
#
# All values sourced from OpenBao KV (kv/) via the nqlabs-openbao
# ClusterSecretStore. remoteRef format: key = KV item, property = field.
#
# OpenBao KV items used:
#   authentik          -> secret_key, bootstrap_password, bootstrap_token, redis_password
#   authentik-postgres -> password
#   argocd-oidc        -> client_secret
#   grafana-oidc       -> client_secret
#   gatus-oidc         -> client_secret
#   openbao-oidc       -> client_secret (standalone K8s secret: openbao-oidc-client-secret)
---
# Authentik application secrets, consumed by the chart via global.env (secretKeyRef).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret_key
      remoteRef:
        key: authentik
        property: secret_key
    - secretKey: bootstrap_password
      remoteRef:
        key: authentik
        property: bootstrap_password
    - secretKey: bootstrap_token
      remoteRef:
        key: authentik
        property: bootstrap_token
    - secretKey: redis_password
      remoteRef:
        key: authentik
        property: redis_password
    - secretKey: postgres_password
      remoteRef:
        key: authentik-postgres
        property: password
    # OIDC client secrets — referenced by blueprints via !Env so the providers
    # are created with the same secret ArgoCD/Grafana use.
    - secretKey: argocd_oidc_client_secret
      remoteRef:
        key: argocd-oidc
        property: client_secret
    - secretKey: grafana_oidc_client_secret
      remoteRef:
        key: grafana-oidc
        property: client_secret
    - secretKey: gatus_oidc_client_secret
      remoteRef:
        key: gatus-oidc
        property: client_secret
---
# basic-auth secret consumed by the CloudNativePG Cluster as the owner role
# credentials for the `authentik` database user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-app
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: authentik-pg-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: authentik
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: authentik-postgres
        property: password
---
# Valkey (Redis) password secret consumed by the Valkey StatefulSet.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-valkey-auth
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: authentik-valkey-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: authentik
        property: redis_password
---
# OpenBao OIDC client secret — standalone K8s Secret consumed by the
# openbao-oidc provider blueprint via !Env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-oidc-client-secret
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: openbao-oidc-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: openbao-oidc
        property: client_secret
