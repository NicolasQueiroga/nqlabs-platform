# ExternalSecrets for the Authentik identity stack — NQLabs Platform.
#
# All values sourced from 1Password (NQLabs vault) via the nqlabs-1password
# ClusterSecretStore. Items:
#   authentik-login (UUID pinned below) -> secret_key, bootstrap_password,
#                                          bootstrap_token, redis_password
#   authentik-postgres                  -> password
---
# Authentik application secrets, consumed by the chart via global.env (secretKeyRef).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  # Bootstrap login + OIDC client secrets must keep following 1Password so the
  # day-0 operator path stays deterministic after rebuilds and secret rotations.
  # One secret refresh per hour is low churn and avoids the drift bug caused by
  # CreatedOnce on this specific secret.
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret_key
      remoteRef:
        key: bn54fyzizkl6sl76eajwqnzbou/secret_key
    - secretKey: bootstrap_password
      remoteRef:
        key: bn54fyzizkl6sl76eajwqnzbou/bootstrap_password
    - secretKey: bootstrap_token
      remoteRef:
        key: bn54fyzizkl6sl76eajwqnzbou/bootstrap_token
    - secretKey: redis_password
      remoteRef:
        key: bn54fyzizkl6sl76eajwqnzbou/redis_password
    - secretKey: postgres_password
      remoteRef:
        key: authentik-postgres/password
    # OIDC client secrets — referenced by blueprints via !Env so the providers
    # are created with the same secret ArgoCD/Grafana use (from 1Password).
    - secretKey: argocd_oidc_client_secret
      remoteRef:
        key: argocd-oidc/client_secret
    - secretKey: grafana_oidc_client_secret
      remoteRef:
        key: grafana-oidc/client_secret
    - secretKey: gatus_oidc_client_secret
      remoteRef:
        key: gatus-oidc/client_secret
---
# basic-auth secret consumed by the CloudNativePG Cluster as the owner role
# credentials for the `authentik` database user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-app
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  # Static database credentials. Avoid periodic provider reads during fleet-wide
  # reconciliation; revisit when OpenBao-backed rotation is added.
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: authentik-pg-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CNPG requires this label to adopt a user-supplied credentials secret.
          cnpg.io/reload: "true"
      data:
        username: authentik
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: authentik-postgres/password
---
# Valkey (Redis) password secret consumed by the Valkey StatefulSet.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-valkey-auth
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  # Static Valkey credentials. Avoid periodic provider reads during fleet-wide
  # reconciliation; revisit when OpenBao-backed rotation is added.
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: authentik-valkey-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: bn54fyzizkl6sl76eajwqnzbou/redis_password
