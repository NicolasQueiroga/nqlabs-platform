# CNPG backup configuration for Authentik PostgreSQL.
#
# WAL archiving + scheduled backups to Ceph RGW (S3-compatible, in-cluster).
# The `authentik-pg` bucket is provisioned by the OBC below.
#
# S3 credentials are synced from 1Password item "authentik-pg-backup-s3"
# via ExternalSecret. If the OBC is reprovisioned (new user), update the
# 1Password item.
# Backup schedule: daily at 02:00 UTC. Retention: 7 days.
# WAL files are archived continuously, enabling point-in-time recovery (PITR).
---
# Provision a dedicated Postgres backup bucket on the internal Ceph RGW.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: authentik-pg-rgw
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-pg
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  bucketName: authentik-pg
  storageClassName: ceph-bucket
---
# ExternalSecret — S3 credentials for CNPG backup + WAL archiving on RGW.
# Synced from 1Password item "authentik-pg-backup-s3".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-backup-s3
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-pg
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: nqlabs-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: authentik-pg-backup-s3
    template:
      type: Opaque
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: authentik-pg-backup-s3
        property: ACCESS_KEY_ID
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: authentik-pg-backup-s3
        property: SECRET_ACCESS_KEY
---
# Scheduled backup: daily at 02:00 UTC, keep 7 backups.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-pg-daily
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  schedule: "0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: authentik-pg
