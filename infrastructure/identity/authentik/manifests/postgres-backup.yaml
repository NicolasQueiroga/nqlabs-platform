# CNPG backup configuration for Authentik PostgreSQL.
#
# WAL archiving + scheduled backups to Ceph RGW (S3-compatible, in-cluster).
# The `authentik-pg` bucket is provisioned by the OBC below.
#
# S3 credentials are the OBC-generated RGW user for the authentik-pg bucket.
# If the OBC is reprovisioned (new user), update these values.
# Backup schedule: daily at 02:00 UTC. Retention: 7 days.
# WAL files are archived continuously, enabling point-in-time recovery (PITR).
---
# Provision a dedicated Postgres backup bucket on the internal Ceph RGW.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: authentik-pg-rgw
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-pg
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  bucketName: authentik-pg
  storageClassName: ceph-bucket
---
# S3 credentials for CNPG backup + WAL archiving on RGW.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-pg-backup-s3
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-pg
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: nqlabs-platform
    cnpg.io/reload: "true"
type: Opaque
stringData:
  ACCESS_KEY_ID: SLMSOG1GQIB1S1WD1Q70
  SECRET_ACCESS_KEY: 3ZJrhqgyMIx9U0BzNGNdfz2ODJJqhoy1z72oR6DH
---
# Scheduled backup: daily at 02:00 UTC, keep 7 backups.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-pg-daily
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  schedule: "0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: authentik-pg
