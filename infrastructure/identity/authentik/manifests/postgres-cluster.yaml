# PostgreSQL for Authentik, managed by CloudNativePG.
#
# Single instance for Phase 0 (single-node management cluster). Scale
# .spec.instances to 3 for HA once NUC nodes are added — CNPG handles
# replication and failover.
#
# Runs non-root (uid 26) on ceph-block (replicated RBD, size=2). CNPG mounts
# the PVC directly (no subPath), so the Talos non-root-write restriction
# does not apply.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6

  # Owner role + database created from the ESO-managed basic-auth secret so the
  # password matches what Authentik uses (authentik-postgres/password in 1Password).
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-pg-app

  storage:
    storageClass: ceph-block
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Surface CNPG/Postgres metrics to kube-prometheus-stack.
  monitoring:
    enablePodMonitor: true

  # WAL archiving to Ceph RGW (S3-compatible) for point-in-time recovery.
  # DISABLED during prototyping phase — stale WAL objects from previous cluster
  # incarnations cause barman-cloud-check-wal-archive to fail ("Expected empty
  # archive"), which prevents new WALs from being archived. WALs accumulate on
  # the PVC → PVC fills → CNPG refuses to start PostgreSQL → Authentik down.
  # This has happened twice (2026-07-17, 2026-07-27). Velero full backups
  # provide sufficient DR during prototyping. Re-enable when the 1TB HD is
  # added and capacity is no longer a crisis. See runbook sso-authentik.md
  # for the RGW bucket purge procedure required before re-enabling.
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://authentik-pg/wal
  #     endpointURL: http://rook-ceph-rgw-platform-object-store.rook-ceph.svc:80
  #     s3Credentials:
  #       accessKeyId:
  #         name: authentik-pg-backup-s3
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: authentik-pg-backup-s3
  #         key: SECRET_ACCESS_KEY
  #     wal:
  #       maxParallel: 2
  #       compression: gzip
  #   retentionPolicy: "7d"

  affinity:
    # Single-node Phase 0: allow scheduling without anti-affinity blocking.
    podAntiAffinityType: preferred
