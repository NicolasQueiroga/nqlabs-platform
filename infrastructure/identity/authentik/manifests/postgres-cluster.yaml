# PostgreSQL for Authentik, managed by CloudNativePG.
#
# Single instance for Phase 0 (single-node management cluster). Scale
# .spec.instances to 3 for HA once NUC nodes are added — CNPG handles
# replication and failover.
#
# Runs non-root (uid 26) on local-path. CNPG mounts the PVC directly (no
# subPath), so the Talos non-root-write restriction does not apply.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6

  # Owner role + database created from the ESO-managed basic-auth secret so the
  # password matches what Authentik uses (authentik-postgres/password in 1Password).
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-pg-app

  storage:
    storageClass: local-path
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Surface CNPG/Postgres metrics to kube-prometheus-stack.
  monitoring:
    enablePodMonitor: true

  # WAL archiving to MinIO (S3-compatible) for point-in-time recovery.
  # The authentik-pg bucket is created by the MinIO make-bucket Job.
  # Credentials come from the authentik-pg-backup-s3 secret (ESO-managed).
  backup:
    barmanObjectStore:
      destinationPath: s3://authentik-pg/wal
      endpointURL: http://minio.minio:9000
      s3Credentials:
        accessKeyId:
          name: authentik-pg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: authentik-pg-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        maxParallel: 2
        compression: gzip
    retentionPolicy: "7d"

  affinity:
    # Single-node Phase 0: allow scheduling without anti-affinity blocking.
    podAntiAffinityType: preferred
