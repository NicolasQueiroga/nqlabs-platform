# Hubble UI route — hubble.platform.nqlabs.network
#
# Hubble UI has no native OIDC. Route through Authentik embedded proxy outpost;
# Authentik then reverse-proxies to hubble-ui.kube-system:80 after group policy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: authentik
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hubble.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - hubble.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
      timeouts:
        request: 300s
        backendRequest: 300s
