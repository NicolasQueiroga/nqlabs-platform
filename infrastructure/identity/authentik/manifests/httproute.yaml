# Authentik UI/API route — auth.platform.nqlabs.network
#
# HTTPS terminates at the platform-gateway; forwarded to the authentik-server
# Service on HTTP. This is the public entry point for SSO logins and the
# proxy-outpost forward-auth flow.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
  annotations:
    external-dns.alpha.kubernetes.io/hostname: auth.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - auth.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
