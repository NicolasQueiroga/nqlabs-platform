# NetworkPolicies for the authentik namespace.
#
# Default-deny ingress + egress, then allow only the specific flows needed:
#   - Gateway namespace → authentik-server (HTTP 80) — public SSO + proxy outpost
#   - authentik-server → authentik-valkey (6379) — cache + Celery broker
#   - authentik-worker → authentik-valkey (6379) — Celery queue
#   - authentik-server → authentik-pg-rw (5432) — database
#   - authentik-worker → authentik-pg-rw (5432) — database
#   - authentik-server → monitoring / argo-rollouts / hubble-ui / openbao — proxy backends
#   - monitoring namespace → authentik-server (metrics) — Prometheus scrape
#
# CNPG pods (authentik-pg-rw) are managed by the CNPG operator in the same
# namespace; their ingress is restricted to the authentik server/worker only.
# Valkey ingress is restricted to authentik server/worker only.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-default-deny
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: []
  egress:
    - toEndpoints: []
---
# DNS egress for all pods in authentik namespace.
# Use a CiliumNetworkPolicy here because DNS traffic goes to the kube-dns
# ClusterIP service first; selecting the backend CoreDNS pods with a standard
# Kubernetes NetworkPolicy proved insufficient under this Cilium datapath.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-allow-dns
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": dns
            "k8s:k8s-app": coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
# Allow authentik-server and authentik-worker to reach each other.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-allow-internal
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: authentik
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": authentik
            app.kubernetes.io/instance: authentik
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "9000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": authentik
            app.kubernetes.io/instance: authentik
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "9000"
              protocol: TCP
---
# Allow the Cilium Gateway to reach authentik-server.
# cilium-envoy runs with hostNetwork=true so it has no pod IP and no
# Kubernetes NetworkPolicy identity — a standard NetworkPolicy with a
# podSelector or namespaceSelector cannot match it. Cilium classifies
# traffic that passed through its Ingress/Gateway dataplane as the
# reserved "ingress" entity; CiliumNetworkPolicy is required here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-allow-gateway
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: authentik
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# Allow Prometheus (monitoring namespace) to scrape authentik-server metrics.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-allow-prometheus
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: authentik
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
---
# Allow monitoring namespace pods to reach authentik-server over HTTP.
# Required for Gatus OIDC discovery and future blackbox/health checks.
# Service port 80 targets container port 9000, so the NetworkPolicy must
# allow the pod port (9000), not the Service port (80).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-allow-monitoring-http
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: authentik
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# Allow rook-ceph namespace pods to reach authentik-server over HTTP.
# Required for the Ceph SAML bootstrap Job to download IdP metadata.
# Service port 80 targets container port 9000, so the NetworkPolicy must
# allow the pod port (9000), not the Service port (80).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-allow-rook-ceph-http
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: authentik
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": rook-ceph
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# Allow authentik server/worker to reach Valkey (cache + Celery broker).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-allow-to-valkey
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/part-of: authentik
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": authentik
            app.kubernetes.io/instance: authentik
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# Allow authentik server/worker to reach CNPG Postgres.
# Also allow the CNPG operator (cnpg-system) to reach the instance manager
# HTTP port (8000) for health checks and switchover operations.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-allow-to-postgres
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": authentik
            app.kubernetes.io/instance: authentik
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
# Allow the embedded proxy outpost in authentik-server to reach the protected
# backend UIs it reverse-proxies after login.
# Ceph Dashboard is no longer proxied here; it uses native SAML SSO instead.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-egress-proxy-backends
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: authentik
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "4040"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
            - port: "9115"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": argo-rollouts
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "8081"
              protocol: TCP
---
# Allow OpenBao to reach authentik-server for OIDC discovery and token exchange.
# Service port 80 targets container port 9000, so the NetworkPolicy must
# allow the pod port (9000), not the Service port (80).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-allow-openbao-http
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: authentik
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": openbao
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# Allow authentik server/worker egress to Valkey and Postgres within namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-egress-data-layer
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: authentik
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": authentik
            app.kubernetes.io/name: valkey
            app.kubernetes.io/part-of: authentik
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": authentik
            cnpg.io/cluster: authentik-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# Allow authentik app pods to query the Kubernetes API when outpost service
# health monitoring checks ClusterIP-backed dependencies.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-app-egress-apiserver
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: authentik
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# Allow CNPG instance manager (authentik-pg-*) to call the Kubernetes API
# server. In Cilium, egress to the kube-apiserver should use the
# kube-apiserver entity instead of a Kubernetes NetworkPolicy ipBlock against
# the kubernetes.default.svc ClusterIP, because service IP traffic to control
# plane nodes may bypass/ignore CIDR-based policy matching in self-hosted
# clusters.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-cnpg-egress-apiserver
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# Allow CNPG instance manager (authentik-pg-*) to archive WAL files and
# run backups to the Ceph RGW object store in the rook-ceph namespace.
# The RGW Service exposes port 80, but targets the RGW pod's http port 8080;
# NetworkPolicy is evaluated against the translated destination pod port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-cnpg-egress-rgw
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": rook-ceph
            app: rook-ceph-rgw
            rook_object_store: platform-object-store
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
