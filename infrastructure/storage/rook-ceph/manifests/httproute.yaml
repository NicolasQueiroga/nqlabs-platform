# HTTPRoute for Ceph dashboard — route to an internal reverse proxy that
# bridges the gateway's plain HTTP hop back to Ceph's self-signed HTTPS
# dashboard. This preserves native SAML while avoiding BackendTLSPolicy.
#
# Hostname: ceph.platform.nqlabs.network
# Backend: ceph-dashboard-proxy:8080 (HTTP inside cluster, proxy re-encrypts upstream)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    external-dns.alpha.kubernetes.io/hostname: ceph.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - ceph.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ceph-dashboard-proxy
          namespace: rook-ceph
          port: 8080
      timeouts:
        request: 300s
        backendRequest: 300s
