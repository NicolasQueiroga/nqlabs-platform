# HTTPRoute for Ceph dashboard — routed through Authentik proxy outpost.
#
# Hostname: ceph.platform.nqlabs.network
# Backend: authentik-server (forward-auth proxy → rook-ceph-mgr-dashboard:8443)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ceph.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - ceph.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Routed through the Authentik embedded outpost (forward-auth).
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
      timeouts:
        request: 300s
        backendRequest: 300s
