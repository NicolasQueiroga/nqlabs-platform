# HTTPRoute for Ceph dashboard — direct to MGR dashboard (SAML SSO handles auth).
#
# Hostname: ceph.platform.nqlabs.network
# Backend: rook-ceph-mgr-dashboard:8443 (HTTP inside cluster, TLS at gateway)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ceph.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - ceph.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rook-ceph-mgr-dashboard
          namespace: rook-ceph
          port: 8443
      timeouts:
        request: 300s
        backendRequest: 300s
