# Smoke-test the internal RGW object store using the same bucket-provisioning
# pattern that future consumers will use: a bucket StorageClass + OBC-generated
# credentials/config.
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: platform-rgw-smoke
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  generateBucketName: platform-rgw-smoke-
  storageClassName: ceph-bucket
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rgw-smoke-test
  namespace: rook-ceph
  labels:
    app.kubernetes.io/name: rgw-smoke-test
    app.kubernetes.io/part-of: nqlabs-platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: docker.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: ["sh", "-c"]
          args:
            - |
              set -eu

              echo "Waiting for OBC-generated bucket metadata and credentials..."
              for i in $(seq 1 60); do
                if [ -f /bucket/BUCKET_HOST ] && [ -f /bucket/BUCKET_PORT ] && [ -f /bucket/BUCKET_NAME ] && [ -f /creds/AWS_ACCESS_KEY_ID ] && [ -f /creds/AWS_SECRET_ACCESS_KEY ]; then
                  break
                fi
                echo "  not ready yet, retrying in 5s... ($i/60)"
                sleep 5
              done

              AWS_HOST=$(cat /bucket/BUCKET_HOST)
              PORT=$(cat /bucket/BUCKET_PORT)
              BUCKET_NAME=$(cat /bucket/BUCKET_NAME)
              AWS_ACCESS_KEY_ID=$(cat /creds/AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY=$(cat /creds/AWS_SECRET_ACCESS_KEY)
              MC_CONFIG_DIR=/tmp/.mc
              mkdir -p "$MC_CONFIG_DIR"

              echo "Waiting for RGW S3 endpoint to accept the generated credentials..."
              for i in $(seq 1 30); do
                if mc --config-dir "$MC_CONFIG_DIR" alias set rgw "http://${AWS_HOST}:${PORT}" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" >/dev/null 2>&1; then
                  break
                fi
                echo "  endpoint not ready yet, retrying in 5s... ($i/30)"
                sleep 5
              done

              mc --config-dir "$MC_CONFIG_DIR" ls "rgw/${BUCKET_NAME}" >/dev/null 2>&1 || {
                echo "ERROR: RGW bucket did not become reachable with the generated credentials"
                exit 1
              }

              printf 'rgw smoke %s\n' "$(date -u +%FT%TZ)" > /tmp/smoke.txt
              mc --config-dir "$MC_CONFIG_DIR" cp /tmp/smoke.txt "rgw/${BUCKET_NAME}/smoke.txt" >/dev/null
              mc --config-dir "$MC_CONFIG_DIR" cat "rgw/${BUCKET_NAME}/smoke.txt" | grep -q '^rgw smoke '
              mc --config-dir "$MC_CONFIG_DIR" rm --force "rgw/${BUCKET_NAME}/smoke.txt" >/dev/null
              echo "RGW smoke test passed"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: bucket-config
              mountPath: /bucket
              readOnly: true
            - name: bucket-credentials
              mountPath: /creds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bucket-config
          configMap:
            name: platform-rgw-smoke
            optional: true
        - name: bucket-credentials
          secret:
            secretName: platform-rgw-smoke
            optional: true
        - name: tmp
          emptyDir: {}
