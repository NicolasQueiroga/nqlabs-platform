# Smoke-test the internal RGW object store using the same bucket-provisioning
# pattern that future consumers will use: a bucket StorageClass + OBC-generated
# credentials/config.
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: platform-rgw-smoke
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  generateBucketName: platform-rgw-smoke-
  storageClassName: ceph-bucket
