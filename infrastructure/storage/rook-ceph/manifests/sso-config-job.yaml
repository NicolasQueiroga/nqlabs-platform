# Ceph Dashboard SAML SSO configuration Job.
#
# This Job runs as an ArgoCD PostSync hook after the rook-ceph-cluster app
# is synced. It:
#   1. Waits for the Ceph cluster to be ready
#   2. Forces the dashboard to HTTPS and reloads the mgr dashboard module
#   3. Downloads the Authentik SAML IdP metadata (via internal service)
#   4. Configures and enables SAML2 SSO on the Ceph dashboard
#   5. Reconciles dashboard users matching Authentik email attributes
#
# The Job is idempotent — re-running it reconfigures SSO (harmless) and
# skips user creation if the user already exists.
#
# Ceph dashboard SAML requires users to exist locally before SSO login
# works. The username attribute is the Authentik email claim, so users
# are created with their email address as the username.
#
# The Job mounts two Secrets created by the Rook operator:
#   - rook-ceph-config (mon_host key)
#   - rook-ceph-admin-keyring (keyring key)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ceph-sso-config
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ceph-sso-config
          image: quay.io/ceph/ceph:v20.2.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # Build ceph.conf from the mounted Secret
              MON_HOST=$(cat /etc/rook/config/mon_host)
              cat > /tmp/ceph.conf <<EOF
              [global]
              mon host = ${MON_HOST}
              EOF

              CEPH="ceph --conf /tmp/ceph.conf --keyring /etc/rook/keyring/keyring --connect-timeout 10"

              # Wait for Ceph cluster to be ready (max 5 minutes)
              echo "Waiting for Ceph cluster to be ready..."
              for i in $(seq 1 60); do
                if $CEPH status >/dev/null 2>&1; then
                  echo "Ceph cluster is ready!"
                  break
                fi
                echo "  not ready yet, retrying in 5s... ($i/60)"
                sleep 5
              done
              if ! $CEPH status >/dev/null 2>&1; then
                echo "ERROR: Ceph cluster not ready after 5 minutes"
                exit 1
              fi

              # Keep the dashboard on HTTPS so native SAML sees the request
              # as HTTPS during ACS validation. Cilium 1.19 cannot re-encrypt
              # directly to Ceph with BackendTLSPolicy, so an internal reverse
              # proxy bridges the gateway's HTTP hop back to this HTTPS backend.
              echo "Switching Ceph dashboard to HTTPS..."
              $CEPH config set mgr mgr/dashboard/ssl true
              $CEPH mgr module disable dashboard
              $CEPH mgr module enable dashboard

              echo "Waiting for dashboard service to speak HTTPS..."
              for i in $(seq 1 24); do
                DASHBOARD_URL=$($CEPH mgr services 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("dashboard", ""))')
                if echo "$DASHBOARD_URL" | grep -q '^https://'; then
                  echo "Dashboard protocol switched: $DASHBOARD_URL"
                  break
                fi
                echo "  dashboard still not switched, retrying in 5s... ($i/24)"
                sleep 5
              done
              if ! $CEPH mgr services 2>/dev/null | python3 -c 'import sys,json; import re; sys.exit(0 if re.match(r"^https://", json.load(sys.stdin).get("dashboard", "")) else 1)'; then
                echo "ERROR: Dashboard did not switch to HTTPS in time"
                exit 1
              fi

              # Download Authentik SAML IdP metadata via the internal service.
              # Follow redirects in-cluster so we never depend on gateway hairpin
              # behavior or external DNS while bootstrapping SSO.
              echo "Downloading Authentik SAML IdP metadata..."
              curl -sL \
                -H 'Host: auth.platform.nqlabs.network' \
                -H 'X-Forwarded-Proto: https' \
                http://authentik-server.authentik.svc.cluster.local:80/application/saml/ceph/metadata/ \
                > /tmp/idp-metadata.xml

              if [ ! -s /tmp/idp-metadata.xml ] || ! grep -q 'EntityDescriptor' /tmp/idp-metadata.xml; then
                echo "ERROR: Failed to download valid IdP metadata"
                exit 1
              fi
              echo "Downloaded IdP metadata ($(wc -c < /tmp/idp-metadata.xml) bytes)"

              # Configure SAML SSO
              # Username attribute = email claim (matches pre-created Ceph users)
              echo "Configuring SAML SSO..."
              $CEPH dashboard sso setup saml2 \
                https://ceph.platform.nqlabs.network \
                "$(cat /tmp/idp-metadata.xml)" \
                "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"

              # Enable SAML SSO
              echo "Enabling SAML SSO..."
              $CEPH dashboard sso enable saml2

              # Reconcile dashboard users.
              # SAML SSO requires users to exist locally with matching email.
              echo "Reconciling Ceph dashboard users..."
              echo "saml-sso-placeholder" > /tmp/ceph-pwd

              reconcile_user() {
                local username="$1" role="$2" name="$3" email="$4"
                if $CEPH dashboard ac-user-show "$username" >/dev/null 2>&1; then
                  echo "  User exists: $username"
                else
                  $CEPH dashboard ac-user-create -i /tmp/ceph-pwd \
                    "$username" "$role" "$name" "$email" --force-password >/dev/null
                  echo "  Created user: $username"
                fi

                $CEPH dashboard ac-user-enable "$username" >/dev/null || true
                $CEPH dashboard ac-user-set-info "$username" "$name" "$email" >/dev/null
                $CEPH dashboard ac-user-set-roles "$username" "$role" >/dev/null
                echo "  Reconciled user: $username (role: $role)"
              }

              reconcile_user "nicolas@nqlabs.io" "administrator" "Nicolas Queiroga" "nicolas@nqlabs.io"
              reconcile_user "dummy@nqlabs.io"   "read-only"     "Dummy User"      "dummy@nqlabs.io"

              echo "=== SSO configuration complete ==="
              $CEPH dashboard sso status
          volumeMounts:
            - name: rook-ceph-config
              mountPath: /etc/rook/config
              readOnly: true
            - name: rook-ceph-admin-keyring
              mountPath: /etc/rook/keyring
              readOnly: true
      volumes:
        - name: rook-ceph-config
          secret:
            secretName: rook-ceph-config
        - name: rook-ceph-admin-keyring
          secret:
            secretName: rook-ceph-admin-keyring
      restartPolicy: OnFailure
