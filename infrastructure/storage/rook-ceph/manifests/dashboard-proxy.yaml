# Internal reverse proxy for Ceph Dashboard.
#
# The Cilium Gateway terminates public TLS, but Ceph's native SAML validation
# still requires the backend request to arrive over HTTPS. This proxy accepts
# the gateway's in-cluster HTTP hop and then forwards to Ceph's self-signed
# HTTPS dashboard upstream.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceph-dashboard-proxy-config
  namespace: rook-ceph
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
      }

      location / {
        proxy_pass https://rook-ceph-mgr-dashboard.rook-ceph.svc.cluster.local:8443;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceph-dashboard-proxy
  namespace: rook-ceph
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ceph-dashboard-proxy
  template:
    metadata:
      labels:
        app: ceph-dashboard-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-config
          configMap:
            name: ceph-dashboard-proxy-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ceph-dashboard-proxy
  namespace: rook-ceph
spec:
  selector:
    app: ceph-dashboard-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
