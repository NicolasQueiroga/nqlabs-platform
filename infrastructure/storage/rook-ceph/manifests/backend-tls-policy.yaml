# Deprecated placeholder.
#
# Cilium 1.19 does not implement Gateway API BackendTLSPolicy, so the gateway
# cannot re-encrypt directly to Ceph's self-signed HTTPS dashboard.
#
# Instead, the public HTTPRoute targets an internal reverse proxy that accepts
# the gateway's plain HTTP hop and then connects to Ceph over HTTPS upstream.
# This preserves native SAML's HTTPS expectations without relying on
# BackendTLSPolicy support in the gateway dataplane.
#
# Keep this file as documentation until the platform upgrades to a Cilium
# release that fully supports BackendTLSPolicy. At that point we can revisit
# whether the extra reverse proxy hop is still necessary.
