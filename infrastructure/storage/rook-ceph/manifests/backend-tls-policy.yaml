# Deprecated placeholder.
#
# Cilium 1.19 does not implement Gateway API BackendTLSPolicy, so a graceful
# GitOps-managed HTTPS re-encryption path to Ceph's self-signed dashboard is not
# available on this cluster version.
#
# The Ceph dashboard is therefore served over HTTP inside the cluster (Ceph uses
# plain HTTP on the existing dashboard port), while the public Cilium Gateway
# listener terminates TLS for clients.
#
# Keep this file as documentation until the platform upgrades to a Cilium
# release that fully supports BackendTLSPolicy. At that point we can revisit
# whether end-to-end HTTPS to the Ceph dashboard is desirable.
