# NetworkPolicies for the rook-ceph namespace.
#
# Ceph pods (MON, MGR, OSD) communicate extensively with each other.
# We allow intra-namespace traffic + specific external ingress:
#   - Cilium gateway → Ceph dashboard reverse proxy (8080)
#   - Monitoring/Gatus → Ceph dashboard reverse proxy health endpoint (8080)
#   - Prometheus → MGR metrics (9282)
#
# No deny-all policy: Ceph internal traffic uses many dynamic ports
# (6789, 3300, 6800-7300). A deny-all would require enumerating all
# of them. Intra-namespace allow is sufficient for pod-to-pod traffic.
#
# Ceph CSI nodeplugins run hostNetwork=true, so cross-node traffic can appear
# from node IPs instead of pod IPs. Allow the management LAN to reach Ceph pods
# so RBD node stage/map can talk to mons and OSDs across nodes.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rook-ceph-allow-intra-namespace
  namespace: rook-ceph
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}

---
# Allow hostNetwork clients on Kubernetes nodes (notably Ceph CSI nodeplugins)
# to reach Ceph daemons. With Cilium, hostNetwork pod traffic is classified as
# host/remote-node identity, so a Kubernetes NetworkPolicy ipBlock does not
# reliably match it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rook-ceph-allow-hostnetwork-clients
  namespace: rook-ceph
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
    - fromCIDRSet:
        - cidr: 192.168.15.0/24

---
# Allow Cilium Gateway API to reach the Ceph dashboard reverse proxy.
# The proxy then bridges to Ceph's native HTTPS dashboard so SAML sees HTTPS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rook-ceph-allow-cilium-gateway
  namespace: rook-ceph
spec:
  endpointSelector:
    matchLabels:
      app: ceph-dashboard-proxy
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
# Allow Gatus/monitoring to check the Ceph dashboard proxy health.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rook-ceph-allow-monitoring-dashboard
  namespace: rook-ceph
spec:
  podSelector:
    matchLabels:
      app: ceph-dashboard-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP

---
# Allow Gatus/monitoring to check the internal Ceph RGW S3 endpoint.
# The RGW Service exposes port 80, but targets the RGW pod's http port 8080;
# NetworkPolicy is evaluated against the translated destination pod port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rook-ceph-allow-monitoring-rgw
  namespace: rook-ceph
spec:
  podSelector:
    matchLabels:
      app: rook-ceph-rgw
      rook_object_store: platform-object-store
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP

---
# Allow Prometheus to scrape Ceph metrics (mgr prometheus module on 9282).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rook-ceph-allow-prometheus
  namespace: rook-ceph
spec:
  podSelector:
    matchLabels:
      app: rook-ceph-mgr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9282
          protocol: TCP
