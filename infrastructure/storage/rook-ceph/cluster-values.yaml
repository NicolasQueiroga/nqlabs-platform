# Rook Ceph Cluster values
# https://github.com/rook/rook/blob/master/deploy/charts/rook-ceph-cluster/values.yaml
#
# Creates CephCluster CR + CephBlockPool + StorageClass.
# Operator must be installed first (rook-ceph chart).

operatorNamespace: rook-ceph

cephClusterSpec:
  # Ceph version — matched to rook-ceph 1.20.x
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.1
    allowUnsupported: false

  # Talos dataDirHostPath (default)
  dataDirHostPath: /var/lib/rook

  # 3 MONs — one per node (3 nodes = quorum)
  mon:
    count: 3
    allowMultiplePerNode: false

  # Keep the monitor disk-space warning meaningful for the 30GB Talos /var
  # volumes used in this lab. Ceph's default 30% warning is too conservative
  # here and triggers while the nodes still have ~13-14GiB free; critical
  # thresholds remain unchanged. Lowered to 10% because at 15% the warning
  # was still triggering with 4.7G available (85% used) on 30G disks.
  cephConfig:
    mon:
      mon_data_avail_warn: "10"
  # NOTE: mon_osd_full_ratio, mon_osd_nearfull_ratio, and
  # mon_osd_backfillfull_ratio are "special" Ceph settings that cannot be
  # stored in the config database (ceph config set rejects them with
  # EINVAL). They can only be set via `ceph osd set-full-ratio` etc.
  # Do NOT put them in cephConfig — Rook will fail to reconcile.
  # They are set manually after cluster creation and persisted in the
  # OSD map (not the config database). See docs/runbooks/cluster-lifecycle.md.

  # 1 MGR (active/standby not needed for 3-node lab)
  mgr:
    count: 1
    modules:
      - name: pg_autoscaler
        enabled: true

  # Dashboard enabled — served with HTTPS by Ceph itself. The public Cilium
  # gateway still terminates client TLS, but because Cilium 1.19 lacks
  # BackendTLSPolicy support we bridge back to Ceph's self-signed HTTPS
  # dashboard through an internal reverse proxy instead of direct re-encryption.
  dashboard:
    enabled: true
    ssl: true

  # Use all 3 nodes, target sdb specifically
  storage:
    useAllNodes: true
    useAllDevices: false
    devices:
      - name: "sdb"
    config:
      osdsPerDevice: "1"

  # Tolerate control-plane taints
  placement:
    all:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

  # Resource requests for Ceph daemons
  resources:
    mon:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    mgr:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    osd:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi

  # Health checks
  healthCheck:
    daemonHealth:
      mon:
        interval: 45s
      osd:
        interval: 60s
      status:
        interval: 60s

# Block storage pool (RBD) — replaces local-path for new PVCs
# size 1: no replication on this 3-node lab cluster. The 30 GiB raw capacity
# (3×10 GiB OSDs) is too small for size=2 replication of all monitoring PVCs.
# With size=2, 12 GiB of block data → 24 GiB raw + 3 GiB RGW + metadata = >27 GiB.
# Size 1 is an accepted lab trade-off; add more OSD capacity to enable size=2.
cephBlockPools:
  - name: ceph-blockpool
    spec:
      failureDomain: host
      replicated:
        size: 1
      application: rbd
    storageClass:
      enabled: true
      name: ceph-block
      isDefault: true
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: WaitForFirstConsumer
      parameters:
        pool: ceph-blockpool
        imageFormat: "2"
        imageFeatures: layering
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
        csi.storage.k8s.io/fstype: ext4

# No filesystem (not needed yet)
cephFileSystems: []

# Object storage (RGW) — internal-only S3 endpoint for platform services.
# Phase 1 keeps RGW private to the cluster; later migration phases will move
# Thanos, CNPG backup/WAL, and Velero onto this store one consumer at a time.
# Buckets are provisioned via the generated `ceph-bucket` StorageClass.
cephObjectStores:
  - name: platform-object-store
    spec:
      metadataPool:
        failureDomain: host
        replicated:
          size: 1
      dataPool:
        failureDomain: host
        erasureCoded:
          dataChunks: 2
          codingChunks: 1
      preservePoolsOnDelete: true
      gateway:
        port: 80
        instances: 2
        priorityClassName: system-cluster-critical
        placement:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: rook-ceph-rgw
                topologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
    storageClass:
      enabled: true
      name: ceph-bucket
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      parameters:
        region: us-east-1

# Volume snapshots
# Enabled — snapshot-controller app (wave -1) provides the CRDs.
cephBlockPoolsVolumeSnapshotClass:
  enabled: true
  name: ceph-block-snapshot
  isDefault: true
  parameters:
    pool: ceph-blockpool

# Ceph toolbox — debug pod with ceph CLI for cluster inspection.
toolbox:
  enabled: true
