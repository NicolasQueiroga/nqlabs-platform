# MinIO — S3-compatible backup target for Velero (management cluster, local-path).
# Single instance; this is a backup TARGET, not durable storage. Offsite (Cloudflare
# R2) is the production DR upgrade — see docs/runbooks/backup-velero.md.
# Root creds (= S3 access/secret) come from 1Password item `velero-backup`.
# Console OIDC client secret comes from 1Password item `minio-oidc`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-auth
  namespace: minio
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: nqlabs-1password
  target:
    name: minio-auth
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef: { key: velero-minio/access-key }
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef: { key: velero-minio/secret-key }
    - secretKey: MINIO_IDENTITY_OPENID_CLIENT_SECRET
      remoteRef: { key: minio-oidc/client_secret }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: minio
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels: { app.kubernetes.io/name: minio }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: minio } }
  template:
    metadata: { labels: { app.kubernetes.io/name: minio } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: minio
          image: docker.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef: { name: minio-auth }
          env:
            - name: MINIO_IDENTITY_OPENID_CONFIG_URL
              value: "https://auth.platform.nqlabs.network/application/o/minio/.well-known/openid-configuration"
            - name: MINIO_IDENTITY_OPENID_CLIENT_ID
              value: "minio"
            - name: MINIO_IDENTITY_OPENID_REDIRECT_URI
              value: "https://minio.platform.nqlabs.network/oauth_callback"
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            # Writable tmp for MinIO internal operations (readOnlyRootFilesystem)
            - { name: tmp, mountPath: /tmp }
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  selector: { app.kubernetes.io/name: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# Create the velero bucket (idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  generateName: minio-make-bucket-
  namespace: minio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mc
          image: docker.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          envFrom:
            - secretRef: { name: minio-auth }
          env:
            - { name: HOME, value: /tmp }
            - { name: MC_CONFIG_DIR, value: /tmp/.mc }
          command: [sh, -c]
          args:
            - |
              set -e
              # Wait for MinIO to be ready before creating buckets.
              # Retries for up to ~5 minutes (30 × 10s) to survive a fresh
              # bootstrap where MinIO may still be pulling its image.
              echo "Waiting for MinIO to be ready..."
              for i in $(seq 1 30); do
                if mc alias set m http://minio.minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null; then
                  echo "MinIO is reachable."
                  break
                fi
                echo "Attempt $i/30: MinIO not ready yet, retrying in 10s..."
                sleep 10
              done
              # Verify we actually connected; fail fast if not.
              mc admin info m >/dev/null 2>&1 || {
                echo "ERROR: Could not connect to MinIO after 30 attempts."
                exit 1
              }
              mc mb --ignore-existing m/velero &&
              mc mb --ignore-existing m/thanos &&
              mc mb --ignore-existing m/authentik-pg &&
              echo "bucket ready"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
# HTTPRoute for the MinIO console — native OIDC via Authentik.
# The S3 API (port 9000) stays internal-only; only the console (port 9001)
# is exposed through the gateway. MinIO handles OIDC login itself, redirecting
# to Authentik for authentication and accepting the returned token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
  namespace: minio
  annotations:
    external-dns.alpha.kubernetes.io/hostname: minio.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - minio.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: minio
          port: 9001
