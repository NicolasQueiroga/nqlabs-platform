# Default-deny ingress for the kyverno namespace (owned by management-kyverno).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: kyverno
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: []
---
# Allow monitoring namespace (Gatus health checks + Prometheus scraping) to reach
# Kyverno metrics on port 8000.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kyverno-allow-monitoring
  namespace: kyverno
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
