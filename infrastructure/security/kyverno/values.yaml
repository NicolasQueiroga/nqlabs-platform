# Kyverno — policy engine for NQLabs.
# Single-node clusters: 1 replica per controller.
# For multi-node production: set admissionController.replicas and
# backgroundController.replicas to 2+ for HA.
admissionController:
  replicas: 1
  serviceMonitor:
    enabled: true
    interval: 30s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
backgroundController:
  replicas: 1
  serviceMonitor:
    enabled: true
    interval: 30s
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
reportsController:
  replicas: 1
  serviceMonitor:
    enabled: true
    interval: 30s
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
cleanupController:
  replicas: 1
  serviceMonitor:
    enabled: true
    interval: 30s
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

grafana:
  enabled: true
  namespace: monitoring

# Enable PolicyException resources.
# Required for namespaced PolicyException objects to be processed by the
# admission controller. Without this flag, PolicyExceptions are created but
# silently ignored (--enablePolicyException=false by default).
features:
  policyExceptions:
    enabled: true
