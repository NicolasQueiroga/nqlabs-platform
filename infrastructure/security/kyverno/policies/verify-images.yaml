# Verify NQLabs images are Cosign-signed (keyless) by our GitHub Actions.
# AUDIT + failurePolicy Ignore — surfaces unsigned images in PolicyReports without
# blocking. Applies fleet-wide once Kyverno is on staging/production too.
#
# Autogen is intentionally enabled so image checks apply to controllers too.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/category: Supply Chain
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: verify-ghcr-nqlabs
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/nicolasqueiroga/*"
          failureAction: Audit
          # mutateDigest must be false in Audit mode (mutation only valid when
          # Enforcing). Flip to true together with failureAction: Enforce later.
          mutateDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/NicolasQueiroga/nqlabs-*"
                    rekor:
                      url: "https://rekor.sigstore.dev"
