# Verify NQLabs images are Cosign-signed (keyless) by GitHub Actions.
# Enforce: service-factory images must be signed before admission. Current demo
# staging/production images were verified with local cosign before enabling.
#
# Autogen is intentionally enabled so image checks apply to controllers too.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/category: Supply Chain
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Fail
  rules:
    - name: verify-ghcr-nqlabs
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/nicolasqueiroga/*"
          failureAction: Enforce
          mutateDigest: true
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/NicolasQueiroga/nqlabs-*"
                    rekor:
                      url: "https://rekor.sigstore.dev"
