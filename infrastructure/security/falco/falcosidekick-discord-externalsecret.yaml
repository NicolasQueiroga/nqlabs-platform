# ExternalSecret for Falcosidekick Discord webhook.
#
# Reuses the same 1Password item as Alertmanager (alertmanager-discord/webhook_url)
# since both send to the same Discord channel.
#
# The webhook URL is injected into the Falcosidekick deployment via extraEnv
# in values-management.yaml. Falcosidekick reads it from the DISCORD_WEBHOOKURL
# env var.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falcosidekick-discord-webhook
  namespace: falco
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: falcosidekick-discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook_url
      remoteRef:
        key: "alertmanager-discord"
        property: webhook_url
