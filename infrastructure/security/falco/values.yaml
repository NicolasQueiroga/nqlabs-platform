# Falco — runtime security (detection/alert only; never blocks). modern_ebpf CO-RE
# driver (no kernel module) works on Talos via BTF. JSON events to stdout are
# collected by promtail -> Loki.
#
# Security context: Falco requires privileged mode to access kernel data via
# eBPF. The falco namespace is labeled pod-security.kubernetes.io/enforce:
# privileged. This is intentional and required — Falco cannot run with
# restricted security context. The following securityContext is set by the
# Falco Helm chart automatically:
#   privileged: true
#   capabilities: { add: [SYS_PTRACE, SYS_MODULE, SYS_NICE, NET_ADMIN] }
# Do NOT override these — Falco needs them to instrument kernel syscalls.

driver:
  kind: modern_ebpf
collectors:
  enabled: true
falco:
  json_output: true
  json_include_output_property: true
  json_include_tags_property: true

metrics:
  enabled: true
  interval: 5m
  outputRule: true
  service:
    create: true

serviceMonitor:
  create: true
  interval: 30s

# Priority class — Falco is a critical security component that should run
# on every node, even under resource pressure.
priorityClassName: system-node-critical

# Tolerations — ensure Falco runs on all nodes, including control plane
# (Talos nodes have NoSchedule taints by default).
tolerations:
  - operator: Exists

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# falcoctl-artifact-follow sidecar — downloads/maintains Falco rules
# Resource requests (Kyverno require-resource-requests)
#
# Alerting architecture: Falco outputs JSON events to stdout. Promtail
# collects these and ships to Loki. Grafana alerts can trigger on
# Falco event log streams (log={container="falco"}). No Falcosidekick
# is needed — Loki-based alerting is the intended architecture for this
# lab. To add webhook/Slack/PagerDuty forwarding later, install
# Falcosidekick and set falco.json_output=false (switch to grpc output).
falcoctl:
  artifact:
    install:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
        memory: 128Mi

customRules:
  nqlabs_rules.yaml: |-
    - rule: NQLabs Shell Spawned In Container
      desc: Detect an interactive shell spawned inside any container.
      condition: spawned_process and container and proc.name in (shell_binaries)
      output: >
        Shell spawned in container (user=%user.name command=%proc.cmdline
        container=%container.name image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: WARNING
      tags: [nqlabs, container, shell, runtime]

    - rule: NQLabs Kubectl Binary In Container
      desc: Detect kubectl execution from inside a workload container.
      condition: spawned_process and container and proc.name=kubectl
      output: >
        kubectl executed in container (user=%user.name command=%proc.cmdline
        container=%container.name image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: WARNING
      tags: [nqlabs, kubectl, runtime]

    - rule: NQLabs Talosctl Binary In Container
      desc: Detect talosctl execution from inside a workload container.
      condition: spawned_process and container and proc.name=talosctl
      output: >
        talosctl executed in container (user=%user.name command=%proc.cmdline
        container=%container.name image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: CRITICAL
      tags: [nqlabs, talos, runtime]

    follow:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 128Mi
