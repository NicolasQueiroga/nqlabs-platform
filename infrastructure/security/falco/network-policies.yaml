# Default-deny ingress for the falco namespace (owned by management-falco).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: falco
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: []
---
# Allow monitoring namespace (Gatus health checks + Prometheus scraping) to reach
# Falcosidekick health endpoint on port 2801.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: falco-allow-monitoring
  namespace: falco
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "2801"
              protocol: TCP
