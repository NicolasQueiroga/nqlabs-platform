# Falcosidekick UI HTTPRoute — exposed via Authentik proxy.
#
# Hostname: falco.platform.nqlabs.network
# Backend: authentik-server:80 (Authentik embedded outpost proxies to falco-falcosidekick:2801)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: falcosidekick
  namespace: falco
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    external-dns.alpha.kubernetes.io/hostname: falco.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - falco.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
      timeouts:
        request: 300s
        backendRequest: 300s
