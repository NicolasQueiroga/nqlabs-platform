# NetworkPolicies for External Secrets Operator.
#
# Allows Prometheus scraping of metrics and intra-namespace control-plane traffic.
# API-server admission traffic to the webhook is allowed by a CiliumNetworkPolicy
# below using Cilium node identities instead of broad LAN CIDRs. Egress remains
# unrestricted because ESO must reach 1Password APIs and Kubernetes APIs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-deny-ingress
  namespace: external-secrets
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": external-secrets
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-allow-kube-apiserver-webhook
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
      app.kubernetes.io/name: external-secrets-webhook
  ingress:
    # Talos kube-apiserver admission calls can arrive through Cilium as host
    # or remote-node identity when VXLAN/kube-proxy-replacement routes the
    # ClusterIP webhook service across nodes. Do not allow the LAN/Tailscale
    # CIDRs here; only trusted cluster node identities may reach the webhook.
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
