# External Secrets Operator — NQLabs Platform
# Chart: external-secrets/external-secrets v2.6.0
#
# Backend: 1Password SDK (onepasswordSDK provider)
# Auth: service account token stored in K8s secret `onepassword-service-account-token`
#       in namespace external-secrets.
#
# Bootstrap (one-time manual step — run before ArgoCD deploys ESO):
#   op item get "Service Account Auth Token: NQ Labs" \
#     --account my.1password.com --fields credential --format json \
#     | python3 -c "import json,sys; sys.stdout.write(json.load(sys.stdin)['value'])" \
#     | kubectl create secret generic onepassword-service-account-token \
#         --from-file=token=/dev/stdin \
#         -n external-secrets
#
# Important: do not use print() here. A trailing newline in the token makes the
# 1Password SDK provider fail with "service account token base64 decoding failed".
#
# After ESO is deployed, all platform secrets are defined as ExternalSecret
# resources in infrastructure/security/external-secrets/secrets/

replicaCount: 1

installCRDs: true

# Prometheus metrics
metrics:
  service:
    enabled: true

serviceMonitor:
  enabled: true
  renderMode: alwaysRender

# Leader election required for safe multi-replica controller HA.
leaderElect: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

# cert-controller — manages TLS certs for ESO webhooks
certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# webhook — validates ExternalSecret/SecretStore resources at admission
webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
