# Tailscale Operator OAuth credentials
# Source: 1Password → NQLabs vault → "tailscale-key" item
#   username  → client_id
#   credential → client_secret
#
# Creates: secret/operator-oauth in namespace tailscale
# Replaces: manual kubectl create secret during bootstrap

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: "op://NQLabs/tailscale-key/username"
    - secretKey: client_secret
      remoteRef:
        key: "op://NQLabs/tailscale-key/credential"
