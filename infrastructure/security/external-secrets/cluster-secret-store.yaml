# ClusterSecretStore — NQLabs 1Password SDK
#
# Uses 1Password service account token (ops_...) to read secrets from
# the NQLabs vault. No Connect server required.
#
# Token secret created during bootstrap:
#   kubectl create secret generic onepassword-service-account-token \
#     -n external-secrets --from-literal=token=<ops_...>
#
# ExternalSecrets reference this store by name: nqlabs-1password

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: nqlabs-1password
spec:
  provider:
    onepasswordSDK:
      vault: NQLabs
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account-token
          namespace: external-secrets
          key: token
