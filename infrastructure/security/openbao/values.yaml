# OpenBao — self-hosted secrets backend + PKI
#
# Chart: openbao/openbao (https://openbao.github.io/openbao-helm)
#
# HA mode with Raft integrated storage on ceph-block.
# Auto-unseal via sidecar (Shamir keys from 1Password → ESO → K8s Secret).
# See docs/runbooks/openbao.md.

# Disable injector and CSI — platform uses ESO, not agent injection.
injector:
  enabled: false

csi:
  enabled: false

# ── Server ──────────────────────────────────────────────────────────────────
server:
  image:
    # quay.io already in Kyverno image allowlist.
    tag: "2.5.2"

  # HA mode: 3 replicas on ceph-block.
  ha:
    enabled: true
    replicas: 3

    # Raft integrated storage.
    raft:
      enabled: true
      # Set node ID to pod name for stable Raft identity.
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          # Unauthenticated metrics for Prometheus scrape.
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        storage "raft" {
          path = "/openbao/data"
          retry_join {
            auto_join = "provider=k8s label_selector=\"app.kubernetes.io/name=openbao,component=server\" namespace=\"openbao\""
            auto_join_scheme = "http"
          }
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

  # Data storage on ceph-block (RWO).
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: ceph-block
    accessMode: ReadWriteOnce

  # Audit storage on ceph-block.
  auditStorage:
    enabled: true
    size: 5Gi
    storageClass: ceph-block
    accessMode: ReadWriteOnce

  # Volume shared between main container and auto-unseal sidecar.
  # Populated by ExternalSecret openbao-unseal-keys (from 1Password).
  volumes:
    - name: unseal-keys
      secret:
        secretName: openbao-unseal-keys

  volumeMounts:
    - name: unseal-keys
      mountPath: /openbao-unseal

  # Auto-unseal sidecar: reads Shamir keys from mounted Secret, unseals
  # OpenBao on startup, monitors and re-unseals if re-sealed.
  # Keys come from 1Password via ESO (nqlabs-1password store) — NOT from
  # OpenBao itself (chicken-and-egg: can't sync from OpenBao when sealed).
  extraContainers:
    - name: auto-unseal
      image: quay.io/openbao/openbao:2.5.2
      env:
        - name: BAO_ADDR
          value: http://127.0.0.1:8200
      volumeMounts:
        - name: unseal-keys
          mountPath: /openbao-unseal
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      command:
        - /bin/sh
        - -ec
        - |
          echo "auto-unseal: waiting for OpenBao API..."
          until bao status 2>/dev/null | grep -q "Seal Type"; do
            sleep 2
          done
          echo "auto-unseal: API responsive."

          # Check if initialized
          INITIALIZED=$(bao status 2>/dev/null | grep "^Initialized" | awk '{print $2}')
          if [ "$INITIALIZED" = "false" ]; then
            echo "auto-unseal: OpenBao not initialized. Waiting for manual init..."
            while true; do sleep 60; done
          fi

          unseal_if_needed() {
            SEALED=$(bao status 2>/dev/null | grep "^Sealed" | awk '{print $2}')
            if [ "$SEALED" = "true" ]; then
              echo "auto-unseal: sealed. Unsealing with 3 of 5 keys..."
              bao operator unseal "$(cat /openbao-unseal/unseal_key_1)" 2>/dev/null
              bao operator unseal "$(cat /openbao-unseal/unseal_key_2)" 2>/dev/null
              bao operator unseal "$(cat /openbao-unseal/unseal_key_3)" 2>/dev/null
              echo "auto-unseal: done."
            fi
          }

          # Initial unseal
          unseal_if_needed

          # Monitor loop — re-unseal if re-sealed
          echo "auto-unseal: monitoring..."
          while true; do
            sleep 30
            unseal_if_needed
          done

  # RollingUpdate: auto-unseal sidecar handles unseal on restart.
  updateStrategyType: RollingUpdate

  # Resource requests for Kyverno require-resource-requests policy.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # authDelegator: grants system:auth-delegator ClusterRoleBinding
  # so OpenBao can verify Kubernetes service account tokens via TokenReview.
  # Enabled by default — required for Kubernetes auth method.
  authDelegator:
    enabled: true

# ── UI ──────────────────────────────────────────────────────────────────────
ui:
  enabled: true
  # ClusterIP behind the platform gateway; not directly exposed.
  serviceType: ClusterIP

# ── Telemetry ───────────────────────────────────────────────────────────────
serverTelemetry:
  serviceMonitor:
    enabled: true
    # Scrape via HTTP (TLS disabled at listener; gateway handles edge TLS).
    scheme: http
    interval: 30s
    scrapeTimeout: 10s

# ── Global ──────────────────────────────────────────────────────────────────
global:
  # TLS disabled at listener; edge TLS is handled by the Cilium Gateway.
  # BackendTLSPolicy (re-encryption) is not supported in Cilium v1.19.
  tlsDisable: true
