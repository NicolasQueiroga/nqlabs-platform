# PKI CA certificate for cert-manager Vault ClusterIssuer.
#
# The bootstrap config Job generates a root CA in OpenBao's PKI engine
# and stores it at kv/openbao-pki/ca. This ExternalSecret materializes
# the CA cert as a Secret in the cert-manager namespace so the
# nqlabs-openbao-pki ClusterIssuer can use it as caBundleSecretRef.
#
# cert-manager needs to trust the OpenBao server's TLS certificate to
# connect via HTTPS. The CA that signs OpenBao's server cert is the
# same CA stored here (after the OpenBao TLS cert is reissued by the
# new PKI issuer). During the initial bootstrap, OpenBao's server cert
# is signed by nqlabs-internal-ca, so cert-manager also needs that CA
# in its trust store — see the caBundleSecretRef note in the
# ClusterIssuer manifest.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-pki-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: openbao-pki-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: openbao-pki/ca
        property: certificate
