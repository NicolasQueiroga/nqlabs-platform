# NetworkPolicies for the openbao namespace.
#
# Default-deny ingress + egress, then allow only the specific flows:
#   - Gateway → openbao-server (8200) — UI/API via platform gateway
#   - external-secrets → openbao-server (8200) — ESO ClusterSecretStore
#   - cert-manager → openbao-server (8200) — PKI issuer (Phase 7)
#   - monitoring → openbao-server (8200) — Prometheus metrics scrape
#   - openbao-server → kube-apiserver (443/6443) — Kubernetes auth TokenReview
#   - DNS egress for all pods
#
# OpenBao pods use app.kubernetes.io/name=openbao, component=server labels.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-default-deny
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
# DNS egress — CiliumNetworkPolicy needed for service-IP DNS traffic.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-allow-dns
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": dns
            "k8s:k8s-app": coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
# Allow Cilium Gateway to reach OpenBao API/UI.
# Gateway traffic classified as "ingress" entity in Cilium.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-allow-gateway
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
# Allow External Secrets Operator to reach OpenBao.
# ESO runs in external-secrets namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-allow-eso
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - protocol: TCP
          port: 8200
---
# Allow cert-manager to reach OpenBao (PKI issuer — Phase 7).
# Included now so the NetworkPolicy is ready when PKI is cut over.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-allow-cert-manager
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
      ports:
        - protocol: TCP
          port: 8200
---
# Allow Prometheus to scrape OpenBao metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-allow-prometheus
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8200
---
# Allow OpenBao egress to kube-apiserver for Kubernetes auth TokenReview.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-egress-apiserver
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# Allow bootstrap Job pod to reach OpenBao server API (8200).
# Bootstrap pod label: app.kubernetes.io/component=bootstrap
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-allow-bootstrap
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              app.kubernetes.io/component: bootstrap
      ports:
        - protocol: TCP
          port: 8200
---
# Allow Authentik embedded outpost to reach OpenBao API (proxy mode).
# The outpost runs in the authentik namespace and proxies requests from
# the gateway to openbao:8200 after SSO authentication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-allow-authentik-outpost
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 8200
---
# Bootstrap pod egress to OpenBao server API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-bootstrap-egress
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/component: bootstrap
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao
            component: server
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# Allow OpenBao server pods to reach the Cilium Gateway (LoadBalancer VIP
# 192.168.15.195:443) for OIDC discovery, JWKS, and token exchange with
# Authentik. Traffic flows: openbao pod → LB VIP → Cilium Envoy (DNAT to
# 127.0.0.1:19128) → authentik-server:80.
#
# Two policies are needed because Cilium's Gateway API uses a cilium.l7policy
# filter on the gateway Envoy that enforces CiliumNetworkPolicy egress rules
# at L7. The K8s NetworkPolicy handles L4 (BPF) enforcement; the
# CiliumNetworkPolicy handles L7 (Envoy) enforcement.
#
# 1. K8s NetworkPolicy: allows L4 egress to the LB IPAM range on port 443.
# 2. CiliumNetworkPolicy: allows L7 egress to cluster entities. The
#    toEntities: [cluster] is required (not [ingress] or [world]) because
#    the DNAT'd destination is a localhost listener. No toPorts restriction
#    is possible because the DNAT changes the port from 443 to the Envoy's
#    dynamic listener port (19128).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-egress-gateway
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.15.0/24
      ports:
        - protocol: TCP
          port: 443
---
# CiliumNetworkPolicy: L7 enforcement for gateway traffic.
# See comment above for why toEntities: [cluster] without toPorts is required.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-egress-authentik-oidc
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  egress:
    - toEntities:
        - cluster
---
# Allow OpenBao pods to reach each other on Raft cluster port (8201).
# Required for Raft leader election and peer communication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-allow-raft-peers
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              component: server
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
