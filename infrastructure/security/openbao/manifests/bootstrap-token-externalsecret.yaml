# Bootstrap token for OpenBao configuration.
#
# Source: 1Password → NQLabs vault → "openbao-bootstrap" item → credential
# Creates: secret/openbao-bootstrap-token in namespace openbao
#
# This ExternalSecret uses the existing nqlabs-1password ClusterSecretStore
# to materialize the OpenBao root token during initial bootstrap.
#
# The root token is used by the bootstrap config Job to:
#   - enable kv-v2 mount
#   - enable kubernetes auth
#   - create policies and roles
#   - enable audit
#
# After bootstrap is complete, the root token should be revoked and
# replaced with scoped tokens. This ExternalSecret should be removed
# (or the 1Password item rotated) after the bootstrap phase.
#
# 1Password item to create:
#   Item name: openbao-bootstrap
#   Field:     credential
#   Value:     <OpenBao root token from `bao operator init`>
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-bootstrap-token
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: openbao-bootstrap-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: openbao-bootstrap/credential
