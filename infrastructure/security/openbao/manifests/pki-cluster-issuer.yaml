# cert-manager ClusterIssuer — OpenBao PKI backend.
#
# Replaces nqlabs-internal-ca (self-signed CA) for internal certificates.
# Uses OpenBao's PKI secrets engine to sign certificates.
#
# Auth: Kubernetes auth (cert-manager's service account → OpenBao role)
# Path: pki/sign/cert-manager (OpenBao PKI role)
# CA:   nqlabs-internal-ca-tls secret (cert-manager-managed, holds the CA that
#       signed OpenBao's server TLS cert during bootstrap)
#
# caBundleSecretRef must trust the CA that signed OpenBao's *server TLS cert*,
# not the OpenBao PKI engine root CA. OpenBao's server cert is issued by
# nqlabs-internal-ca (via the nqlabs-internal-ca ClusterIssuer), so we point
# here to nqlabs-internal-ca-tls (cert-manager manages this secret directly).
#
# The openbao-pki-ca ExternalSecret pulls kv/openbao-pki/ca (the PKI engine
# root) — correct for client cert trust AFTER migration, but wrong for server
# TLS verification during bootstrap.
#
# Migration steps (manual, after bootstrap):
#   1. Verify nqlabs-openbao-pki issuer is Ready (this file)
#   2. Update openbao-server-tls Certificate issuerRef to nqlabs-openbao-pki
#   3. Wait for cert renewal — OpenBao TLS now signed by PKI engine
#   4. Update caBundleSecretRef below to openbao-pki-ca
#   5. Remove selfsigned-bootstrap + nqlabs-internal-ca issuers
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nqlabs-openbao-pki
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  vault:
    server: "https://openbao.openbao.svc.cluster.local:8200"
    path: pki/sign/cert-manager
    caBundleSecretRef:
      name: nqlabs-internal-ca-tls
      key: ca.crt
    auth:
      kubernetes:
        mountPath: v1/auth/kubernetes-management
        role: cert-manager
        serviceAccountRef:
          name: cert-manager
