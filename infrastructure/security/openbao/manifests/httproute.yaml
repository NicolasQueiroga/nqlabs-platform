# HTTPRoute for OpenBao UI/API via the platform gateway.
#
# Hostname: openbao.platform.nqlabs.network
# TLS terminated at the gateway (Let's Encrypt wildcard).
# Backend: openbao service on port 8200 (HTTPS).
#
# The gateway-access label on the openbao namespace is applied via
# platform-gateway.yaml (ServerSideApply) and managedNamespaceMetadata.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - openbao.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openbao
          port: 8200
