# Canary ExternalSecret — validates nqlabs-openbao ClusterSecretStore.
#
# Before migrating real secrets, this canary confirms:
#   1. ESO can authenticate to OpenBao via Kubernetes auth
#   2. ESO can read from the kv/ mount
#   3. The target Secret is created in the openbao namespace
#
# Operator must seed the canary secret into OpenBao after bootstrap:
#   bao kv put kv/canary/openbao-eso value="hello-from-openbao"
#
# After the canary is verified, remove this manifest and the canary
# secret from OpenBao.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-canary
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: openbao-canary
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef:
        key: canary/openbao-eso
        property: value
