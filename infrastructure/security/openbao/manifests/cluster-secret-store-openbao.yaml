# ClusterSecretStore — OpenBao (Vault-compatible) backend
#
# Replaces nqlabs-1password as the operational secrets backend.
# Uses Kubernetes auth: ESO's service account token is validated by
# OpenBao via TokenReview against the management cluster API.
#
# OpenBao mount path: kubernetes-management (set by bootstrap config Job)
# ESO role: eso (bound to external-secrets SA in external-secrets namespace)
# KV path: kv (kv-v2 engine)
#
# ExternalSecrets reference this store by name: nqlabs-openbao
#
# During migration, both nqlabs-1password and nqlabs-openbao exist.
# After migration is complete, nqlabs-1password is removed.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: nqlabs-openbao
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  provider:
    vault:
      # HTTP — TLS disabled at listener; edge TLS handled by Cilium Gateway.
      # BackendTLSPolicy not supported in Cilium v1.19.
      server: "http://openbao.openbao.svc:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes-management"
          role: "eso"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
