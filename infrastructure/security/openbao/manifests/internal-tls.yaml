# Internal TLS certificate for OpenBao API listener.
#
# Initially issued by nqlabs-internal-ca (cert-manager self-signed CA) for
# bootstrap. After OpenBao PKI is configured and the nqlabs-openbao-pki
# ClusterIssuer is verified Ready, update issuerRef below to
# nqlabs-openbao-pki and let cert-manager reissue from OpenBao's own PKI.
#
# Covers:
#   - openbao.openbao.svc               — in-cluster clients (ESO, cert-manager)
#   - openbao.openbao.svc.cluster.local  — FQDN for internal resolution
#   - *.openbao.openbao.svc.cluster.local — StatefulSet pod DNS (Raft peer join)
#   - *.openbao-internal                 — headless service pod DNS (Raft auto-join)
#   - *.openbao-internal.openbao.svc.cluster.local — headless service FQDN
#   - openbao.platform.nqlabs.network    — gateway/external clients
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-server-tls
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: openbao-server-tls
  duration: 2160h
  renewBefore: 360h
  commonName: openbao.openbao.svc
  dnsNames:
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - "*.openbao.openbao.svc.cluster.local"
    - "*.openbao-internal"
    - "*.openbao-internal.openbao.svc.cluster.local"
    - openbao.platform.nqlabs.network
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: nqlabs-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
