# ExternalSecret — OpenBao unseal keys
#
# Syncs Shamir unseal keys from 1Password to a K8s Secret in the openbao
# namespace. The auto-unseal sidecar reads these keys and unseals OpenBao
# on pod startup.
#
# Uses nqlabs-1password store (NOT nqlabs-openbao) — chicken-and-egg:
# ESO can't sync from OpenBao when OpenBao is sealed.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-unseal-keys
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: openbao-unseal-keys
    template:
      type: Opaque
  data:
    - secretKey: unseal_key_1
      remoteRef:
        key: "openbao-bootstrap/unseal_key_1"
    - secretKey: unseal_key_2
      remoteRef:
        key: "openbao-bootstrap/unseal_key_2"
    - secretKey: unseal_key_3
      remoteRef:
        key: "openbao-bootstrap/unseal_key_3"
    - secretKey: unseal_key_4
      remoteRef:
        key: "openbao-bootstrap/unseal_key_4"
    - secretKey: unseal_key_5
      remoteRef:
        key: "openbao-bootstrap/unseal_key_5"
