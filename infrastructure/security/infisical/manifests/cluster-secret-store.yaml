# ClusterSecretStore — ESO provider for Infisical.
#
# Uses Kubernetes Auth: the ESO service account's JWT is sent to Infisical,
# which validates it via the Kubernetes TokenReview API and returns an
# access token for the bound Machine Identity.
#
# PREREQUISITE (manual, in Infisical UI):
#   1. Create a project (e.g., "nqlabs")
#   2. Create an environment (e.g., "platform")
#   3. Create a Machine Identity with Kubernetes Auth:
#      - Allowed Service Account Names: external-secrets
#      - Allowed Namespaces: external-secrets
#      - Kubernetes Host: https://kubernetes.default.svc
#   4. Bind the Machine Identity to the project + environment
#   5. Store the identityId in the infisical-machine-identity Secret
#
# The identityId is stored as a Kubernetes Secret (not in Infisical itself,
# to avoid a circular dependency). It's a non-sensitive identifier.
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: nqlabs-infisical
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  provider:
    infisical:
      hostAPI: http://infisical.infisical.svc.cluster.local:8080
      auth:
        kubernetesAuthCredentials:
          identityId:
            name: infisical-machine-identity
            key: identityId
      secretsScope:
        projectSlug: nqlabs
        environmentSlug: platform
        secretsPath: /
        recursive: true
---
# Secret containing the Infisical Machine Identity ID.
# This is a non-sensitive identifier (not a secret value) — it tells ESO
# which Machine Identity to authenticate as. The actual auth is done via
# the ESO service account's Kubernetes JWT token.
#
# Populate this after creating the Machine Identity in the Infisical UI.
apiVersion: v1
kind: Secret
metadata:
  name: infisical-machine-identity
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
stringData:
  identityId: REPLACE_AFTER_INFISICAL_SETUP
