# PostgreSQL for Infisical, managed by CloudNativePG.
#
# Single instance for Phase 0 (single-node management cluster). Scale
# .spec.instances to 3 for HA once NUC nodes are added.
#
# Password is bootstrapped from OpenBao (infisical-postgres/password) via ESO
# into the infisical-pg-app Secret. Once Infisical is running, this ExternalSecret
# can be repointed to Infisical itself.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: infisical-pg
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6

  bootstrap:
    initdb:
      database: infisical
      owner: infisical
      secret:
        name: infisical-pg-app

  storage:
    storageClass: local-path
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  monitoring:
    enablePodMonitor: true

  affinity:
    podAntiAffinityType: preferred
