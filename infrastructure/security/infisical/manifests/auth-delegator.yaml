# ClusterRoleBinding for Infisical Kubernetes Auth.
#
# Infisical's Kubernetes Auth method validates service account JWTs via the
# Kubernetes TokenReview API. This requires the system:auth-delegator
# ClusterRole, which allows delegating authentication decisions.
#
# The Infisical Helm chart creates a service account, but we need to bind
# the auth-delegator role to it so Infisical can call TokenReview.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infisical-auth-delegator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: infisical
    namespace: infisical
