# Valkey (BSD Redis fork) for Infisical — cache + queue.
#
# Single instance for Phase 0. Password from OpenBao via ESO (bootstrapped).
# PVC on local-path. Runs non-root (uid 999).
---
apiVersion: v1
kind: Service
metadata:
  name: infisical-valkey
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: infisical
spec:
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: infisical
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: infisical-valkey
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: infisical
spec:
  replicas: 1
  serviceName: infisical-valkey
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/part-of: infisical
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: infisical
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: ghcr.io/valkey-io/valkey:8.0-alpine
          imagePullPolicy: IfNotPresent
          command:
            - valkey-server
            - --requirepass
            - $(VALKEY_PASSWORD)
            - --save
            - "60"
            - "1"
            - --appendonly
            - "yes"
            - --dir
            - /data
            - --maxmemory-policy
            - noeviction
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infisical-valkey-auth
                  key: password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: infisical-valkey-auth
                  key: password
            - name: VALKEYCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: infisical-valkey-auth
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        volumeMode: Filesystem
        resources:
          requests:
            storage: 1Gi
