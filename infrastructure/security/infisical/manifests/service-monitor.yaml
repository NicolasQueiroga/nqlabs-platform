# ServiceMonitor for Infisical metrics.
# Infisical exposes Prometheus metrics at /metrics on port 8080.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: infisical
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: infisical
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
