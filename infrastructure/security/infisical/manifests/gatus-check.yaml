# Gatus endpoint for Infisical health check.
# The Gatus deployment watches for ConfigMaps with label gatus.io/enabled: "true".
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: infisical-gatus
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/part-of: nqlabs-platform
    gatus.io/enabled: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  endpoint.yaml: |
    endpoints:
      - name: Infisical
        group: Security
        url: http://infisical.infisical.svc.cluster.local:8080/api/status
        interval: 1m
        conditions:
          - "[STATUS] == 200"
