# NetworkPolicies for the infisical namespace.
#
# Default-deny ingress + egress, then allow only the specific flows:
#   - Gateway → infisical (8080) — UI/API via platform gateway
#   - external-secrets → infisical (8080) — ESO ClusterSecretStore
#   - monitoring → infisical (8080) — Prometheus metrics scrape
#   - infisical → kube-apiserver (443/6443) — Kubernetes auth TokenReview
#   - infisical → infisical-pg (5432) — PostgreSQL
#   - infisical → infisical-valkey (6379) — Redis
#   - DNS egress for all pods
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infisical-default-deny
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
# DNS egress — CiliumNetworkPolicy for service-IP DNS traffic.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: infisical-allow-dns
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": dns
            "k8s:k8s-app": coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
# Allow Cilium Gateway to reach Infisical.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: infisical-allow-gateway
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: infisical
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# Allow External Secrets Operator to reach Infisical.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infisical-allow-eso
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: infisical
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - port: 8080
          protocol: TCP
---
# Allow Prometheus to scrape Infisical metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infisical-allow-prometheus
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: infisical
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
---
# Allow Infisical to reach kube-apiserver for Kubernetes auth TokenReview.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: infisical-egress-apiserver
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: infisical
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# Allow Infisical to reach its PostgreSQL cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infisical-egress-postgres
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: infisical
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: infisical-pg
      ports:
        - port: 5432
          protocol: TCP
---
# Allow Infisical to reach its Valkey instance.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infisical-egress-valkey
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: infisical
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
              app.kubernetes.io/part-of: infisical
      ports:
        - port: 6379
          protocol: TCP
