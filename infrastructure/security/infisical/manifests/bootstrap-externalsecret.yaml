# Bootstrap secrets for Infisical.
#
# Sourced from 1Password (NQLabs vault) via nqlabs-1password ClusterSecretStore.
# Secrets were generated fresh and stored in 1Password after OpenBao removal.
#
# Required env vars for Infisical:
#   ENCRYPTION_KEY  — root encryption key
#   AUTH_SECRET     — JWT signing key
#   DB_CONNECTION_URI  — postgres://infisical:<pass>@infisical-pg-rw.infisical.svc:5432/infisical
#   REDIS_URL       — redis://:<pass>@infisical-valkey.infisical.svc:6379
#   SITE_URL        — https://infisical.platform.nqlabs.network
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-secrets
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: infisical-secrets
    type: Opaque
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: infisical-bootstrap
        property: encryption_key
    - secretKey: AUTH_SECRET
      remoteRef:
        key: infisical-bootstrap
        property: auth_secret
    - secretKey: DB_CONNECTION_URI
      remoteRef:
        key: infisical-bootstrap
        property: db_connection_uri
    - secretKey: REDIS_URL
      remoteRef:
        key: infisical-bootstrap
        property: redis_url
    - secretKey: SITE_URL
      remoteRef:
        key: infisical-bootstrap
        property: site_url
---
# PostgreSQL basic-auth secret for CNPG bootstrap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-pg-app
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: infisical-pg-app
    type: kubernetes.io/basic-auth
    template:
      metadata:
        annotations:
          cnpg.io/username: infisical
  data:
    - secretKey: password
      remoteRef:
        key: infisical-postgres
        property: password
    - secretKey: username
      remoteRef:
        key: infisical-postgres
        property: username
---
# Valkey auth secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-valkey-auth
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: infisical-valkey-auth
    type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: infisical-valkey
        property: password
