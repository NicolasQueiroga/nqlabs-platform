# Bootstrap secrets for Infisical.
#
# Sourced from 1Password (NQLabs vault) via nqlabs-1password ClusterSecretStore.
# Secrets were generated fresh and stored in 1Password after OpenBao removal.
#
# Required env vars for Infisical:
#   ENCRYPTION_KEY  — root encryption key
#   AUTH_SECRET     — JWT signing key
#   DB_CONNECTION_URI  — postgres://infisical:<pass>@infisical-pg-rw.infisical.svc:5432/infisical
#   REDIS_URL       — redis://:<pass>@infisical-valkey.infisical.svc:6379
#   SITE_URL        — https://infisical.platform.nqlabs.network
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-secrets
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: infisical-secrets
    template:
      data:
        # ENCRYPTION_KEY is stored as base64 in 1Password but Infisical's
        # crypto code (AES-256-GCM) needs raw 32 bytes. ESO's b64dec filter
        # decodes the base64-encoded value before writing the secret.
        ENCRYPTION_KEY: "{{ .ENCRYPTION_KEY | b64dec }}"
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        DB_CONNECTION_URI: "{{ .DB_CONNECTION_URI }}"
        REDIS_URL: "{{ .REDIS_URL }}"
        SITE_URL: "{{ .SITE_URL }}"
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: "infisical-bootstrap/encryption_key"
    - secretKey: AUTH_SECRET
      remoteRef:
        key: "infisical-bootstrap/auth_secret"
    - secretKey: DB_CONNECTION_URI
      remoteRef:
        key: "infisical-bootstrap/db_connection_uri"
    - secretKey: REDIS_URL
      remoteRef:
        key: "infisical-bootstrap/redis_url"
    - secretKey: SITE_URL
      remoteRef:
        key: "infisical-bootstrap/site_url"
---
# PostgreSQL basic-auth secret for CNPG bootstrap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-pg-app
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: infisical-pg-app
    template:
      type: kubernetes.io/basic-auth
      metadata:
        annotations:
          cnpg.io/username: infisical
  data:
    - secretKey: password
      remoteRef:
        key: "infisical-postgres/password"
    - secretKey: username
      remoteRef:
        key: "infisical-postgres/username"
---
# Valkey auth secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infisical-valkey-auth
  namespace: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: infisical-valkey-auth
  data:
    - secretKey: password
      remoteRef:
        key: "infisical-valkey/password"
