# NetworkPolicies for cert-manager.
#
# Keep ingress narrow without blocking Kubernetes API server admission calls to
# cert-manager-webhook. API-server admission traffic is allowed by a
# CiliumNetworkPolicy below using Cilium node identities instead of broad LAN
# CIDRs, matching the same pattern used for external-secrets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-deny-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9402
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-allow-kube-apiserver-webhook
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/name: webhook
  ingress:
    # Talos kube-apiserver admission calls can arrive through Cilium as host
    # or remote-node identity when VXLAN/kube-proxy-replacement routes the
    # ClusterIP webhook service across nodes. Do not allow the LAN/Tailscale
    # CIDRs here; only trusted cluster node identities may reach the webhook.
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP

