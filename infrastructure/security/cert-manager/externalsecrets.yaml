# cert-manager ExternalSecrets — NQLabs Platform
#
# Cloudflare API token for Let's Encrypt DNS-01 solver.
# Source: 1Password → NQLabs vault → cloudflare-dns-token → credential
# Creates: secret/cloudflare-api-token in cert-manager namespace
#
# Token permissions required:
#   Zone / DNS / Edit   — create/delete ACME TXT records
#   Zone / Zone / Read  — list zones

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nqlabs-1password
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-dns-token/credential
