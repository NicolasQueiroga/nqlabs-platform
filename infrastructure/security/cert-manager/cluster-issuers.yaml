# ClusterIssuers — NQLabs Platform
#
# Three issuers:
#   1. nqlabs-internal-ca  — self-signed fallback CA for bootstrap/internal use
#   2. letsencrypt-prod    — Let's Encrypt via Cloudflare DNS-01 for *.nqlabs.network
#   3. nqlabs-openbao-pki  — OpenBao PKI engine (defined in openbao/manifests/)
#
# After OpenBao PKI migration is complete, nqlabs-internal-ca and
# selfsigned-bootstrap are retired. nqlabs-openbao-pki becomes the
# internal CA for all private certs.

# Step 1: Bootstrap a self-signed issuer (issues the CA cert itself)
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}

# Step 2: CA certificate — fallback private root of trust
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nqlabs-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: NQLabs Internal CA
  subject:
    organizations:
      - NQLabs
  secretName: nqlabs-internal-ca-tls
  duration: 87600h    # 10 years
  renewBefore: 720h   # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io

# Step 3: CA issuer — issues certs signed by the internal CA
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nqlabs-internal-ca
spec:
  ca:
    secretName: nqlabs-internal-ca-tls

# Step 4: Let's Encrypt issuer — DNS-01 via Cloudflare (*.nqlabs.network)
# Requires Secret/cloudflare-api-token in cert-manager namespace.
# The secret is produced by infrastructure/security/cert-manager/externalsecrets.yaml
# from 1Password item `cloudflare-dns-token`.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: nicolasqueiroga@me.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - selector:
          dnsZones:
            - nqlabs.network
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
