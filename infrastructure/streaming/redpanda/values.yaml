# Redpanda Helm values for the NQLabs platform.
#
# Single-broker deployment for the home lab (management cluster).
# Scale to 3 brokers for HA once NUC nodes are added.
#
# TLS is disabled for internal communication (the platform uses
# CiliumNetworkPolicies for isolation). SASL is enabled for auth.

statefulset:
  replicas: 1

# Resources live at the top level, not under statefulset.
resources:
  cpu:
    cores: 250m
    overprovisioned: true
  memory:
    # Redpanda allocates floor(container.min * 0.8) for its engine + 201Mi reserve.
    # Container check: floor(0.8*min) + 201 <= min  →  min >= 1005Mi ✓
    # Redpanda process check: floor(0.8*min) >= 1024Mi (Redpanda 1GiB minimum)
    #   → min >= 1024 / 0.8 = 1280Mi. Use 2Gi for headroom.
    # At min=2Gi=2048Mi: floor(0.8*2048)=1638Mi for Redpanda > 1024 ✓
    container:
      min: 2Gi
      max: 4Gi

storage:
  persistentVolume:
    enabled: true
    storageClass: ceph-block
    size: 20Gi

# Disable TLS for internal listeners (platform uses CiliumNetworkPolicy).
# The external listener uses the platform gateway's TLS.
tls:
  enabled: false

# SASL authentication: disabled until 1Password-backed ExternalSecret for
# redpanda-sasl is created. The management cluster is network-isolated via
# CiliumNetworkPolicy. TODO: re-enable once the ExternalSecret exists.
auth:
  sasl:
    enabled: false

# Disable external access (accessed via in-cluster service).
external:
  enabled: false

# Redpanda Console (admin UI).
# Note: console.podTemplate is not a valid schema key in this chart version.
# Seccomp and resource exemptions for the console are handled via the
# Kyverno PolicyException in manifests/kyverno-exception.yaml.
console:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  # The chart's default liveness probe has initialDelaySeconds=0 which kills
  # the console before it finishes initialising. Give it breathing room.
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 5

# Cluster-level config properties live under config.cluster.
config:
  cluster:
    auto_create_topics_enabled: true
    default_topic_replications: 1
