# Kyverno PolicyException for Redpanda.
#
# Redpanda is a performance-sensitive distributed broker that uses a
# thread-per-core model. Its Helm chart (v26.x) does not expose seccompProfile,
# runAsNonRoot, or init-container resource requests through its values schema.
#
# This exception covers:
#   - require-seccomp: Redpanda pods do not support seccompProfile via values.
#   - require-run-as-nonroot: Redpanda runs as root (needs privileged PSA).
#   - require-resource-requests: Init containers (configurator, rpk, etc.)
#     do not have configurable resource requests in the chart.
#
# The restrict-image-registries policy is resolved globally by adding
# docker.redpanda.com/* to the allowed-registries ClusterPolicy.
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: redpanda-require-seccomp
  namespace: redpanda
spec:
  exceptions:
    - policyName: require-seccomp
      ruleNames:
        - require-seccomp
        - autogen-require-seccomp
  match:
    any:
      - resources:
          kinds:
            - StatefulSet
            - Deployment
            - Pod
            - Job
          namespaces:
            - redpanda
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: redpanda-require-run-as-nonroot
  namespace: redpanda
spec:
  exceptions:
    - policyName: require-run-as-nonroot
      ruleNames:
        - run-as-non-root
        - autogen-run-as-non-root
  match:
    any:
      - resources:
          kinds:
            - StatefulSet
            - Deployment
            - Pod
            - Job
          namespaces:
            - redpanda
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: redpanda-require-resource-requests
  namespace: redpanda
spec:
  exceptions:
    - policyName: require-resource-requests
      ruleNames:
        - require-resource-requests
        - autogen-require-requests
  match:
    any:
      - resources:
          kinds:
            - StatefulSet
            - Deployment
            - Pod
            - Job
          namespaces:
            - redpanda
