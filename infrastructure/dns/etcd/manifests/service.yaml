# etcd Service — exposes client port to CoreDNS and external-dns
# ClusterIP is pinned so CoreDNS can reference it by IP (avoids bootstrap
# DNS loop on Talos where hostDNS can't resolve cluster.local at startup).
# If recreating, update the endpoint in coredns-values.yaml etcd plugin.
apiVersion: v1
kind: Service
metadata:
  name: etcd-dns
  namespace: dns
  labels:
    app: etcd-dns
spec:
  type: ClusterIP
  clusterIP: 10.97.76.140
  selector:
    app: etcd-dns
  ports:
    - name: client
      port: 2379
      targetPort: 2379
