# etcd Service — exposes client port to CoreDNS and external-dns
# ClusterIP is pinned to 10.105.253.211 so CoreDNS can reference it by IP
# (avoids bootstrap DNS loop). If recreating, update the endpoint in
# coredns/values.yaml etcd plugin configBlock.
apiVersion: v1
kind: Service
metadata:
  name: etcd-dns
  namespace: dns
  labels:
    app: etcd-dns
spec:
  type: ClusterIP
  clusterIP: 10.105.253.211
  selector:
    app: etcd-dns
  ports:
    - name: client
      port: 2379
      targetPort: 2379
