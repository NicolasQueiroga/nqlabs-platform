# etcd StatefulSet — DNS record backend for standalone CoreDNS
# Image: quay.io/coreos/etcd (official, multi-arch)
# Single node — DNS backend only, not control-plane etcd.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd-dns
  namespace: dns
  labels:
    app: etcd-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcd-dns
  serviceName: etcd-dns
  podManagementPolicy: OrderedReady
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  template:
    metadata:
      labels:
        app: etcd-dns
    spec:
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
      # Anti-affinity: when scaling to 3 nodes, spread across nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: etcd-dns
                topologyKey: kubernetes.io/hostname
      # Talos + subPath bind mounts block writes for non-root UIDs at the kernel level
      # even with correct fsGroup/ownership. Same issue as Prometheus on this setup.
      # dns namespace is enforced as 'privileged' — running as root is intentional.
      # seccompProfile: RuntimeDefault is NOT used here because etcd's Go binary uses
      # openat2 (introduced Linux 5.6), which the RuntimeDefault allowlist excludes,
      # causing "open /var/etcd/data: permission denied" on every restart after init.
      # Unconfined is safe in the privileged dns namespace (etcd is internal only).
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        seccompProfile:
          type: Unconfined
      terminationGracePeriodSeconds: 30
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.21
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          command:
            - etcd
          args:
            - --data-dir=/var/etcd/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd-dns.dns.svc.cluster.local:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://etcd-dns.dns.svc.cluster.local:2380
            - --initial-cluster=default=http://etcd-dns.dns.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=nqlabs-dns-etcd
          ports:
            - containerPort: 2379
              name: client
              protocol: TCP
            - containerPort: 2380
              name: peer
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/etcd
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 2379
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 2379
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        volumeMode: Filesystem
        resources:
          requests:
            storage: 1Gi
