# Restrict the CoreDNS LB to tailnet + LAN only.
# The CoreDNS Helm chart does not template loadBalancerSourceRanges, so we
# apply it as a partial SSA manifest that merges onto the Helm-created Service.
# Requires Cilium bpf.lbSourceRangeAllTypes: true (already set).
apiVersion: v1
kind: Service
metadata:
  name: coredns-dns
  namespace: dns
spec:
  loadBalancerSourceRanges:
    - "100.64.0.0/10"     # Tailscale CGNAT range
    - "192.168.15.0/24"   # LAN (subnet router SNATs to LAN IPs)
