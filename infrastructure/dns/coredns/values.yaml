# Standalone CoreDNS Helm values — authoritative for nqlabs.network
# Chart: coredns/coredns
#
# Separate from Kubernetes' own CoreDNS (kube-dns).
# This instance is the authoritative nameserver for nqlabs.network.
# Records written by external-dns via etcd (SkyDNS protocol).
# Exposed via Tailscale → used as Tailscale split DNS target.

replicaCount: 2

service:
  name: coredns-dns
  # Gets IP from Cilium LB IPAM pool (192.168.15.192/28)
  type: LoadBalancer
  port: 53
  targetPort: 53
  annotations: {}

serviceType: LoadBalancer

# Fully-qualified image reference (Kyverno restrict-image-registries)
image:
  repository: docker.io/coredns/coredns
  tag: 1.13.1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Liveness probe — CoreDNS health endpoint
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe — CoreDNS ready endpoint
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

# CoreDNS Corefile — authoritative for nqlabs.network via etcd
servers:
  - zones:
      - zone: .
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      # Tailscale-only enforcement:
      #   proxmox.platform  → 100.105.35.84  (Proxmox Tailscale IP, direct)
      #   *.platform        → 100.105.35.84 (Proxmox tailscale0 HAProxy passthrough)
      #   *.staging         → 100.105.35.84
      #   *.production      → 100.105.35.84
      #
      # Two template plugins: proxmox-specific FIRST so it wins before the wildcard.
      # The hosts plugin was tried but the template zone (platform.nqlabs.network)
      # takes priority over the general-zone hosts plugin in CoreDNS evaluation order.
      - name: template
        parameters: IN A nqlabs.network
        configBlock: |-
          match ^proxmox\.platform\.nqlabs\.network\.$
          answer "{{ .Name }} 60 IN A 100.105.35.84"
          fallthrough
      - name: template
        parameters: IN A platform.nqlabs.network
        configBlock: |-
          match ^[a-z0-9-]+\.platform\.nqlabs\.network\.$
          answer "{{ .Name }} 60 IN A 100.105.35.84"
      - name: template
        parameters: IN A staging.nqlabs.network
        configBlock: |-
          match ^[a-z0-9-]+\.staging\.nqlabs\.network\.$
          answer "{{ .Name }} 60 IN A 100.105.35.84"
      - name: template
        parameters: IN A production.nqlabs.network
        configBlock: |-
          match ^[a-z0-9-]+\.production\.nqlabs\.network\.$
          answer "{{ .Name }} 60 IN A 100.105.35.84"
      # Authoritative zone for nqlabs.network — reads from etcd (SkyDNS format).
      # NOTE: endpoint uses ClusterIP instead of hostname to avoid a Talos hostDNS
      # bootstrap loop: the platform CoreDNS pod itself cannot resolve cluster.local
      # hostnames via 169.254.116.108 at startup time because the host DNS cache is
      # not yet ready when CoreDNS first initialises. Using the ClusterIP breaks
      # that dependency. Update this if the etcd-dns Service is ever recreated.
      # etcd-dns ClusterIP: 10.105.253.211
      - name: etcd
        parameters: nqlabs.network
        configBlock: |-
          stubzones
          path /skydns
          endpoint http://10.105.253.211:2379
      # Forward everything else to upstream resolvers
      - name: forward
        parameters: . 1.1.1.1 8.8.8.8
      - name: cache
        parameters: "30"
      - name: loop
      - name: reload
      - name: loadbalance
