# Standalone CoreDNS Helm values — authoritative for nqlabs.network
# Chart: coredns/coredns
#
# Separate from Kubernetes' own CoreDNS (kube-dns).
# This instance is the authoritative nameserver for nqlabs.network.
# Records written by external-dns via etcd (SkyDNS protocol).
# Exposed via Tailscale → used as Tailscale split DNS target.

replicaCount: 1

service:
  name: coredns-dns
  # Gets IP from Cilium LB IPAM pool (192.168.64.200/28)
  type: LoadBalancer
  port: 53
  targetPort: 53
  annotations: {}

serviceType: LoadBalancer

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# CoreDNS Corefile — authoritative for nqlabs.network via etcd
servers:
  - zones:
      - zone: .
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      # Static records for infrastructure hosts not managed by external-dns.
      # proxmox.platform.nqlabs.network → Proxmox host Tailscale IP (permanent management address).
      # Must be evaluated BEFORE the template rules below so proxmox gets its own IP.
      - name: hosts
        configBlock: |-
          100.105.35.84 proxmox.platform.nqlabs.network
          fallthrough
      # Tailscale-only enforcement — return the Tailscale platform-gateway IP for all
      # platform/staging/production subdomains so clients ALWAYS connect via Tailscale
      # regardless of whether they are on the LAN.  proxmox.platform is already handled
      # above and will NOT fall through to these templates.
      # platform-gateway Tailscale IP: 100.123.152.13
      - name: template
        parameters: IN A platform.nqlabs.network
        configBlock: |-
          match ^[a-z0-9-]+\.platform\.nqlabs\.network\.$
          answer "{{ .Name }} 60 IN A 100.123.152.13"
      - name: template
        parameters: IN A staging.nqlabs.network
        configBlock: |-
          match ^[a-z0-9-]+\.staging\.nqlabs\.network\.$
          answer "{{ .Name }} 60 IN A 100.123.152.13"
      - name: template
        parameters: IN A production.nqlabs.network
        configBlock: |-
          match ^[a-z0-9-]+\.production\.nqlabs\.network\.$
          answer "{{ .Name }} 60 IN A 100.123.152.13"
      # Authoritative zone for nqlabs.network — reads from etcd (SkyDNS format).
      # NOTE: endpoint uses ClusterIP instead of hostname to avoid a Talos hostDNS
      # bootstrap loop: the platform CoreDNS pod itself cannot resolve cluster.local
      # hostnames via 169.254.116.108 at startup time because the host DNS cache is
      # not yet ready when CoreDNS first initialises. Using the ClusterIP breaks
      # that dependency. Update this if the etcd-dns Service is ever recreated.
      # etcd-dns ClusterIP: 10.105.253.211
      - name: etcd
        parameters: nqlabs.network
        configBlock: |-
          stubzones
          path /skydns
          endpoint http://10.105.253.211:2379
      # Forward everything else to upstream resolvers
      - name: forward
        parameters: . 1.1.1.1 8.8.8.8
      - name: cache
        parameters: "30"
      - name: loop
      - name: reload
      - name: loadbalance
