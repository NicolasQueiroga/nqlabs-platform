# PodDisruptionBudget for CoreDNS — ensures at least 1 replica stays
# available during node drains or voluntary disruptions.
# CoreDNS Helm chart labels pods with app.kubernetes.io/name: coredns
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns-dns
  namespace: dns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coredns
