# External-DNS UI HTTPRoute — exposed via Authentik proxy.
#
# Hostname: dns.platform.nqlabs.network
# Backend: authentik-server:80 (Authentik embedded outpost proxies to external-dns:7979)
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-dns
  namespace: dns
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    external-dns.alpha.kubernetes.io/hostname: dns.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - dns.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
      timeouts:
        request: 300s
        backendRequest: 300s
