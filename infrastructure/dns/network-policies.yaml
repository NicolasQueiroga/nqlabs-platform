# NetworkPolicies for the DNS namespace.
#
# Deny all ingress by default, then allow:
#   - CoreDNS: port 53 (UDP + TCP) from all namespaces (DNS resolution)
#   - etcd: port 2379 from CoreDNS + external-dns only
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-deny-ingress
  namespace: dns
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: []
---
# Allow DNS queries to CoreDNS (port 53 UDP + TCP from anywhere in cluster)
# CoreDNS Helm chart labels pods with app.kubernetes.io/name: coredns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-allow-coredns
  namespace: dns
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: coredns
  ingress:
    - toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow etcd client access from CoreDNS and external-dns (port 2379)
# Both run in the dns namespace, so podSelector (without namespaceSelector)
# matches pods in the same namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-allow-etcd-client
  namespace: dns
spec:
  endpointSelector:
    matchLabels:
      app: etcd-dns
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: coredns
        - matchLabels:
            app.kubernetes.io/name: external-dns
      toPorts:
        - ports:
            - port: "2379"
              protocol: TCP
---
# Allow Prometheus in monitoring namespace to scrape dns namespace metrics.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-allow-monitoring-metrics
  namespace: dns
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - coredns
          - external-dns
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
            - port: "7979"
              protocol: TCP
