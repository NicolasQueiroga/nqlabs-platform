# Ironic API credentials — shared between Ironic and BMO.
#
# IrSO uses this secret to configure Ironic's basic auth.
# BMO references the same credentials in its ConfigMap to authenticate
# against the Ironic API.
#
# The htpasswd field is used by Ironic's auth middleware.
# The username/password fields are used by BMO.
#
# To rotate credentials:
#   1. Generate new htpasswd: htpasswd -nbB ironic <new-password>
#   2. Update this file with new base64-encoded values
#   3. Update infrastructure/metal3/bmo/baremetal-operator.yaml ConfigMap
#   4. Commit and push

---
apiVersion: v1
kind: Secret
metadata:
  name: ironic-api-credentials
  namespace: metal3
type: kubernetes.io/basic-auth
