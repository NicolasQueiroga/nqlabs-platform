# Ironic API credentials — shared between Ironic and BMO.
#
# IrSO uses this secret to configure Ironic's basic auth.
# BMO references the same credentials in its ConfigMap to authenticate
# against the Ironic API.
#
# Credentials synced from 1Password item "ironic-api-credentials" via ExternalSecret.
# The htpasswd field is used by Ironic's auth middleware.
# The username/password fields are used by BMO.
#
# To rotate credentials:
#   1. Generate new htpasswd: htpasswd -nbB ironic <new-password>
#   2. Update the 1Password item "ironic-api-credentials"
#   3. Update infrastructure/metal3/bmo/baremetal-operator.yaml ExternalSecret
#   4. Commit and push

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ironic-api-credentials
  namespace: metal3
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: ironic-api-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        htpasswd: "{{ .htpasswd }}"
  data:
    - secretKey: username
      remoteRef:
        key: "ironic-api-credentials"
        property: username
    - secretKey: password
      remoteRef:
        key: "ironic-api-credentials"
        property: password
    - secretKey: htpasswd
      remoteRef:
        key: "ironic-api-credentials"
        property: htpasswd
