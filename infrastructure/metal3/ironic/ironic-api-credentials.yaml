# Ironic API credentials — shared between Ironic and BMO.
#
# IrSO uses this secret to configure Ironic's basic auth.
# BMO references the same credentials in its ConfigMap to authenticate
# against the Ironic API.
#
# Credentials synced from OpenBao KV item "ironic-api-credentials" via ExternalSecret.
# The htpasswd field is used by Ironic's auth middleware.
# The username/password fields are used by BMO.
#
# CRITICAL: The htpasswd field MUST be a valid bcrypt hash of the password,
# in the format "username:$2a$10$<hash>". IrSO's secretNeedsUpdating() checks
# bcrypt.CompareHashAndPassword(htpasswd_hash, password) — if the hash doesn't
# match the password, IrSO regenerates the htpasswd and updates the deployment.
# ESO then overwrites it with the stale value from OpenBao, creating an infinite
# deployment churn loop (thousands of ReplicaSets, deployment never becomes Ready).
#
# To rotate credentials:
#   1. Generate new password and htpasswd:
#      python3 -c "import bcrypt; p=b'<new-password>'; h=bcrypt.hashpw(p,bcrypt.gensalt(rounds=10,prefix=b'2a')); print(f'ironic:{h.decode()}')"
#   2. Update the 1Password item "ironic-api-credentials" (username, password, htpasswd)
#   3. Run scripts/openbao-bootstrap.sh to re-seed OpenBao KV
#   4. Update infrastructure/metal3/bmo/baremetal-operator.yaml ExternalSecret
#   5. Commit and push

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ironic-api-credentials
  namespace: metal3
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: ironic-api-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        htpasswd: "{{ .htpasswd }}"
  data:
    - secretKey: username
      remoteRef:
        key: "ironic-api-credentials"
        property: username
    - secretKey: password
      remoteRef:
        key: "ironic-api-credentials"
        property: password
    - secretKey: htpasswd
      remoteRef:
        key: "ironic-api-credentials"
        property: htpasswd
