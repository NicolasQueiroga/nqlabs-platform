# BareMetalHost: production-cp-01 (Proxmox VM 105)
#
# Production cluster control plane node — to be provisioned by Metal3.
# This VM needs to be created on Proxmox first (with the right MAC and
# network config), then Metal3 will provision it with Talos.
#
# Proxmox VM 105 (to be created):
#   - Name: production-cp-01
#   - MAC: BC:24:11:15:00:30
#   - Cores: 4, Memory: 8192 MB
#   - Network: vmbr0 (192.168.15.0/24)
#   - Disk: 40 GB
#
# BMC: proxmox-redfish at https://192.168.15.20:8443
#   redfish-virtualmedia+https://192.168.15.20:8443/redfish/v1/Systems/105

---
apiVersion: v1
kind: Secret
metadata:
  name: production-cp-01-bmc
  namespace: metal3
type: Opaque
data:
  username: YWRtaW4=
  password: YWRtaW4=
---
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: production-cp-01
  namespace: metal3
  labels:
    cluster: nqlabs-production
    role: control-plane
    provider: proxmox
spec:
  online: true
  bootMACAddress: BC:24:11:15:00:30
  bootMode: UEFI
  hardwareProfile: unknown
  bmc:
    address: redfish-virtualmedia+https://192.168.15.20:8443/redfish/v1/Systems/105
    credentialsName: production-cp-01-bmc
    disableCertificateVerification: true
  accepted: true
