# Shared BMC credentials for all Proxmox VMs.
# All VMs use the same proxmox-redfish daemon with the same Proxmox credentials.
# Synced from 1Password item "proxmox-bmc" via ExternalSecret.
# Generated by generate.sh — do not edit directly.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-bmc
  namespace: metal3
spec:
  refreshPolicy: Periodic
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: proxmox-bmc
    template:
      type: Opaque
  data:
    - secretKey: username
      remoteRef:
        key: "proxmox-bmc"
        property: username
    - secretKey: password
      remoteRef:
        key: "proxmox-bmc"
        property: password
