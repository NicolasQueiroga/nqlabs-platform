# BareMetalHost: staging-cp-01 (Proxmox VM 104)
#
# Staging cluster control plane node — to be provisioned by Metal3.
# This VM needs to be created on Proxmox first (with the right MAC and
# network config), then Metal3 will provision it with Talos.
#
# Proxmox VM 104 (to be created):
#   - Name: staging-cp-01
#   - MAC: BC:24:11:15:00:20
#   - Cores: 4, Memory: 8192 MB
#   - Network: vmbr0 (192.168.15.0/24)
#   - Disk: 40 GB
#
# BMC: proxmox-redfish at https://192.168.15.20:8443
#   redfish-virtualmedia+https://192.168.15.20:8443/redfish/v1/Systems/104

---
apiVersion: v1
kind: Secret
metadata:
  name: staging-cp-01-bmc
  namespace: metal3
type: Opaque
data:
  username: cm9vdEBwYW0=
  password: cXVlaXJvZ2E=
---
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: staging-cp-01
  namespace: metal3
  labels:
    cluster: nqlabs-staging
    role: control-plane
    provider: proxmox
spec:
  online: true
  bootMACAddress: BC:24:11:15:00:20
  bootMode: UEFI
  hardwareProfile: unknown
  bmc:
    address: redfish-virtualmedia+https://192.168.15.20:8443/redfish/v1/Systems/104
    credentialsName: staging-cp-01-bmc
    disableCertificateVerification: true
  accepted: true
  # Talos image for provisioning
  # The image URL and checksum will be set by the Cluster API Metal3MachineTemplate
  # when the node is assigned to a cluster.  The image field here can be used
  # for standalone provisioning (without Cluster API).
  # image:
  #   url: https://github.com/siderolabs/talos/releases/download/v1.13.3/metal-amd64.raw.xz
  #   checksum: <sha256sum>
  #   format: raw
