# Default-deny ingress CNPs for CAPI/Metal3 namespaces managed by this app.
# Kept here (not in platform/security/) to avoid ArgoCD SharedResourceWarning
# — the cluster-api app owns the Namespace resources for these namespaces.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: cabpt-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: cacppt-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: capi-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: capm3-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-ingress
  namespace: cluster-api-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: []

---
# Allow API server to reach admission webhooks on port 9443.
# With Cilium kube-proxy replacement, API server traffic arrives as
# host/remote-node/kube-apiserver entities, NOT from the LAN CIDR.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-webhook
  namespace: cabpt-system
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP

