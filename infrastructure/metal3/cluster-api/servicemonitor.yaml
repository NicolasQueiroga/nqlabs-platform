# CAPI (Cluster API) PodMonitors — scrape controller metrics on port 8443.
# The webhook services only expose 443 (webhook), not metrics.
# PodMonitors are needed to scrape the metrics port directly.
# All CAPI providers use HTTPS with self-signed certs on the metrics port.

---
# CAPI core — cluster-api provider
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cluster-api
  namespace: capi-system
  labels:
    app.kubernetes.io/name: cluster-api
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: cluster-api
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true

---
# CABPT — Talos bootstrap provider
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cabpt
  namespace: cabpt-system
  labels:
    app.kubernetes.io/name: cabpt
    app.kubernetes.io/part-of: nqlabs-platform
spec:
