      tlsConfig:
        insecureSkipVerify: true

---
# CACPPT — Talos control plane provider
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cacppt
  namespace: cacppt-system
  labels:
    app.kubernetes.io/name: cacppt
    app.kubernetes.io/part-of: nqlabs-platform
spec:
