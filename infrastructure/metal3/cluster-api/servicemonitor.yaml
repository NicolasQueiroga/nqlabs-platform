# CAPI (Cluster API) PodMonitors — scrape controller metrics on port 8443.
# The webhook services only expose 443 (webhook), not metrics.
# PodMonitors are needed to scrape the metrics port directly.
# All CAPI providers use HTTPS with self-signed certs on the metrics port.
#
# NOTE: The CAPI controllers have --insecure-diagnostics=false, so their
# metrics endpoints require authentication (kube-rbac-proxy). The
# PodMonitor CRD does not support bearerTokenFile (removed in newer
# prometheus-operator versions). To authenticate, use `authorization`
# with a Secret containing the Prometheus SA token, or set
# --insecure-diagnostics=true on the controllers. For now, these
# targets will return 401 — the ComparisonError from bearerTokenFile
# was worse (blocked the entire cluster-api app from syncing).

---
# CAPI core — cluster-api provider
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cluster-api
  namespace: capi-system
  labels:
    app.kubernetes.io/name: cluster-api
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: cluster-api
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: true

---
# CABPT — Talos bootstrap provider
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cabpt
  namespace: cabpt-system
  labels:
    app.kubernetes.io/name: cabpt
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: bootstrap-talos
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: true

---
# CACPPT — Talos control plane provider
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cacppt
  namespace: cacppt-system
  labels:
    app.kubernetes.io/name: cacppt
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: control-plane-talos
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
