# Argo Rollouts Helm values — NQLabs Platform
#
# Chart: argo/argo-rollouts 2.41.0
# App:   Argo Rollouts v1.9.0
# Namespace: argo-rollouts

installCRDs: true

controller:
  # Single-node Phase 0 cluster; increase in Phase 1.
  replicas: 1

  # Gateway API traffic router plugin — enables exact-weight canary by adjusting
  # weighted HTTPRoute backendRefs. Only invoked by Rollouts that set
  # trafficRouting; clusters are amd64 (Talos metal amd64).
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.14.1/gatewayapi-plugin-linux-amd64

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Dashboard is private behind Tailscale/Gateway and read-only.
# Mutating rollout operations should be done through git/ArgoCD or kubectl plugin.
dashboard:
  enabled: true
  readonly: true

  replicas: 1

  # Keep the dashboard private behind the Authentik/Tailscale path while also
  # satisfying the baseline Kyverno seccomp/capability requirements.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

  # The dashboard HTTPRoute is defined in rbac/httproute.yaml instead, routed
  # through the Authentik embedded outpost (forward-auth) rather than directly
  # to the dashboard service. See docs/decisions/identity-provider.md.
  httproute:
    enabled: false
