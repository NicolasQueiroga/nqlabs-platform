# CiliumNetworkPolicy for the argo-rollouts namespace.
#
# The Cilium Gateway API proxy uses the reserved "ingress" Cilium identity
# and connects directly to pod container ports (not service ports). A standard
# K8s NetworkPolicy cannot match this identity, so a CiliumNetworkPolicy is
# required to allow the gateway to reach the argo-rollouts dashboard (port 3100).
#
# NOTE: this file is managed as a 4th source on the argo-rollouts ArgoCD Application.
# See clusters/nqlabs-management/argocd/apps/argo-rollouts.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argo-rollouts-allow-cilium-gateway
  namespace: argo-rollouts
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
