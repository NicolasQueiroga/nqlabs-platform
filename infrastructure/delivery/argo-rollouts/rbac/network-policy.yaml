# CiliumNetworkPolicy for the argo-rollouts namespace dashboard (port 3100).
#
# On the management cluster the dashboard is fronted by the Authentik embedded
# outpost (forward-auth), so the authentik namespace must be allowed to reach it.
# The reserved "ingress" entity is also allowed as a fallback / for direct
# gateway access on the staging/production clusters (where authentik is absent,
# the authentik rule simply matches nothing).
# The monitoring namespace is allowed so Gatus can perform internal health checks.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argo-rollouts-allow-cilium-gateway
  namespace: argo-rollouts
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
            - port: "8090"
              protocol: TCP
