# velero-credentials: Azure storage key + AWS creds (both 1Password items).
# AWS plugin reads [default] section in 'cloud' file (see values BackupStorageLocation).
# Azure plugin reads AZURE_STORAGE_ACCOUNT_ACCESS_KEY env var.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: nqlabs-1password
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .aws_access }}
          aws_secret_access_key={{ .aws_secret }}
        AZURE_STORAGE_ACCOUNT_ACCESS_KEY: "{{ .azure_key }}"
  data:
    - secretKey: aws_access
      remoteRef: { key: velero-aws/access-key-id }
    - secretKey: aws_secret
      remoteRef: { key: velero-aws/secret-access-key }
    - secretKey: azure_key
      remoteRef: { key: velero-azure/storage-key }
