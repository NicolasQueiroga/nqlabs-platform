# velero-credentials — two credential keys for offsite BSLs:
#   aws   -> AWS S3 profile   (referenced by the 'aws' BSL)
#   azure -> Azure storage key file (referenced by the 'azure' BSL)
# Local RGW credentials are in the velero-rgw-credentials secret (OBC-managed).
# All values come from 1Password (velero-aws / velero-azure).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  # Backup backend credentials are static operational credentials. Avoid hourly
  # provider reads from every cluster: external providers can rate-limit during
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: nqlabs-1password
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        aws: |
          [default]
          aws_access_key_id={{ .aws_id }}
          aws_secret_access_key={{ .aws_secret }}
        azure: |
          AZURE_STORAGE_ACCOUNT_ACCESS_KEY={{ .azure_key }}
          AZURE_CLOUD_NAME=AzurePublicCloud
  data:
    - secretKey: aws_id
      remoteRef:
        key: "op://NQLabs/velero-aws/access-key-id"
    - secretKey: aws_secret
      remoteRef:
        key: "op://NQLabs/velero-aws/secret-access-key"
    - secretKey: azure_key
      remoteRef:
        key: "op://NQLabs/velero-azure/storage-key"
