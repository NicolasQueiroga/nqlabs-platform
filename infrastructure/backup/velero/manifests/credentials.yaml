# velero-credentials — one secret, three credential keys:
#   cloud (default) -> MinIO S3 profile (used by the default 'minio' BSL)
#   aws             -> AWS S3 profile   (referenced by the 'aws' BSL)
#   azure           -> Azure storage key file (referenced by the 'azure' BSL)
# All values come from 1Password (velero-minio / velero-aws / velero-azure).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: nqlabs-1password
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .minio_user }}
          aws_secret_access_key={{ .minio_pass }}
        aws: |
          [default]
          aws_access_key_id={{ .aws_id }}
          aws_secret_access_key={{ .aws_secret }}
        azure: |
          AZURE_STORAGE_ACCOUNT_ACCESS_KEY={{ .azure_key }}
          AZURE_CLOUD_NAME=AzurePublicCloud
  data:
    - secretKey: minio_user
      remoteRef: { key: velero-minio/access-key }
    - secretKey: minio_pass
      remoteRef: { key: velero-minio/secret-key }
    - secretKey: aws_id
      remoteRef: { key: velero-aws/access-key-id }
    - secretKey: aws_secret
      remoteRef: { key: velero-aws/secret-access-key }
    - secretKey: azure_key
      remoteRef: { key: velero-azure/storage-key }
