# velero-credentials (AWS-style creds file) from 1Password item velero-backup.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: nqlabs-1password
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access }}
          aws_secret_access_key={{ .secret }}
  data:
    - secretKey: access
      remoteRef: { key: velero-backup/access-key }
    - secretKey: secret
      remoteRef: { key: velero-backup/secret-key }
