# Provision a dedicated Velero bucket on the internal Ceph RGW object store.
# The OBC generates credentials used by the local BSL in values.yaml.
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: velero-rgw
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  bucketName: velero
  storageClassName: ceph-bucket
---
# ExternalSecret — S3 credentials for the local (RGW) Velero BSL.
# Synced from 1Password item "velero-rgw-credentials".
# If the OBC is reprovisioned (new user), update the 1Password item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-rgw-credentials
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: nqlabs-platform
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    name: nqlabs-openbao
    kind: ClusterSecretStore
  target:
    name: velero-rgw-credentials
    template:
      type: Opaque
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .aws_access_key_id }}
          aws_secret_access_key={{ .aws_secret_access_key }}
  data:
    - secretKey: aws_access_key_id
      remoteRef:
        key: "velero-rgw-credentials"
        property: aws_access_key_id
    - secretKey: aws_secret_access_key
      remoteRef:
        key: "velero-rgw-credentials"
        property: aws_secret_access_key
