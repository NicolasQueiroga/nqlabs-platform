# Velero for staging/production clusters.
#
# Remote clusters have no local MinIO; use offsite AWS as default and Azure as a
# second on-demand/weekly target. Node-agent file backup covers local-path PV data.
initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.14.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 128Mi }
  - name: velero-plugin-for-azure
    image: docker.io/velero/velero-plugin-for-microsoft-azure:v1.14.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 128Mi }
credentials:
  useSecret: true
  existingSecret: velero-credentials
configuration:
  defaultVolumesToFsBackup: true
  backupStorageLocation:
    - name: aws
      provider: aws
      default: true
      bucket: nqlabs-velero-backup
      credential:
        name: velero-credentials
        key: aws
      config:
        region: us-east-1
    - name: azure
      provider: azure
      bucket: velero
      credential:
        name: velero-credentials
        key: azure
      config:
        resourceGroup: nqlabs-backup
        storageAccount: nqlabsvelero24612
        storageAccountKeyEnvVar: AZURE_STORAGE_ACCOUNT_ACCESS_KEY
  volumeSnapshotLocation: []
snapshotsEnabled: false
deployNodeAgent: true
nodeAgent:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  tolerations:
    - operator: Exists
metrics:
  serviceMonitor:
    autodetect: false
    enabled: true
  nodeAgentPodMonitor:
    autodetect: false
    enabled: true
schedules:
  cluster-daily-aws:
    disabled: false
    schedule: "0 6 * * *"
    template:
      ttl: 168h
      storageLocation: aws
      defaultVolumesToFsBackup: true
  cluster-weekly-azure:
    disabled: false
    schedule: "30 6 * * 0"
    template:
      ttl: 720h
      storageLocation: azure
      defaultVolumesToFsBackup: true
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
