# Velero — on-demand backup/DR (no schedule, no node-agent). Three targets:
#   minio (default) — local, free, fast; for routine pre-change snapshots
#   aws            — offsite S3 (us-east-1)        | real DR, on demand:
#   azure          — offsite Blob (Cool, cheapest) |   velero backup create X --storage-location aws
initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.14.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 128Mi }
  - name: velero-plugin-for-azure
    image: docker.io/velero/velero-plugin-for-microsoft-azure:v1.14.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 128Mi }
credentials:
  useSecret: true
  existingSecret: velero-credentials
configuration:
  backupStorageLocation:
    - name: minio
      provider: aws
      default: true
      bucket: velero
      config:
        region: minio
        s3Url: http://minio.minio:9000
        s3ForcePathStyle: "true"
    - name: aws
      provider: aws
      bucket: nqlabs-velero-backup
      credential:
        name: velero-credentials
        key: aws
      config:
        region: us-east-1
    - name: azure
      provider: azure
      bucket: velero
      credential:
        name: velero-credentials
        key: azure
      config:
        resourceGroup: nqlabs-backup
        storageAccount: nqlabsvelero24612
        storageAccountKeyEnvVar: AZURE_STORAGE_ACCOUNT_ACCESS_KEY
  volumeSnapshotLocation: []
snapshotsEnabled: false
deployNodeAgent: false
schedules: {}
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }
