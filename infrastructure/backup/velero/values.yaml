# Velero — scheduled + on-demand backup/DR with node-agent file backup. Three targets:
#   local (default) — Ceph RGW, in-cluster, fast; for routine pre-change snapshots
#   aws            — offsite S3 (us-east-1)        | real DR, on demand:
#   azure          — offsite Blob (Cool, cheapest) |   velero backup create X --storage-location aws
initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.14.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 128Mi }
  - name: velero-plugin-for-azure
    image: docker.io/velero/velero-plugin-for-microsoft-azure:v1.14.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { memory: 128Mi }
credentials:
  useSecret: true
  existingSecret: velero-credentials
configuration:
  defaultVolumesToFsBackup: true
  repositoryMaintenanceJob:
    keepLatestMaintenanceJobs: 3
  backupStorageLocation:
    - name: local
      provider: aws
      default: true
      bucket: velero
      credential:
        name: velero-rgw-credentials
        key: cloud
      config:
        region: us-east-1
        s3Url: http://rook-ceph-rgw-platform-object-store.rook-ceph.svc:80
        s3ForcePathStyle: "true"
    - name: aws
      provider: aws
      bucket: nqlabs-velero-backup
      credential:
        name: velero-credentials
        key: aws
      config:
        region: us-east-1
    - name: azure
      provider: azure
      bucket: velero
      credential:
        name: velero-credentials
        key: azure
      config:
        resourceGroup: nqlabs-backup
        storageAccount: nqlabsvelero24612
        storageAccountKeyEnvVar: AZURE_STORAGE_ACCOUNT_ACCESS_KEY
  volumeSnapshotLocation: []
snapshotsEnabled: false
deployNodeAgent: true
nodeAgent:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  tolerations:
    - operator: Exists

metrics:
  serviceMonitor:
    autodetect: false
    enabled: true
  nodeAgentPodMonitor:
    autodetect: false
    enabled: true
  prometheusRule:
    autodetect: false
    enabled: true
    spec:
      - alert: VeleroBackupFailed
        expr: velero_backup_last_status{schedule!=""} != 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Velero scheduled backup failed"
          description: "Schedule {{ $labels.schedule }} last backup failed."
      - alert: VeleroNoRecentBackup
        expr: ((time() - velero_backup_last_successful_timestamp{schedule!=""}) > 30 * 3600) or absent(velero_backup_last_successful_timestamp{schedule!=""})
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No recent Velero scheduled backup"
          description: "No successful scheduled Velero backup in the expected window."

schedules:
  management-daily-local:
    disabled: false
    schedule: "0 5 * * *"
    template:
      ttl: 168h
      storageLocation: local
      defaultVolumesToFsBackup: true
      includedNamespaces:
        - argocd
        - authentik
        - cert-manager
        - dns
        - external-secrets
        - monitoring
        - velero
  management-weekly-offsite-aws:
    disabled: false
    schedule: "30 5 * * 0"
    template:
      ttl: 720h
      storageLocation: aws
      defaultVolumesToFsBackup: true
      includedNamespaces:
        - argocd
        - authentik
        - cert-manager
        - dns
        - external-secrets
        - monitoring
        - velero
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }

# Security contexts (Kyverno compliance)
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
