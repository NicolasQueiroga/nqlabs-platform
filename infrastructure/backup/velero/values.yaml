# Velero — on-demand cluster backup/DR to Azure + AWS (no schedule, no node-agent).
# Backup manually before risky ops: velero backup create pre-change-$(date +%F)
# Default BSL = Azure (cheaper, Cool tier); secondary = AWS S3 (Cheap standard).
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
  - name: velero-plugin-for-azure
    image: velero/velero-plugin-for-microsoft-azure:v1.14.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
credentials:
  useSecret: true
  existingSecret: velero-credentials
configuration:
  backupStorageLocation:
    - name: azure
      provider: azure
      default: true
      config:
        resourceGroup: nqlabs-backup
        storageAccount: nqlabsvelero24612
        storageAccountKeyEnvVar: AZURE_STORAGE_ACCOUNT_ACCESS_KEY
      bucket: velero
    - name: aws
      provider: aws
      bucket: nqlabs-velero-backup
      config:
        region: us-east-1
  volumeSnapshotLocation: []
snapshotsEnabled: false
deployNodeAgent: false
schedules: {}
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }
