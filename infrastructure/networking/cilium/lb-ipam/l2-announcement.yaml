# Cilium L2 Announcement Policy — NQLabs Lab
#
# Announces LoadBalancer IPs via gratuitous ARP on the host network interface.
# Required so the Mac (192.168.64.1) can reach services at 192.168.64.200+.
# Interface: enp0s1 (UTM virtio NIC on the Talos node).

apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lab-l2-policy
spec:
  # Apply to all LoadBalancer services
  serviceSelector:
    matchLabels: {}
  # Announce on all nodes (single node lab — talos-z9w-4rg)
  nodeSelector:
    matchLabels: {}
  # Physical interface to announce on
  interfaces:
    - enp0s1
  loadBalancerIPs: true
