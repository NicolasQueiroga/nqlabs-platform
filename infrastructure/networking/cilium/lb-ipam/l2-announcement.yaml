# Cilium L2 Announcement Policy — NQLabs Lab
#
# Announces LoadBalancer IPs via gratuitous ARP on the host network interface.
# Required so LAN devices can reach Cilium LB IPs directly.
#
# Managed by: platform/argocd/apps/cilium-config.yaml
#
# TODO (Phase F — desktop bootstrap):
#   Replace the interface name below with the actual NIC name on the Talos VM.
#   Common names on Proxmox VMs: eth0, enp6s18, enp0s18.
#   To find the name after Talos boots: talosctl get links --nodes <IP>
#   See docs/runbooks/desktop-lab-bootstrap.md Phase F.
#
# Desktop: must be set to the NIC name inside the Talos VM, not the Proxmox host
# interface. Find it after Talos boots with:
#   talosctl get links --nodes <TALOS_CP_IP>

apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lab-l2-policy
spec:
  serviceSelector:
    matchLabels: {}
  nodeSelector:
    matchLabels: {}
  interfaces:
    - eth0   # TODO: replace with actual Talos VM NIC name before ArgoCD sync
  loadBalancerIPs: true
