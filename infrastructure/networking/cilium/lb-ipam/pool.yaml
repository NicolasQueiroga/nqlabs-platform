# Cilium LoadBalancer IP Pool — NQLabs Lab
#
# Allocates IPs for LoadBalancer services from a reserved range on the host network.
# IPs are announced via L2 (gratuitous ARP) so LAN devices can reach them directly.
#
# Managed by: platform/argocd/apps/cilium-config.yaml
#
# TODO (Phase F — desktop bootstrap):
#   Replace the CIDR below with the desktop Cilium LB pool.
#   Choose a range that does not overlap the desktop LAN DHCP pool.
#   Example: if desktop LAN is 192.168.1.0/24 and DHCP is .2-.99, use 192.168.1.200/28
#   See docs/runbooks/desktop-lab-bootstrap.md for the decision table.
#
# Desktop: 192.168.15.200/28 — safe range above typical DHCP allocation on 192.168.15.0/24.
# Assignments:
#   192.168.15.200 — CoreDNS LoadBalancer (Tailscale split DNS target)
#   192.168.15.201 — platform Gateway LoadBalancer (HTTPS entry point)
#   192.168.15.202-215 — reserved for future LB services

apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: lab-pool
spec:
  blocks:
    - cidr: "192.168.15.200/28"   # 192.168.15.200-215 — desktop LAN (nqlabs-desktop)
