# Expose platform-gateway via Tailscale
# All HTTPS platform services route through this single gateway.
# DNS (nqlabs.network) records are managed by CoreDNS template plugin — all
# *.platform / *.staging / *.production resolve to this Tailscale IP (100.123.152.13)
# so clients ALWAYS connect via Tailscale regardless of LAN presence.
#
# Architecture:
#   Tailscale client → 100.123.152.13 (this device) → Cilium Gateway LB (192.168.15.193)
#   → cilium-envoy → HTTPRoute → backend pod
#
# The Service has NO selector because the Cilium Gateway API uses eBPF internally
# and does not expose pods with gateway labels. Endpoints are managed manually,
# pointing to the Cilium Gateway LB IP (192.168.15.193).

apiVersion: v1
kind: Service
metadata:
  name: platform-gateway-tailscale
  namespace: platform
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "platform-gateway"
    tailscale.com/tags: "tag:k8s"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  # No selector — endpoints managed below (Cilium Gateway LB IP)
  ports:
    - name: https
      port: 443
      targetPort: 443
    - name: http
      port: 80
      targetPort: 80
---
# Manual endpoints: forward Tailscale proxy traffic to the Cilium Gateway LB IP.
# Cilium eBPF intercepts traffic to 192.168.15.193 and routes to cilium-envoy.
# Update if the Cilium LB pool or Gateway service IP changes.
apiVersion: v1
kind: Endpoints
metadata:
  name: platform-gateway-tailscale
  namespace: platform
subsets:
  - addresses:
      - ip: 192.168.15.193
    ports:
      - name: https
        port: 443
        protocol: TCP
      - name: http
        port: 80
        protocol: TCP
