# Tailscale Connector — subnet router for the cluster network
#
# Advertises the desktop LAN/Cilium LB range to the tailnet so all Tailscale
# devices can reach cluster LoadBalancer IPs directly.
#
# UPDATE before desktop bootstrap (Phase F of desktop-lab-bootstrap.md):
#   Replace advertiseRoutes with the actual desktop LAN subnet or Cilium LB pool.
#   Example: 192.168.1.0/24  (if desktop LAN is 192.168.1.0/24)
#   Example: 192.168.1.200/29 (if advertising only the Cilium LB pool)
#
# Phase 1 NUC: replace with NUC cluster subnet.

apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: lab-subnet-router
  namespace: tailscale
spec:
  hostname: nqlabs-lab-router
  proxyClass: default
  subnetRouter:
    advertiseRoutes:
      - 192.168.15.0/24   # desktop LAN — nqlabs-desktop (192.168.15.20), Talos VMs (.30-49), LB pool (.192-207)
