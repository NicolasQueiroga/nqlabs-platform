# Expose CoreDNS (DNS for nqlabs.network) via Tailscale
# Gets a Tailscale IP (100.x.x.x) reachable from all tailnet devices.
# Use this Tailscale IP as the split DNS nameserver in Tailscale admin:
#   Admin → DNS → nameserver → <this IP> → restricted to nqlabs.network

apiVersion: v1
kind: Service
metadata:
  name: coredns-tailscale
  namespace: dns
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "coredns"
    tailscale.com/tags: "tag:k8s"
    tailscale.com/proxy-class: "default"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: coredns
    app.kubernetes.io/instance: coredns-dns
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
