# Tailscale Operator Helm values — NQLabs Platform
# Chart: tailscale/tailscale-operator
# Tailnet: hen-exponential.ts.net
#
# OAuth credentials managed by External Secrets Operator (NOT manual bootstrap).
# ExternalSecret: infrastructure/security/external-secrets/secrets/tailscale-oauth.yaml
#   Reads: 1Password NQLabs vault → tailscale-key → username (client_id), credential (client_secret)
#   Creates: secret/operator-oauth in tailscale namespace
#
# ESO (external-secrets-config, sync-wave 1) creates the secret before this
# operator is deployed (sync-wave 2). No manual kubectl bootstrap required.

operatorConfig:
  hostname: nqlabs-operator
  logging: info

# Fully-qualified image references (Kyverno restrict-image-registries)
operatorImage: docker.io/tailscale/k8s-operator:v1.98.4
proxyImage: docker.io/tailscale/tailscale:v1.98.4

# Resource requests (Kyverno require-resource-requests)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# oauth block intentionally empty — operator reads from ESO-managed operator-oauth secret
oauth:
  clientId: ""
  clientSecret: ""
