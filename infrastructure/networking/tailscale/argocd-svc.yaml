# Expose ArgoCD UI on Tailscale
# Creates a Tailscale device named "argocd" on hen-exponential.ts.net
# Access: http://argocd (MagicDNS) or http://argocd.hen-exponential.ts.net

apiVersion: v1
kind: Service
metadata:
  name: argocd-tailscale
  namespace: argocd
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "argocd"
    tailscale.com/tags: "tag:k8s"
    # DNS record now managed by HTTPRoute annotation via Gateway
    # See infrastructure/networking/gateway/argocd-route.yaml
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
