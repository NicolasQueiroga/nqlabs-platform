# ArgoCD HTTPRoute — routes argocd.platform.nqlabs.network to ArgoCD server
#
# HTTPS traffic terminates at platform-gateway, forwarded to argocd-server on HTTP.
# ArgoCD runs in insecure mode (server.insecure=true) — TLS handled at gateway.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/hostname: argocd.platform.nqlabs.network
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  hostnames:
    - argocd.platform.nqlabs.network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          namespace: argocd
          port: 80
