# Platform Gateway — shared HTTPS entry point for nqlabs.network services
#
# Managed by Cilium Gateway API.
# TLS terminated here using a publicly trusted Let's Encrypt wildcard cert.
# Services attach via HTTPRoute referencing this Gateway.
#
# Cert covers:
#   *.platform.nqlabs.network   — platform tools (ArgoCD, Grafana, etc.)
#   *.staging.nqlabs.network    — staging services
#   *.production.nqlabs.network — production services
#
# allowedRoutes uses from: Selector with label gateway-access: "true".
# Namespaces with HTTPRoutes must have this label to attach to the gateway.
# This prevents unauthorized namespaces from hijacking hostnames.
#
# The Namespace resources below ensure the gateway-access label is applied
# to existing namespaces via ServerSideApply (managedNamespaceMetadata only
# applies labels at namespace creation, not to existing namespaces).

---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    gateway-access: "true"

---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    gateway-access: "true"

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    pod-security.kubernetes.io/enforce: baseline
    gateway-access: "true"

---
apiVersion: v1
kind: Namespace
metadata:
  name: minio
  labels:
    gateway-access: "true"

---
# Wildcard cert for the platform Gateway.
# Issued by Let's Encrypt via Cloudflare DNS-01 so tailnet devices trust HTTPS
# without installing the NQLabs internal CA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nqlabs-wildcard
  namespace: platform
spec:
  secretName: nqlabs-wildcard-tls
  duration: 2160h
  renewBefore: 360h
  commonName: "*.platform.nqlabs.network"
  dnsNames:
    - "*.platform.nqlabs.network"
    - "*.staging.nqlabs.network"
    - "*.production.nqlabs.network"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: nqlabs-wildcard-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
---
# HTTP→HTTPS redirect — all port 80 traffic redirected to 443.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: platform
spec:
  parentRefs:
    - name: platform-gateway
      sectionName: http
  rules:
    # Explicit match-all. The Gateway API defaults an omitted matches to
    # PathPrefix "/"; declaring it keeps git as the true source of truth and
    # prevents a permanent ArgoCD OutOfSync on the atomically-managed rules list.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
