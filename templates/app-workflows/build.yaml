# App repo workflow: PR build validation
#
# Copy this file to .github/workflows/build.yaml in the app repo.
# Replace <app> with the service name (must match apps/<app>/ in the platform repo).

name: build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (validate only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true

      - name: Test
        run: |
          # Add app-specific tests here
          echo "Build validation passed"
