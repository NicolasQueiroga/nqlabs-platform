# App repo workflow: preview TTL reaper
#
# Copy this file to .github/workflows/preview-reaper.yaml in the app repo.
# Replace <app> with the service name.
#
# Runs every 15 minutes to check for expired previews and tear them down.

name: Preview reaper

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  reap:
    uses: NicolasQueiroga/nqlabs-platform/.github/workflows/preview-reaper-reusable.yaml@main
    with:
      app: <app>
    secrets: inherit
