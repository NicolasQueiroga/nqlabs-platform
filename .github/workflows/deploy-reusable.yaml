name: Deploy (reusable)

# Reusable deploy pipeline for application repos. Handles both staging
# (fast lane: direct commit to platform main) and production (review lane:
# opens a PR in the platform repo).
#
# Staging flow (called on push to app main):
#   1. Build + push image as sha-<shortsha>
#   2. Update apps/<service>/environments/staging.yaml on platform main
#   3. ArgoCD detects the change and deploys to staging
#   4. Call image-supply-chain-reusable for scan + sign + SBOM
#
# Production flow (called on GitHub Release):
#   1. Verify the release commit is on app main
#   2. Verify the sha-<shortsha> image exists in GHCR
#   3. Retag the exact staged artifact as the release tag (vX.Y.Z)
#   4. Open a PR in the platform repo updating production.yaml
#   5. Operator reviews + merges → ArgoCD deploys production (canary)
#   6. Call image-supply-chain-reusable for scan + sign + SBOM
#
# App repos call this via:
#   deploy-staging-on-main.yaml:
#     uses: NicolasQueiroga/nqlabs-platform/.github/workflows/deploy-reusable.yaml@main
#     with:
#       service: <app>
#       environment: staging
#       image: ghcr.io/<owner>/<app>
#     secrets: inherit
#
#   promote-production-on-release.yaml:
#     uses: NicolasQueiroga/nqlabs-platform/.github/workflows/deploy-reusable.yaml@main
#     with:
#       service: <app>
#       environment: production
#       image: ghcr.io/<owner>/<app>
#       release-tag: ${{ github.event.release.tag_name }}
#       release-sha: ${{ github.event.release.target_commitish }}
#     secrets: inherit

on:
  workflow_call:
    inputs:
      service:
        description: Service name (matches apps/<service>/ in the platform repo)
        required: true
        type: string
      environment:
        description: Target environment (staging or production)
        required: true
        type: string
      image:
        description: Container image repository without tag (e.g. ghcr.io/owner/app)
        required: true
        type: string
      release-tag:
        description: Release tag (e.g. v1.2.3) — production only
        required: false
        type: string
      release-sha:
        description: Release commit SHA — production only
        required: false
        type: string
      supply-chain:
        description: Run image supply chain (scan + sign + SBOM)
        required: false
        type: boolean
        default: true

env:
  PLATFORM_REPO: NicolasQueiroga/nqlabs-platform

jobs:
  staging:
    name: Deploy to staging
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: |
          short="${GITHUB_SHA:0:12}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$short" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ inputs.image }}:${{ steps.sha.outputs.tag }}

      - name: Image supply chain (scan + sign + SBOM)
        if: inputs.supply-chain
        uses: NicolasQueiroga/nqlabs-platform/.github/workflows/image-supply-chain-reusable.yaml@main
        with:
          image: ${{ inputs.image }}
          tag: ${{ steps.sha.outputs.tag }}
        secrets: inherit

      - name: Checkout platform repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_REPO }}
          token: ${{ secrets.NQLABS_PLATFORM_REPO_TOKEN }}
          path: platform-repo

      - name: Update staging descriptor
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ steps.sha.outputs.tag }}
        run: |
          set -euo pipefail
          cd platform-repo
          python3 scripts/update-service-image.py \
            --service "$SERVICE" \
            --environment staging \
            --repository "$IMAGE" \
            --tag "$TAG"

      - name: Commit to platform main
        env:
          SERVICE: ${{ inputs.service }}
          TAG: ${{ steps.sha.outputs.tag }}
        run: |
          set -euo pipefail
          cd platform-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "apps/$SERVICE/environments/staging.yaml"
          git commit -q -m "deploy($SERVICE): staging → $TAG" || exit 0
          git push origin HEAD:main

  production:
    name: Promote to production
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    steps:
      - name: Validate inputs
        env:
          TAG: ${{ inputs.release-tag }}
          SHA: ${{ inputs.release-sha }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then echo "::error::release-tag is required for production"; exit 1; fi
          if [ -z "$SHA" ]; then echo "::error::release-sha is required for production"; exit 1; fi
          echo "Promoting release $TAG (commit $SHA)"

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-sha }}

      - name: Compute short SHA
        id: sha
        env:
          SHA: ${{ inputs.release-sha }}
        run: |
          short="${SHA:0:12}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "staged-tag=sha-$short" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify staged image exists
        env:
          IMAGE: ${{ inputs.image }}
          STAGED: ${{ steps.sha.outputs.staged-tag }}
        run: |
          set -euo pipefail
          if ! crane manifest "$IMAGE:$STAGED" >/dev/null 2>&1; then
            echo "::error::Staged image $IMAGE:$STAGED not found — deploy to staging first"
            exit 1
          fi
          echo "Staged image verified: $IMAGE:$STAGED"

      - name: Promote artifact (retag staged image as release tag)
        env:
          IMAGE: ${{ inputs.image }}
          STAGED: ${{ steps.sha.outputs.staged-tag }}
          RELEASE: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          crane copy "$IMAGE:$STAGED" "$IMAGE:$RELEASE"
          echo "Promoted $IMAGE:$STAGED → $IMAGE:$RELEASE"

      - name: Image supply chain (scan + sign + SBOM)
        if: inputs.supply-chain
        uses: NicolasQueiroga/nqlabs-platform/.github/workflows/image-supply-chain-reusable.yaml@main
        with:
          image: ${{ inputs.image }}
          tag: ${{ inputs.release-tag }}
        secrets: inherit

      - name: Checkout platform repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_REPO }}
          token: ${{ secrets.NQLABS_PLATFORM_REPO_TOKEN }}
          path: platform-repo

      - name: Update production descriptor
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ inputs.image }}
          RELEASE: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          cd platform-repo
          python3 scripts/update-service-image.py \
            --service "$SERVICE" \
            --environment production \
            --repository "$IMAGE" \
            --tag "$RELEASE"

      - name: Open production PR
        env:
          GH_TOKEN: ${{ secrets.NQLABS_PLATFORM_REPO_TOKEN }}
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ inputs.image }}
          RELEASE: ${{ inputs.release-tag }}
          STAGED: ${{ steps.sha.outputs.staged-tag }}
        run: |
          set -euo pipefail
          cd platform-repo
          branch="promote/$SERVICE/$RELEASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add "apps/$SERVICE/environments/production.yaml"
          git commit -q -m "deploy($SERVICE): production → $RELEASE"
          git push -u origin "$branch"
          gh pr create \
            --title "Promote $SERVICE to production: $RELEASE" \
            --body "$(printf 'Promotes **%s** to production.\n\n- Image: `%s:%s`\n- Promoted from staged artifact: `%s:%s`\n\nMerge to deploy to production (canary rollout).\n\n> Reviewer: verify the staging deployment is healthy before merging.' "$SERVICE" "$IMAGE" "$RELEASE" "$IMAGE" "$STAGED")"
