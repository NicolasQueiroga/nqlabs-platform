name: Image supply chain (reusable)

# Reusable supply-chain hardening for application images: scan (Trivy), sign
# (Cosign keyless via GitHub OIDC), and attach an SBOM attestation. App repos call
# this after build/push. Signatures are verified in-cluster by the Kyverno
# verify-image-signatures policy.

on:
  workflow_call:
    inputs:
      image:
        description: Image repository without tag (e.g. ghcr.io/owner/app)
        required: true
        type: string
      tag:
        description: Image tag
        required: true
        type: string
      fail-on-vuln:
        description: Fail on HIGH/CRITICAL fixable vulns (else audit only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image }}:${{ inputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ inputs.fail-on-vuln && '1' || '0' }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install crane
        uses: imjasonh/setup-crane@v0

      - name: Resolve digest
        id: digest
        run: |
          set -euo pipefail
          d="$(cosign triangulate --type digest "${{ inputs.image }}:${{ inputs.tag }}" 2>/dev/null || true)"
          if [ -z "$d" ]; then
            d="${{ inputs.image }}@$(crane digest "${{ inputs.image }}:${{ inputs.tag }}" 2>/dev/null || echo)"
          fi
          # Fallback: sign the tag if digest resolution is unavailable.
          echo "ref=${d:-${{ inputs.image }}:${{ inputs.tag }}}" >> "$GITHUB_OUTPUT"

      - name: Sign (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "${{ inputs.image }}:${{ inputs.tag }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.image }}:${{ inputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM attestation
        env:
          COSIGN_YES: "true"
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${{ inputs.image }}:${{ inputs.tag }}"
