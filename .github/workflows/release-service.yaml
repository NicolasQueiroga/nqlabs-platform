name: Release service image

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service name under services/<service> and apps/<service>
        required: true
        default: demo
      environment:
        description: Environment value file to update
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      image_tag:
        description: Optional image tag. Defaults to git short SHA.
        required: false
        default: ""
      update_environment:
        description: Open a PR updating apps/<service>/environments/<environment>.yaml
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ github.event.inputs.service }}-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-propose:
    name: Build image and propose environment update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          service='${{ github.event.inputs.service }}'
          environment='${{ github.event.inputs.environment }}'
          requested_tag='${{ github.event.inputs.image_tag }}'

          if [[ ! "$service" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid service name: $service" >&2
            exit 1
          fi

          if [[ -n "$requested_tag" && ! "$requested_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $requested_tag" >&2
            exit 1
          fi

          if [[ ! -f "services/$service/Dockerfile" ]]; then
            echo "Missing services/$service/Dockerfile" >&2
            exit 1
          fi

          if [[ ! -f "apps/$service/environments/$environment.yaml" ]]; then
            echo "Missing apps/$service/environments/$environment.yaml" >&2
            exit 1
          fi

          short_sha="$(git rev-parse --short=12 HEAD)"
          tag="${requested_tag:-sha-$short_sha}"
          repository="$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/nqlabs-$service" | tr '[:upper:]' '[:lower:]')"

          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "image=$repository:$tag" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ steps.meta.outputs.service }}
          file: services/${{ steps.meta.outputs.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=nqlabs-${{ steps.meta.outputs.service }}
          provenance: mode=max
          sbom: true

      - name: Update environment image reference
        if: ${{ github.event.inputs.update_environment == 'true' }}
        run: |
          scripts/update-service-image.py \
            --service '${{ steps.meta.outputs.service }}' \
            --environment '${{ steps.meta.outputs.environment }}' \
            --repository '${{ steps.meta.outputs.repository }}' \
            --tag '${{ steps.meta.outputs.tag }}'

      - name: Open environment update PR
        if: ${{ github.event.inputs.update_environment == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: "release/${{ steps.meta.outputs.service }}-${{ steps.meta.outputs.environment }}-${{ steps.meta.outputs.tag }}"
          delete-branch: true
          commit-message: "release(${{ steps.meta.outputs.service }}): update ${{ steps.meta.outputs.environment }} image to ${{ steps.meta.outputs.tag }}"
          title: "release(${{ steps.meta.outputs.service }}): update ${{ steps.meta.outputs.environment }} image to ${{ steps.meta.outputs.tag }}"
          body: |
            ## Summary
            - Built `${{ steps.meta.outputs.image }}` from `services/${{ steps.meta.outputs.service }}`.
            - Updated `apps/${{ steps.meta.outputs.service }}/environments/${{ steps.meta.outputs.environment }}.yaml` to deploy the new image.

            ## Validation
            - Image build pushed to GHCR for `linux/amd64` and `linux/arm64`.
            - ArgoCD will reconcile the service Application after this PR is merged.
