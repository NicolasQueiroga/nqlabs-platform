name: Create application

# One-step app onboarding. Generates the platform-side descriptors for a new
# service (app.yaml + staging/production environments) and opens a PR. After merge,
# add the thin caller workflows to the app repo (see
# docs/runbooks/onboarding-a-new-application.md).

on:
  workflow_dispatch:
    inputs:
      name:
        description: Service name (apps/<name>/, namespace, host prefix)
        required: true
        type: string
      team:
        description: Team name (must exist — created via team-create workflow)
        required: true
        type: string
      repository:
        description: Application repo (owner/repo)
        required: true
        type: string
      image:
        description: Image repository without tag (e.g. ghcr.io/owner/name)
        required: true
        type: string
      port:
        description: Container/service port
        required: false
        type: number
        default: 8080
      tier:
        description: internal | public-facing
        required: false
        type: string
        default: internal
      public:
        description: Allow a public *.nqlabs.io route (still disabled per-env until approved)
        required: false
        type: boolean
        default: false
      database:
        description: Provision a PostgreSQL database (CNPG + PgBouncer)
        required: false
        type: boolean
        default: false
      databaseTier:
        description: Database tier (small | standard | large)
        required: false
        type: string
        default: small
      redis:
        description: Provision a Valkey (Redis) cache
        required: false
        type: boolean
        default: false
      kafka:
        description: Enable Kafka/Redpanda event streaming (topics provisioned via app.yaml)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate descriptors
        env:
          NAME: ${{ inputs.name }}
          TEAM: ${{ inputs.team }}
          REPO: ${{ inputs.repository }}
          IMG: ${{ inputs.image }}
          PORT: ${{ inputs.port }}
          TIER: ${{ inputs.tier }}
          PUBLIC: ${{ inputs.public }}
          DB: ${{ inputs.database }}
          DB_TIER: ${{ inputs.databaseTier }}
          REDIS: ${{ inputs.redis }}
          KAFKA: ${{ inputs.kafka }}
        run: |
          set -euo pipefail
          if [ -e "apps/$NAME" ]; then echo "::error::apps/$NAME already exists"; exit 1; fi
          mkdir -p "apps/$NAME/environments" "apps/$NAME/previews"

          yq -n '
            .metadata.name = strenv(NAME) |
            .metadata.team = strenv(TEAM) |
            .metadata.repository = strenv(REPO) |
            .metadata.tier = strenv(TIER) |
            .metadata.lifecycle = "active" |
            .exposure.internal.allowed = true |
            .exposure.internal.domain = "network" |
            .exposure.public.allowed = (strenv(PUBLIC) == "true") |
            .exposure.public.domain = "io" |
            .exposure.public.requiresApproval = true |
            .dependencies.secrets = [] |
            .dependencies.externalServices = [] |
            .container.port = (strenv(PORT) | tonumber) |
            .service.port = (strenv(PORT) | tonumber) |
            .rollout.enabled = true |
            .rollout.strategy.canary.maxSurge = "25%" |
            .rollout.strategy.canary.maxUnavailable = 0
          ' > "apps/$NAME/app.yaml"

          for env in staging production; do
            cluster="nqlabs-$env"
            ENV="$env" CLUSTER="$cluster" yq -n '
              .app.name = strenv(NAME) |
              .environment.name = strenv(ENV) |
              .environment.namespace = (strenv(TEAM) + "-" + strenv(NAME)) |
              .argocd.project = strenv(TEAM) + "-" + strenv(ENV) |
              .argocd.valueFile = "apps/" + strenv(NAME) + "/environments/" + strenv(ENV) + ".yaml" |
              .argocd.destination.name = strenv(CLUSTER) |
              .image.repository = strenv(IMG) |
              .image.tag = "REPLACE_ON_FIRST_DEPLOY" |
              .route.enabled = true |
              .route.host = strenv(NAME) + "." + strenv(ENV) + ".nqlabs.network"
            ' > "apps/$NAME/environments/$env.yaml"
          done

          # Add database configuration if requested
          if [ "$DB" = "true" ]; then
            for env in staging production; do
              if [ "$env" = "production" ] && [ "$DB_TIER" = "small" ]; then
                # Production defaults to standard tier for HA
                yq -i ".database.enabled = true | .database.tier = \"standard\"" "apps/$NAME/environments/$env.yaml"
              else
                yq -i ".database.enabled = true | .database.tier = strenv(DB_TIER)" "apps/$NAME/environments/$env.yaml"
              fi
            done
          fi

          # Add Redis configuration if requested
          if [ "$REDIS" = "true" ]; then
            for env in staging production; do
              if [ "$env" = "production" ]; then
                yq -i ".redis.enabled = true | .redis.ha = true" "apps/$NAME/environments/$env.yaml"
              else
                yq -i ".redis.enabled = true | .redis.ha = false" "apps/$NAME/environments/$env.yaml"
              fi
            done
          fi

          # Add Kafka configuration stub if requested
          if [ "$KAFKA" = "true" ]; then
            for env in staging production; do
              yq -i ".kafka.enabled = true | .kafka.topics = []" "apps/$NAME/environments/$env.yaml"
            done
          fi

          # Production gets a progressive canary by default (review 5.6); staging stays
          # fast. Basic (replica-ratio) canary — valid without a traffic router.
          yq -i '.rollout.strategy.canary.steps = [
            {"setWeight": 10}, {"pause": {}}, {"setWeight": 25},
            {"pause": {}}, {"setWeight": 50}, {"pause": {}}, {"setWeight": 100}
          ]' "apps/$NAME/environments/production.yaml"

          printf '# Preview descriptors (ephemeral, auto-managed by /preview)\n' > "apps/$NAME/previews/README.md"
          echo "generated apps/$NAME/{app.yaml,environments/{staging,production}.yaml}"

      - name: Open onboarding PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ inputs.name }}
          TEAM: ${{ inputs.team }}
          REPO: ${{ inputs.repository }}
          IMG: ${{ inputs.image }}
          DB: ${{ inputs.database }}
          REDIS: ${{ inputs.redis }}
          KAFKA: ${{ inputs.kafka }}
        run: |
          set -euo pipefail
          branch="app-create/$NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add "apps/$NAME"
          git commit -q -m "feat(app): scaffold $NAME for team $TEAM (staging + production descriptors)"
          git push -u origin "$branch"

          extras=""
          if [ "$DB" = "true" ]; then extras="$extras\n- PostgreSQL database (CNPG + PgBouncer pooler, WAL backup to Ceph RGW)"; fi
          if [ "$REDIS" = "true" ]; then extras="$extras\n- Valkey (Redis) cache with persistent storage"; fi
          if [ "$KAFKA" = "true" ]; then extras="$extras\n- Kafka event streaming via Redpanda (add topics to kafka.topics in app.yaml)"; fi

          gh pr create --title "Create application: $NAME (team: $TEAM)" --body "$(printf 'Scaffolds platform descriptors for **%s** (team: %s, repo %s, image %s).\n\n- apps/%s/app.yaml (identity + shape, team: %s)\n- apps/%s/environments/{staging,production}.yaml (runtime; image tag is a placeholder until the first build)\n- ArgoCD project: %s-staging, %s-production\n- Namespace: %s-%s%s\n\nAfter merge, in the app repo: add the build / staging / release / production / preview caller workflows (see docs/runbooks/onboarding-a-new-application.md), set secrets NQLABS_PLATFORM_REPO_TOKEN and the release token, and grant the repo GHCR package write access. The app deploys to staging on first main merge.' "$NAME" "$TEAM" "$REPO" "$IMG" "$NAME" "$TEAM" "$NAME" "$TEAM" "$TEAM" "$TEAM" "$NAME" "$extras")"
