app:
  name: ""

environment:
  name: ""

replicaCount: 1

image:
  repository: traefik/whoami
  tag: v1.11.0
  pullPolicy: IfNotPresent

# Optional Kubernetes image pull secrets for private registries such as private
# GHCR packages or future Harbor projects.
# Example:
# imagePullSecrets:
#   - name: ghcr-pull-secret
imagePullSecrets: []

container:
  port: 80
  env: []

serviceAccount:
  create: true
  annotations: {}

podAnnotations: {}
podLabels: {}

# Secure by default. New services inherit a hardened pod/container context.
# A workload that genuinely needs to relax this (e.g. a legacy image that writes
# to its root filesystem or binds a privileged port) sets `enabled: false` and,
# if needed, provides its own relaxed values in the environment descriptor.
podSecurityContext:
  enabled: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  enabled: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Container HTTP probes. Disabled by default so simple services without a health
# endpoint are unaffected. Enable per service once the app exposes a health path.
probes:
  readiness:
    enabled: false
    path: /healthz
    port: http
    timing: {}
  liveness:
    enabled: false
    path: /healthz
    port: http
    timing: {}
  startup:
    enabled: false
    path: /healthz
    port: http
    timing: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Horizontal Pod Autoscaler. When enabled, the workload's replicas field is left
# unmanaged by this chart so the HPA owns scaling. Targets the Rollout when
# rollout.enabled, otherwise the Deployment.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: null

# Pod Disruption Budget. Set exactly one of minAvailable / maxUnavailable.
pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

# Prometheus scraping via a ServiceMonitor (requires the Prometheus Operator CRDs
# on the target cluster). Scrapes the named Service port.
metrics:
  enabled: false
  path: /metrics
  port: http
  interval: 30s

# External Secrets Operator integration. Materializes a Kubernetes Secret from the
# platform secret store. Defaults to the NQLabs 1Password-backed ClusterSecretStore.
externalSecrets:
  enabled: false
  store: nqlabs-1password
  storeKind: ClusterSecretStore
  refreshInterval: 1h
  targetName: ""
  data: []
  # Example:
  # data:
  #   - secretKey: DATABASE_URL
  #     remoteRef:
  #       key: demo/staging/database-url
  #       property: ""

# Namespace-scoped guardrails. The Mac lab uses dedicated service-environment
# namespaces such as <service>-staging or <service>-production so these apply to
# one service environment instead of a shared environment namespace.
resourceQuota:
  enabled: false
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.memory: 1Gi
    pods: "4"
  scopes: []
  scopeSelector: {}

limitRange:
  enabled: false
  limits:
    - type: Container
      default:
        memory: 128Mi
      defaultRequest:
        cpu: 10m
        memory: 32Mi

# Optional namespaced Kubernetes API permissions for the service account. Keep
# disabled by default: most application pods should not need Kubernetes API access.
rbac:
  create: false
  rules: []

# Optional Cilium policy for workload isolation. CiliumNetworkPolicy is the
# preferred NQLabs service policy mechanism because Cilium is the platform CNI and
# supports richer L3/L4/L7/FQDN controls than standard Kubernetes NetworkPolicy.
ciliumNetworkPolicy:
  enabled: false
  # Defaults to this chart's app selector when left empty.
  endpointSelector: {}
  # Enable default deny per direction when the policy is enabled. Add explicit
  # ingress/egress allow rules before enabling for real workloads.
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress: []
  egress: []
  ingressDeny: []
  egressDeny: []

rollout:
  enabled: false
  # Exact-weight canary via the Argo Rollouts Gateway API plugin. When enabled,
  # the chart renders canary/stable Services and a weighted HTTPRoute that the
  # plugin adjusts through the canary steps. Requires the gatewayAPI plugin in the
  # cluster's argo-rollouts controller. Default off = replica-ratio basic canary.
  trafficRouting:
    enabled: false
  strategy:
    canary:
      maxSurge: 25%
      maxUnavailable: 0

service:
  type: ClusterIP
  port: 80

# Legacy single route. Kept for simple services. Prefer the structured `routes`
# block below for new applications that distinguish internal vs public exposure.
route:
  enabled: false
  host: ""
  annotations: {}
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  path:
    type: PathPrefix
    value: /

# Structured exposure (recommended for new services). Each class is opt-in.
#   internal -> private *.nqlabs.network, internal Gateway, DNS-01 trusted TLS
#   public   -> public *.nqlabs.io, public Gateway/edge, EXPLICIT paths only
#   preview  -> private *.nqlabs.network only
# Public exposure must declare explicit paths and should require review before
# enabling in production. A routine image update must never add public exposure.
routes:
  internal:
    enabled: false
    host: ""
    gateway:
      name: platform-gateway
      namespace: platform
      sectionName: https
    annotations: {}
    paths:
      - type: PathPrefix
        value: /
  public:
    enabled: false
    host: ""
    gateway:
      name: platform-gateway
      namespace: platform
      sectionName: https
    annotations: {}
    # No default path: public exposure must declare explicit, reviewed paths.
    paths: []
  preview:
    enabled: false
    host: ""
    gateway:
      name: platform-gateway
      namespace: platform
      sectionName: https
    annotations: {}
    paths:
      - type: PathPrefix
        value: /

# Multi-workload applications. When this map is non-empty, the chart renders one
# Deployment/Rollout (+ Service/HPA/PDB/ServiceMonitor/routes) per entry and the
# legacy single-workload values above are ignored. Empty = legacy single workload.
# Example:
#   workloads:
#     api:    { kind: rollout, container: { port: 8080 }, routes: { internal: { enabled: true, host: api.staging.nqlabs.network } } }
#     worker: { kind: deployment, command: [run, worker] }
workloads: {}

# Declarative runtime dependencies (review 5.9). `secrets` materialize via External
# Secrets into a <fullname>-deps Secret that every container consumes with envFrom;
# `externalServices` document required egress (FQDN allowlist intent for policy).
dependencies:
  secrets: []
  # - envVar: DATABASE_URL
  #   remoteRef: { key: <app>/<env>/database-url }
  externalServices: []
  # - name: payment-provider
  #   host: api.payment-provider.example

# Non-secret configuration. Each key/value becomes a ConfigMap entry that every
# container consumes via envFrom. Empty = no ConfigMap. Example:
#   config:
#     LOG_LEVEL: info
#     FEATURE_X: "true"
config: {}
