app:
  name: ""

environment:
  name: ""

replicaCount: 1

image:
  repository: traefik/whoami
  tag: v1.11.0
  pullPolicy: IfNotPresent

# Optional Kubernetes image pull secrets for private registries such as private
# GHCR packages or future Harbor projects.
# Example:
# imagePullSecrets:
#   - name: ghcr-pull-secret
imagePullSecrets: []

container:
  port: 80
  env: []

serviceAccount:
  create: true
  annotations: {}
  # Cloud identity provider abstraction. When set to a provider other than
  # `none`, the chart renders the provider-specific annotations on the
  # ServiceAccount so the cloud's workload-identity mechanism binds the K8s
  # SA to a cloud IAM role.
  identity:
    provider: none  # none | gcp-wif | aws-irsa | azure-mi
    # GCP Workload Identity Federation
    gcpServiceAccount: ""
    # AWS IAM Roles for Service Accounts
    awsRoleARN: ""
    # Azure Workload Identity
    azureClientID: ""
    azureTenantID: ""

podAnnotations: {}
podLabels: {}

# Secure by default. New services inherit a hardened pod/container context.
# A workload that genuinely needs to relax this (e.g. a legacy image that writes
# to its root filesystem or binds a privileged port) sets `enabled: false` and,
# if needed, provides its own relaxed values in the environment descriptor.
podSecurityContext:
  enabled: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  enabled: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Container HTTP probes. Disabled by default so simple services without a health
# endpoint are unaffected. Enable per service once the app exposes a health path.
probes:
  readiness:
    enabled: false
    path: /healthz
    port: http
    timing: {}
  liveness:
    enabled: false
    path: /healthz
    port: http
    timing: {}
  startup:
    enabled: false
    path: /healthz
    port: http
    timing: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Horizontal Pod Autoscaler. When enabled, the workload's replicas field is left
# unmanaged by this chart so the HPA owns scaling. Targets the Rollout when
# rollout.enabled, otherwise the Deployment.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: null

# Pod Disruption Budget. Set exactly one of minAvailable / maxUnavailable.
pdb:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

# Prometheus scraping via a ServiceMonitor (requires the Prometheus Operator CRDs
# on the target cluster). Scrapes the named Service port.
metrics:
  enabled: false
  path: /metrics
  port: http
  interval: 30s

# ── Observability automation ──────────────────────────────────────────────
# When enabled, the chart generates the resources needed for the service to
# appear in Gatus (uptime), Alertmanager (alerts), Grafana (dashboards), and
# Tempo (traces) — with zero manual configuration.

# Uptime monitoring via Gatus. Generates a ConfigMap with a Gatus endpoint
# entry. The Gatus deployment is configured to load all ConfigMaps with label
# gatus.io/enabled: "true" from any namespace via a projected volume.
gatus:
  enabled: true
  group: ""  # defaults to the service name
  interval: 1m
  # Conditions for the health check. Defaults to HTTP 200.
  conditions:
    - "[STATUS] == 200"
  # URL is derived from the internal route host if available, otherwise
  # the in-cluster service URL. Override per-service if needed.
  url: ""

# Prometheus alert rules. Generates a PrometheusRule with default alert rules
# for the service: high 5xx rate, high p99 latency, pod restarts, OOMKilled.
# Rules use the platform's standard PrometheusRule labels.
prometheusRule:
  enabled: true
  # Severity for default rules
  severity: warning
  # Additional rules appended after the defaults
  additionalRules: []

# Grafana dashboard. Generates a ConfigMap with label grafana_dashboard: "1"
# containing a default dashboard (request rate, error rate, latency p50/p95/p99,
# pod CPU/memory, restart count). The Grafana sidecar provisioner auto-imports
# ConfigMaps with this label from all namespaces.
grafanaDashboard:
  enabled: true

# OpenTelemetry tracing. Injects OTel environment variables into every
# container's env block so services using OTel SDKs send traces to the platform
# OTel Collector → Tempo automatically.
otel:
  enabled: true
  endpoint: http://otel-collector.monitoring.svc.cluster.local:4318
  # Service name defaults to the chart's app name if empty
  serviceName: ""

# External Secrets Operator integration. Materializes a Kubernetes Secret from the
# platform secret store. Defaults to the NQLabs OpenBao-backed ClusterSecretStore.
externalSecrets:
  enabled: false
  store: nqlabs-openbao
  storeKind: ClusterSecretStore
  refreshInterval: 1h
  targetName: ""
  data: []
  # Example:
  # data:
  #   - secretKey: DATABASE_URL
  #     remoteRef:
  #       key: demo/staging/database-url
  #       property: ""

# ── Data layer ────────────────────────────────────────────────────────────
# When enabled, the chart generates a CloudNativePG PostgreSQL cluster with
# PgBouncer connection pooling, CiliumNetworkPolicy isolation, monitoring
# (ServiceMonitor + PrometheusRule + Gatus), and optional WAL archiving +
# scheduled backups to Ceph RGW.
#
# The database password is pulled from the platform secret store via ESO.
# The secret key is: <service>/<environment>/database with properties
# `username` and `password`.
#
# Tiers:
#   small    — 1 instance, 5Gi, 100m/256Mi (staging, dev)
#   standard — 2 instances (HA), 10Gi, 250m/512Mi (production)
#   large    — 3 instances (HA), 20Gi, 500m/1Gi (high-traffic production)
database:
  enabled: false
  tier: small  # small | standard | large
  version: "17.6"
  storageClass: ceph-block  # Ceph RBD for staging/production; local-path for management
  storage: ""  # override tier default if needed (e.g. "5Gi")
  backup:
    enabled: true
    schedule: "0 2 * * *"  # daily at 02:00 UTC
    retention: "7d"

# Valkey (BSD Redis fork) for caching and queues. When enabled, the chart
# generates a Valkey StatefulSet with persistent storage, CiliumNetworkPolicy
# isolation, and monitoring (ServiceMonitor + PrometheusRule + Gatus).
#
# The Valkey password is pulled from the platform secret store via ESO.
# The secret key is: <service>/<environment>/redis with property `password`.
redis:
  enabled: false
  ha: false  # false = single-node (staging), true = 3-node HA (production)
  storageClass: ceph-block
  storage: "1Gi"
  maxmemoryPolicy: noeviction  # noeviction | allkeys-lru | allkeys-lfu | volatile-lru
  passwordSecretKey: redis  # secret store key for the password

# Kafka event streaming. When enabled, the chart:
#   1. Creates a per-service SASL credential ExternalSecret
#   2. Provisions the service's Kafka topics via a PostSync Job (rpk)
#   3. Adds a CiliumNetworkPolicy allowing this service to reach Kafka
#
# The SASL credentials are pulled from the platform secret store.
# The secret key is: <service>/<environment>/kafka with properties
# `username` and `password`.
#
# Topic config:
#   name        — Kafka topic name (required)
#   partitions  — Number of partitions (default: 1)
#   replicas    — Replication factor (default: 1, set to 3 for HA)
#   retentionMs — Message retention in ms (default: 604800000 = 7 days)
kafka:
  enabled: false
  brokers: "kafka.kafka.svc.cluster.local:9092"
  topics: []
  # Example:
  # topics:
  #   - name: my-service.events
  #     partitions: 3
  #     replicas: 1
  #     retentionMs: 604800000
  #   - name: my-service.commands
  #     partitions: 1
  #     replicas: 1

# Namespace-scoped guardrails. The Mac lab uses dedicated service-environment
# namespaces such as <service>-staging or <service>-production so these apply to
# one service environment instead of a shared environment namespace.
resourceQuota:
  enabled: false
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.memory: 1Gi
    pods: "4"
  scopes: []
  scopeSelector: {}

limitRange:
  enabled: false
  limits:
    - type: Container
      default:
        memory: 128Mi
      defaultRequest:
        cpu: 10m
        memory: 32Mi

# Optional namespaced Kubernetes API permissions for the service account. Keep
# disabled by default: most application pods should not need Kubernetes API access.
rbac:
  create: false
  rules: []

# Optional Cilium policy for workload isolation. CiliumNetworkPolicy is the
# preferred NQLabs service policy mechanism because Cilium is the platform CNI and
# supports richer L3/L4/L7/FQDN controls than standard Kubernetes NetworkPolicy.
ciliumNetworkPolicy:
  enabled: true
  # Defaults to this chart's app selector when left empty.
  endpointSelector: {}
  # Default-deny ingress, then allow normal in-cluster sources. This pairs with
  # the clusterwide service-namespace CCNP so new apps inherit isolation instead
  # of depending on a human remembering to enable policy.
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    - fromEntities:
        - cluster
        - host
        - remote-node
        - health
        - ingress
        - kube-apiserver
  egress: []
  ingressDeny: []
  egressDeny: []

rollout:
  enabled: false
  # Exact-weight canary via the Argo Rollouts Gateway API plugin. When enabled,
  # the chart renders canary/stable Services and a weighted HTTPRoute that the
  # plugin adjusts through the canary steps. Requires the gatewayAPI plugin in the
  # cluster's argo-rollouts controller. Default off = replica-ratio basic canary.
  trafficRouting:
    enabled: false
  # Metric-driven rollout: a background AnalysisRun probes the canary during the
  # rollout and auto-aborts (rolls back) on repeated failure. Default provider is
  # an HTTP 2xx Job check (no Prometheus needed). Set analysis.prometheus.address +
  # query to use a Prometheus success-rate metric instead.
  analysis:
    enabled: false
    interval: 30s
    failureLimit: 3
    prometheus:
      address: ""
      query: ""
      successCondition: "result[0] >= 0.95"
  strategy:
    canary:
      maxSurge: 25%
      maxUnavailable: 0

service:
  type: ClusterIP
  port: 80

# Legacy single route. Kept for simple services. Prefer the structured `routes`
# block below for new applications that distinguish internal vs public exposure.
route:
  enabled: false
  host: ""
  annotations: {}
  timeouts:
    request: 300s
    backendRequest: 300s
  parentRefs:
    - name: platform-gateway
      namespace: platform
      sectionName: https
  path:
    type: PathPrefix
    value: /

# Structured exposure (recommended for new services). Each class is opt-in.
#   internal -> private *.nqlabs.network, internal Gateway, DNS-01 trusted TLS
#   public   -> public *.nqlabs.io, public Gateway/edge, EXPLICIT paths only
#   preview  -> private *.nqlabs.network only
# Public exposure must declare explicit paths and should require review before
# enabling in production. A routine image update must never add public exposure.
routes:
  internal:
    enabled: false
    host: ""
    gateway:
      name: platform-gateway
      namespace: platform
      sectionName: https
    annotations: {}
    timeouts:
      request: 300s
      backendRequest: 300s
    paths:
      - type: PathPrefix
        value: /
  public:
    enabled: false
    host: ""
    gateway:
      name: platform-gateway
      namespace: platform
      sectionName: https
    annotations: {}
    timeouts:
      request: 300s
      backendRequest: 300s
    # No default path: public exposure must declare explicit, reviewed paths.
    paths: []
  preview:
    enabled: false
    host: ""
    gateway:
      name: platform-gateway
      namespace: platform
      sectionName: https
    annotations: {}
    timeouts:
      request: 300s
      backendRequest: 300s
    paths:
      - type: PathPrefix
        value: /

# Multi-workload applications. When this map is non-empty, the chart renders one
# Deployment/Rollout (+ Service/HPA/PDB/ServiceMonitor/routes) per entry and the
# legacy single-workload values above are ignored. Empty = legacy single workload.
# Example:
#   workloads:
#     api:    { kind: rollout, container: { port: 8080 }, routes: { internal: { enabled: true, host: api.staging.nqlabs.network } } }
#     worker: { kind: deployment, command: [run, worker] }
workloads: {}

# Declarative runtime dependencies (review 5.9). `secrets` materialize via External
# Secrets into a <fullname>-deps Secret that every container consumes with envFrom;
# `externalServices` document required egress (FQDN allowlist intent for policy).
dependencies:
  secrets: []
  # - envVar: DATABASE_URL
  #   remoteRef: { key: <app>/<env>/database-url }
  externalServices: []
  # - name: payment-provider
  #   host: api.payment-provider.example

# Non-secret configuration. Each key/value becomes a ConfigMap entry that every
# container consumes via envFrom. Empty = no ConfigMap. Example:
#   config:
#     LOG_LEVEL: info
#     FEATURE_X: "true"
config: {}

# Preview workload selectivity (review 5.3). In preview mode, workloads typed
# `worker` are skipped unless preview.workers, and `scheduler` unless
# preview.scheduler. The preview workflow sets these from /preview deploy flags.
preview:
  active: false
  workers: false
  scheduler: false
