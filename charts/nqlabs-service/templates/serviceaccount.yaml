{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nqlabs-service.serviceAccountName" . }}
  labels:
    {{- include "nqlabs-service.labels" . | nindent 4 }}
  {{- $annotations := deepCopy .Values.serviceAccount.annotations }}
  {{- /* Cloud identity provider annotations */}}
  {{- $identity := .Values.serviceAccount.identity }}
  {{- if eq $identity.provider "gcp-wif" }}
  {{- $_ := set $annotations "iam.gke.io/gcp-service-account" $identity.gcpServiceAccount }}
  {{- else if eq $identity.provider "aws-irsa" }}
  {{- $_ := set $annotations "eks.amazonaws.com/role-arn" $identity.awsRoleARN }}
  {{- else if eq $identity.provider "azure-mi" }}
  {{- $_ := set $annotations "azure.workload.identity/client-id" $identity.azureClientID }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
