{{- if and .Values.rollout.enabled .Values.rollout.trafficRouting.enabled -}}
{{- $top := . -}}
{{- range $svc := (list "stable" "canary") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nqlabs-service.fullname" $top }}-{{ $svc }}
  labels:
    {{- include "nqlabs-service.labels" $top | nindent 4 }}
    nqlabs.network/rollout-role: {{ $svc }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $top.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nqlabs-service.selectorLabels" $top | nindent 4 }}
{{- end }}
{{- end }}
