{{- if and (not .Values.workloads) .Values.route.enabled -}}
{{- if not .Values.route.host -}}
{{- fail "route.host is required when route.enabled=true" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "nqlabs-service.fullname" . }}
  labels:
    {{- include "nqlabs-service.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.route.host | quote }}
    {{- with .Values.route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.route.host | quote }}
  rules:
    - matches:
        - path:
            type: {{ .Values.route.path.type }}
            value: {{ .Values.route.path.value | quote }}
      backendRefs:
        {{- if .Values.rollout.trafficRouting.enabled }}
        - name: {{ include "nqlabs-service.fullname" . }}-stable
          port: {{ .Values.service.port }}
          weight: 100
        - name: {{ include "nqlabs-service.fullname" . }}-canary
          port: {{ .Values.service.port }}
          weight: 0
        {{- else }}
        - name: {{ include "nqlabs-service.fullname" . }}
          port: {{ .Values.service.port }}
        {{- end }}
      {{- with .Values.route.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
