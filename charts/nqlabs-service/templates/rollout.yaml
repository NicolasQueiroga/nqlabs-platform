{{- if and (not .Values.workloads) .Values.rollout.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "nqlabs-service.fullname" . }}
  labels:
    {{- include "nqlabs-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    canary:
      {{- if .Values.rollout.trafficRouting.enabled }}
      canaryService: {{ include "nqlabs-service.fullname" . }}-canary
      stableService: {{ include "nqlabs-service.fullname" . }}-stable
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: {{ include "nqlabs-service.fullname" . }}
            namespace: {{ .Release.Namespace }}
      {{- end }}
      {{- if .Values.rollout.analysis.enabled }}
      analysis:
        startingStep: 1
        templates:
          - templateName: {{ include "nqlabs-service.fullname" . }}-canary-health
        args:
          - name: service-url
            value: {{ printf "http://%s.%s.svc.cluster.local:%v/" (ternary (printf "%s-canary" (include "nqlabs-service.fullname" .)) (include "nqlabs-service.fullname" .) .Values.rollout.trafficRouting.enabled) .Release.Namespace .Values.service.port }}
      {{- end }}
      {{- toYaml .Values.rollout.strategy.canary | nindent 6 }}
  selector:
    matchLabels:
      {{- include "nqlabs-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nqlabs-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "nqlabs-service.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "nqlabs-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          {{- $otelEnv := include "nqlabs-service.otelEnv" . | fromYamlArray }}
          {{- if or .Values.container.env .Values.otel.enabled }}
          env:
            {{- with .Values.container.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            {{- toYaml $otelEnv | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- $df := include "nqlabs-service.depsEnvFrom" . }}
          {{- if $df }}
          {{- $df | nindent 10 }}
          {{- end }}
          {{- if .Values.securityContext.enabled }}
          securityContext:
            {{- omit .Values.securityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- $probes := include "nqlabs-service.probes" . }}
          {{- if $probes }}
          {{- $probes | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
