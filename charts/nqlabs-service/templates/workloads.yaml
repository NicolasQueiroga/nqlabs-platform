{{- /*
Multi-workload mode. When `.Values.workloads` is a non-empty map, render one
Deployment/Rollout (+ Service / HPA / PDB / ServiceMonitor / routes) per entry.
When it is empty, the legacy single-workload templates render instead, so an
existing simple service is unchanged.
*/ -}}
{{- if .Values.workloads }}
{{- $root := . }}
{{- $pv := .Values.preview }}
{{- range $name, $wl := .Values.workloads }}
{{- $type := dig "type" "web" $wl }}
{{- /* Skip a workload if explicitly disabled, or suppressed in preview mode:
       workers off unless preview.workers, schedulers off unless preview.scheduler. */ -}}
{{- $previewSkip := and $pv.active (or (and (eq $type "worker") (not $pv.workers)) (and (eq $type "scheduler") (not $pv.scheduler))) }}
{{- if and (dig "enabled" true $wl) (not $previewSkip) }}
{{- $ctx := dict "root" $root "name" $name "wl" $wl }}
---
{{ include "nqlabs-service.wl.workload" $ctx }}
{{- if dig "container" "port" 0 $wl }}
{{- if dig "service" "enabled" true $wl }}
---
{{ include "nqlabs-service.wl.service" $ctx }}
{{- end }}
{{- end }}
{{- if dig "autoscaling" "enabled" false $wl }}
---
{{ include "nqlabs-service.wl.hpa" $ctx }}
{{- end }}
{{- if dig "pdb" "enabled" false $wl }}
---
{{ include "nqlabs-service.wl.pdb" $ctx }}
{{- end }}
{{- if dig "metrics" "enabled" false $wl }}
---
{{ include "nqlabs-service.wl.servicemonitor" $ctx }}
{{- end }}
{{- if $wl.routes }}
{{ include "nqlabs-service.wl.routes" $ctx }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
