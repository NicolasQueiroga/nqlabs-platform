# Per-environment runtime state for demo/production. Identity + shape come from
# ../app.yaml (merged under this file). Only runtime lives here.
app:
  name: demo

environment:
  name: production
  namespace: demo

argocd:
  project: services-production
  valueFile: apps/demo/environments/production.yaml
  destination:
    name: nqlabs-production

image:
  repository: ghcr.io/nicolasqueiroga/nqlabs-demo
  tag: sha-aec3a454e4aa

route:
  enabled: true
  host: demo.production.nqlabs.network
