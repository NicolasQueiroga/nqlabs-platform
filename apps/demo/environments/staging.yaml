app:
  name: demo

environment:
  name: staging
  # Cluster is the environment boundary, so the namespace is the plain service
  # name. This namespace lives in the remote nqlabs-staging cluster.
  namespace: demo

argocd:
  project: services-staging
  valueFile: apps/demo/environments/staging.yaml
  destination:
    name: nqlabs-staging

replicaCount: 1

image:
  repository: ghcr.io/nicolasqueiroga/nqlabs-demo
  tag: sha-05ac950ffc3f
  pullPolicy: IfNotPresent

container:
  port: 80

# The demo image is an nginx server on :80 (writable root fs, privileged port),
# so it opts out of the chart's hardened security defaults. Real services should
# keep the secure defaults and listen on a non-privileged port.
podSecurityContext:
  enabled: false
securityContext:
  enabled: false

rollout:
  enabled: true
  strategy:
    canary:
      maxSurge: 25%
      maxUnavailable: 0

service:
  port: 80

route:
  enabled: true
  host: demo.staging.nqlabs.network
