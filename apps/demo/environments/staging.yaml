app:
  name: demo

environment:
  name: staging
  namespace: demo-staging

argocd:
  project: services-staging
  valueFile: apps/demo/environments/staging.yaml

replicaCount: 1

image:
  repository: ghcr.io/nicolasqueiroga/nqlabs-demo
  tag: sha-58c0e7ab0b31
  pullPolicy: IfNotPresent

container:
  port: 80

rollout:
  enabled: true
  strategy:
    canary:
      maxSurge: 25%
      maxUnavailable: 0

service:
  port: 80

route:
  enabled: true
  host: demo.staging.nqlabs.network
