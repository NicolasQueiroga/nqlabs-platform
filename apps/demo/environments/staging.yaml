# Per-environment runtime state for demo/staging. Identity + shape come from
# ../app.yaml (merged under this file). Only runtime lives here.
app:
  name: demo

environment:
  name: staging
  namespace: demo

argocd:
  project: services-staging
  valueFile: apps/demo/environments/staging.yaml
  destination:
    name: nqlabs-staging

image:
  repository: ghcr.io/nicolasqueiroga/nqlabs-demo
  tag: sha-5e13c02a11c3

route:
  enabled: true
  host: demo.staging.nqlabs.network
