# Per-environment runtime state for demo/staging. Identity + shape come from
# ../app.yaml (merged under this file). Only runtime lives here.
app:
  name: demo

environment:
  name: staging
  namespace: demo

argocd:
  project: services-staging
  valueFile: apps/demo/environments/staging.yaml
  destination:
    name: nqlabs-staging

image:
  repository: ghcr.io/nicolasqueiroga/nqlabs-demo
  tag: sha-55f42774beba

container:
  port: 8080

service:
  port: 8080

podSecurityContext:
  enabled: true

securityContext:
  enabled: true

podAnnotations:
  nqlabs.network/restartedAt: "2026-06-23T02:44:00Z"

route:
  enabled: true
  host: demo.staging.nqlabs.network
